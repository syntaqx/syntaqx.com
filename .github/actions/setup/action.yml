name: Setup
description: Node from .nvmrc, with node_modules restored from cache or installed with npm ci.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Restore node_modules
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        # Keyed on .nvmrc (the major), not the exact patch: runners resolve
        # "24" to different patches, and installed modules work across them.
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
