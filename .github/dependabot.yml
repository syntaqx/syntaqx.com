version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflows, plus the local composite action (which Dependabot doesn't
    # find from "/" alone). Actions are SHA-pinned; Dependabot bumps the
    # SHA and its version comment together.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # next and its config must move in lockstep.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      # react runtime + its type packages together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      sentry:
        patterns:
          - "@sentry/*"
      types:
        patterns:
          - "@types/*"
      # Everything else: one PR for prod, one for dev (minor + patch).
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
