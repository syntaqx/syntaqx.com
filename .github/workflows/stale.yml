name: Stale

# Issues and pull requests that go quiet get a nudge, then close, so nothing
# waits on memory. Any comment, push or label change resets the clock; a
# reopened item starts over. Pull requests move faster than issues because
# they usually wait on their author.
#
# Exempt: anything labelled `pinned`, Dependabot updates (`dependencies`) and
# drafts. https://github.com/actions/stale

on:
  schedule:
    - cron: "30 13 * * *" # daily, 13:30 UTC
  workflow_dispatch:

concurrency:
  group: stale
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-pr-label: stale
          stale-issue-label: stale
          days-before-pr-stale: 14
          days-before-pr-close: 7
          days-before-issue-stale: 60
          days-before-issue-close: 14
          exempt-pr-labels: pinned,dependencies
          exempt-issue-labels: pinned
          exempt-draft-pr: true
          stale-pr-message: >
            This pull request has had no activity for 14 days. If you're still
            working on it, push a change or leave a comment and it stays open;
            otherwise it closes in 7 days. Thanks for contributing!
          close-pr-message: >
            Closed after 21 days without activity. You're welcome to reopen it
            (or open a new one) whenever you pick it back up.
          stale-issue-message: >
            This issue has had no activity for 60 days. Comment if it still
            matters and it stays open; otherwise it closes in 14 days.
          close-issue-message: >
            Closed after 74 days without activity. Reopen it if it comes back.
