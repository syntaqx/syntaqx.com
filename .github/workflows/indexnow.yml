name: IndexNow

# After each production deploy, tell IndexNow (Bing, Yandex and the engines
# that share it) which pages changed: scripts/indexnow.mjs hashes what every
# page renders and compares it with the previous run's manifest, kept as this
# workflow's artifact. Vercel reports its deploys to GitHub as deployments.
# A manual run can submit every URL, or dry-run to list what would go. The key
# is the INDEXNOW_KEY repository variable, served from public/<key>.txt.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false
      dry_run:
        description: List what would be submitted, send nothing
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  MANIFEST: indexnow-manifest

jobs:
  submit:
    name: Submit changed URLs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The newest manifest any run kept; none on the first run or once it expires.
      - name: Fetch the previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$MANIFEST&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')
          if [ -n "$run" ]; then
            gh run download "$run" --name "$MANIFEST" --dir previous
          else
            echo "No previous manifest"
          fi

      - name: Submit
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          COMMIT: ${{ github.event.deployment.sha }}
          ALL: ${{ inputs.all && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          node scripts/indexnow.mjs --manifest previous/manifest.json --out manifest.json \
            ${COMMIT:+--commit "$COMMIT"} ${ALL:+--all} ${DRY_RUN:+--dry-run}

      # A dry run leaves the previous manifest as the one to compare against.
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MANIFEST }}
          path: manifest.json
          retention-days: 90
