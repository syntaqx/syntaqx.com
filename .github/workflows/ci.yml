name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Lint, typecheck and test run as parallel jobs, so the pipeline takes as
# long as the slowest one. Each job restores node_modules from a cache keyed
# on the lockfile, so parallelism doesn't mean paying for `npm ci` three
# times. See https://www.syntaqx.com/docs/ci-pipelines

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # The same Redis + Upstash-compatible REST proxy as compose.yml, so the
    # rate limiter's integration tests run against a real Redis.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http:0.0.10
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: local_dev_token
          SRH_CONNECTION_STRING: redis://redis:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test
