name: Dependabot auto-merge

# Dependabot's minor and patch updates (and every grouped update, which only
# carries minor and patch) merge themselves: this approves the PR and turns on
# auto-merge, and GitHub squashes it once the required checks (Lint, Test,
# Typecheck) pass. Majors are left for a person to read the changelog.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR"
          gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
