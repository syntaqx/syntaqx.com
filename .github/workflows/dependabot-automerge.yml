name: Dependabot auto-merge

# Dependabot's minor and patch updates (and every grouped update, which only
# carries minor and patch) merge themselves: this turns on auto-merge, and
# GitHub squashes the PR once the required checks (Lint, Test, Typecheck) pass.
# main requires those checks, not a review, so no approval is needed (and
# GitHub Actions isn't allowed to approve pull requests anyway). Majors are left
# for a person to read the changelog.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
