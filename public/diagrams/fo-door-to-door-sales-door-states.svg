<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270">
  <defs>
    <marker id="fo-dds-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-dds-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="40" y="30">door</text>
  <text class="cap" x="200" y="30">knock</text>
  <text class="cap" x="410" y="30">outcome</text>
  <text class="cap" x="600" y="30">next</text>

  <!-- Unknocked -->
  <rect class="cell" x="40" y="114" width="110" height="26"/>
  <text class="t" x="95" y="127" text-anchor="middle" dominant-baseline="central">unknocked</text>

  <!-- Not home, loops back -->
  <rect class="cell" x="200" y="54" width="130" height="26"/>
  <text class="t" x="265" y="67" text-anchor="middle" dominant-baseline="central">not home</text>
  <path class="ln" d="M150,127C175,127 175,67 198,67" marker-end="url(#fo-dds-ah)"/>
  <path class="ln dash" d="M265,54C265,36 95,36 95,112" marker-end="url(#fo-dds-ah)"/>
  <text class="n" x="88" y="82" text-anchor="end">revisit</text>

  <!-- Conversation -->
  <rect class="cell hl" x="200" y="134" width="130" height="26"/>
  <text class="t hl" x="265" y="147" text-anchor="middle" dominant-baseline="central">conversation</text>
  <path class="ln hl" d="M150,127C175,127 175,147 198,147" marker-end="url(#fo-dds-ah-hl)"/>

  <!-- Outcomes -->
  <rect class="cell" x="410" y="54" width="150" height="26"/>
  <text class="t" x="485" y="67" text-anchor="middle" dominant-baseline="central">not interested</text>
  <rect class="cell" x="410" y="94" width="150" height="26"/>
  <text class="t" x="485" y="107" text-anchor="middle" dominant-baseline="central">callback</text>
  <rect class="cell" x="410" y="134" width="150" height="26"/>
  <text class="t" x="485" y="147" text-anchor="middle" dominant-baseline="central">appointment set</text>
  <rect class="cell hl end" x="410" y="174" width="150" height="26"/>
  <text class="t hl b" x="485" y="187" text-anchor="middle" dominant-baseline="central">sold</text>

  <path class="ln" d="M330,147C370,147 370,67 408,67" marker-end="url(#fo-dds-ah)"/>
  <path class="ln" d="M330,147C370,147 370,107 408,107" marker-end="url(#fo-dds-ah)"/>
  <path class="ln" d="M330,147H408" marker-end="url(#fo-dds-ah)"/>
  <path class="ln hl" d="M330,147C370,147 370,187 408,187" marker-end="url(#fo-dds-ah-hl)"/>

  <!-- Next steps -->
  <text class="n" x="580" y="71">rest for a set period</text>
  <text class="n" x="580" y="111">follow-up task, drip</text>
  <text class="n" x="580" y="151">calendar, reminder</text>
  <text class="n hl" x="580" y="191">agreement, cooling-off</text>

  <!-- Do not knock overrides everything -->
  <path class="ln dash" d="M95,140V222M265,160V222M485,200V222" marker-end="url(#fo-dds-ah)"/>
  <rect class="cell band" x="40" y="224" width="680" height="26"/>
  <text class="t b" x="380" y="237" text-anchor="middle" dominant-baseline="central">do not knock: registry, sign posted, or request; suppressed until it expires</text>
</svg>
