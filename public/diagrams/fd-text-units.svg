  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">UTF-8: ONE TO FOUR BYTES PER CODE POINT. THIS IS WHAT A DATABASE COLUMN, A FILE AND THE WIRE HOLD.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">UTF-16: ONE CODE UNIT BELOW U+10000, TWO (A SURROGATE PAIR) ABOVE. JAVASCRIPT, JAVA AND C# LENGTHS</text>
  <text class="nt" x="50" y="92">COUNT THESE.</text>
  <rect class="nb" x="31" y="99.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="109" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">CODE POINTS: WHAT GO'S RUNES AND RUST'S CHARS COUNT. A COMBINING ACCENT AND A SKIN TONE ARE CODE</text>
  <text class="nt" x="50" y="122">POINTS OF THEIR OWN.</text>
