  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">UTF-8: ONE TO FOUR BYTES PER CODE POINT. THIS IS WHAT A DATABASE COLUMN, A FILE AND THE WIRE HOLD.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">UTF-16: ONE CODE UNIT BELOW U+10000, TWO (A SURROGATE PAIR) ABOVE. JAVASCRIPT, JAVA AND C# LENGTHS COUNT THESE.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">CODE POINTS: WHAT GO'S RUNES AND RUST'S CHARS COUNT. A COMBINING ACCENT AND A SKIN TONE ARE CODE POINTS OF THEIR</text>
  <text class="nt" x="50" y="109">OWN.</text>
  <rect class="nb" x="32" y="117.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="125.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="126">GRAPHEME CLUSTERS (UAX #29): WHAT A READER SEES AS ONE CHARACTER. LIMITS, TRUNCATION AND CURSORS USE THESE.</text>
  <text class="nt" x="50" y="143">EVERY ROW IS ALIGNED TO THE UTF-8 BYTES OF THE SAME TEXT. VALUES IN THE TABLE.</text>
