  <text class="n" x="110" y="627">[1] Newzoo's 2025 estimate and 2028 forecast, as summarized by GameDev Reports, June 26, 2026.</text>
  <text class="n" x="110" y="645">[2] ESA Essential Facts 2026: U.S. consumer spending on video games in 2025.</text>
  <text class="n" x="110" y="663">[3] The parts sum to 60.65; the ESA reports the total, rounded, as $60.7 billion.</text>
