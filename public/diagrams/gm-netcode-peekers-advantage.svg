<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 664">
  <defs>
    <marker id="gm-npa-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-npa-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-npa-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-NET-002</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">peeker's advantage, published figures</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <text class="vt" x="40" y="64">Plan view: peeker's advantage</text>
  <text class="vs" x="40" y="80">Scale 1 ms = 3.5 px · values in ms · Riot, July 2020 [4]</text>

  <!-- Row 1: baseline P0 -->
  <path class="ext" d="M120,117V103M613.5,117V103"/>
  <path class="dim" d="M120,108H613.5" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <text class="dt" x="366.75" y="104" text-anchor="middle">P0 = 141 [1]</text>
  <text class="sl ink" x="112" y="133" text-anchor="end" dominant-baseline="central">baseline</text>
  <rect class="obj fill-1" x="120" y="120" width="493.5" height="26"/>

  <!-- Row 2: after network and servers, P1 -->
  <path class="ext" d="M120,187V173M473.5,187V173M613.5,187V173"/>
  <path class="dim" d="M120,178H473.5" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <text class="dt" x="296.75" y="174" text-anchor="middle">P1 = P0 - N1 = 141 - 40 = 101</text>
  <path class="dim" d="M473.5,178H613.5" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <text class="dt" x="543.5" y="174" text-anchor="middle">N1 = 40 [2]</text>
  <text class="sl ink" x="112" y="203" text-anchor="end" dominant-baseline="central">servers</text>
  <rect class="obj fill-1" x="120" y="190" width="353.5" height="26"/>
  <rect class="hatch" x="473.5" y="190" width="140" height="26" fill="url(#gm-npa-hatch)"/>

  <!-- Row 3: at 144 FPS, P2, the subject -->
  <path class="ext" d="M120,257V243M368.5,257V243M473.5,257V243M613.5,257V243"/>
  <path class="dim hl" d="M120,248H368.5" marker-start="url(#gm-npa-ah-hl)" marker-end="url(#gm-npa-ah-hl)"/>
  <text class="dt hl" x="244.25" y="244" text-anchor="middle">P2 = P1 - F1 = 101 - 30 = 71</text>
  <path class="dim" d="M368.5,248H473.5" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <text class="dt" x="421" y="244" text-anchor="middle">F1 = 30 [3]</text>
  <path class="dim" d="M473.5,248H613.5" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <text class="dt" x="543.5" y="244" text-anchor="middle">N1 = 40</text>
  <text class="sl ink" x="112" y="273" text-anchor="end" dominant-baseline="central">144 fps</text>
  <rect class="obj hl" x="120" y="260" width="248.5" height="26"/>
  <rect class="hatch" x="368.5" y="260" width="245" height="26" fill="url(#gm-npa-hatch)"/>
  <path class="ln ink" d="M473.5,260V286"/>
  <text class="sl" x="624" y="203" dominant-baseline="central">removed</text>
  <text class="sl" x="624" y="273" dominant-baseline="central">removed</text>

  <!-- Detail A: buffering in frames -->
  <text class="vt" x="40" y="330">Detail A: buffering</text>
  <text class="vs" x="40" y="346">Scale 1 ms = 3.5 px · frames per Riot</text>

  <text class="sl ink" x="112" y="386" text-anchor="end" dominant-baseline="central">server</text>
  <path class="ext" d="M120,373V361M174.69,373V361"/>
  <path class="dim" d="M120,366H174.69" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <rect class="obj fill-2" x="120" y="376" width="27.34" height="20"/>
  <rect class="obj fill-2" x="147.34" y="376" width="27.35" height="20"/>
  <text class="dt" x="184" y="386" dominant-baseline="central">B1 = 2 x 7.81 = 15.63</text>

  <text class="sl ink" x="112" y="436" text-anchor="end" dominant-baseline="central">60 fps</text>
  <path class="ext" d="M120,423V411M295,423V411"/>
  <path class="dim" d="M120,416H295" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <rect class="obj fill-2" x="120" y="426" width="58.33" height="20"/>
  <rect class="obj fill-2" x="178.33" y="426" width="58.34" height="20"/>
  <rect class="obj fill-2" x="236.67" y="426" width="58.33" height="20"/>
  <text class="dt" x="304" y="436" dominant-baseline="central">B2 = 3 x 16.67 = 50.00</text>

  <text class="sl ink" x="112" y="486" text-anchor="end" dominant-baseline="central">144 fps</text>
  <path class="ext" d="M120,473V461M192.92,473V461"/>
  <path class="dim" d="M120,466H192.92" marker-start="url(#gm-npa-ah)" marker-end="url(#gm-npa-ah)"/>
  <rect class="obj fill-2" x="120" y="476" width="24.31" height="20"/>
  <rect class="obj fill-2" x="144.31" y="476" width="24.3" height="20"/>
  <rect class="obj fill-2" x="168.61" y="476" width="24.31" height="20"/>
  <text class="dt" x="202" y="486" dominant-baseline="central">B3 = 3 x 6.94 = 20.83</text>

  <text class="t" x="40" y="524" dominant-baseline="central">B2 - B3 = 50.00 - 20.83 = 29.17, about F1 [3]</text>

  <!-- Variable table -->
  <text class="vt" x="470" y="330">Variables</text>
  <text class="vs" x="470" y="346">ms · derived noted</text>
  <rect class="cell band" x="470" y="356" width="50" height="22"/>
  <rect class="cell band" x="520" y="356" width="140" height="22"/>
  <rect class="cell band" x="660" y="356" width="60" height="22"/>
  <text class="cap ink" x="478" y="367" dominant-baseline="central">code</text>
  <text class="cap ink" x="528" y="367" dominant-baseline="central">item</text>
  <text class="cap ink" x="712" y="367" text-anchor="end" dominant-baseline="central">ms</text>
  <path class="cell" d="M470,378H720V554H470Z"/>
  <path class="ln ink" d="M520,378V554M660,378V554"/>
  <path class="ln" d="M470,400H720M470,422H720M470,444H720M470,466H720M470,488H720M470,510H720M470,532H720"/>
  <text class="t" x="478" y="389" dominant-baseline="central">P0</text>
  <text class="t" x="528" y="389" dominant-baseline="central">baseline, 60 FPS</text>
  <text class="t" x="712" y="389" text-anchor="end" dominant-baseline="central">141</text>
  <text class="t" x="478" y="411" dominant-baseline="central">N1</text>
  <text class="t" x="528" y="411" dominant-baseline="central">network, 128 tick</text>
  <text class="t" x="712" y="411" text-anchor="end" dominant-baseline="central">40</text>
  <text class="t" x="478" y="433" dominant-baseline="central">P1</text>
  <text class="t" x="528" y="433" dominant-baseline="central">P0 - N1, derived</text>
  <text class="t" x="712" y="433" text-anchor="end" dominant-baseline="central">101</text>
  <text class="t" x="478" y="455" dominant-baseline="central">F1</text>
  <text class="t" x="528" y="455" dominant-baseline="central">P1 - P2, derived</text>
  <text class="t" x="712" y="455" text-anchor="end" dominant-baseline="central">30</text>
  <text class="t b" x="478" y="477" dominant-baseline="central">P2</text>
  <text class="t" x="528" y="477" dominant-baseline="central">at 144 FPS</text>
  <text class="t b" x="712" y="477" text-anchor="end" dominant-baseline="central">71</text>
  <text class="t" x="478" y="499" dominant-baseline="central">B1</text>
  <text class="t" x="528" y="499" dominant-baseline="central">server, 2 frames</text>
  <text class="t" x="712" y="499" text-anchor="end" dominant-baseline="central">15.63</text>
  <text class="t" x="478" y="521" dominant-baseline="central">B2</text>
  <text class="t" x="528" y="521" dominant-baseline="central">client, 3 at 60</text>
  <text class="t" x="712" y="521" text-anchor="end" dominant-baseline="central">50.00</text>
  <text class="t" x="478" y="543" dominant-baseline="central">B3</text>
  <text class="t" x="528" y="543" dominant-baseline="central">client, 3 at 144</text>
  <text class="t" x="712" y="543" text-anchor="end" dominant-baseline="central">20.83</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="570" width="680" height="76"/>
  <text class="sl ink" x="52" y="588">notes</text>
  <text class="n" x="52" y="606">[1] Riot: peekers have about 141 ms longer to react than holders, with a 60 FPS client. [2] Riot Direct,</text>
  <text class="n" x="52" y="622">the 35 ms target and 128-tick servers, about 40 ms (28%). [3] Riot reports about 71 ms at 144 FPS (49%);</text>
  <text class="n" x="52" y="638">F1 is the difference. [4] Holder's window = peeker's reaction - holder's round trip - buffering on both sides.</text>
</svg>
