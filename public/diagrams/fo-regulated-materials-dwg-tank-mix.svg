<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 694">
  <defs>
    <marker id="fo-rmt-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="fo-rmt-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">FO-REG-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">tank mix, one product</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Section A-A: concentrate measured into a tank -->
  <text class="vt" x="40" y="64">Section view: one tank</text>
  <text class="vs" x="40" y="80">Not to scale [2] · fl oz and gallons</text>
  <rect class="obj hl" x="70" y="330" width="44" height="70"/>
  <text class="sl ink" x="92" y="418" text-anchor="middle" dominant-baseline="central">C1 concentrate</text>
  <path class="ln ink" d="M92,326V290Q92,270 112,270H160" marker-end="url(#fo-rmt-ah)"/>
  <rect class="obj" x="170" y="110" width="150" height="290"/>
  <rect class="obj fill-2" x="170" y="140" width="150" height="260"/>
  <path class="ctr" d="M160,140H330"/>
  <text class="sl" x="175" y="128" dominant-baseline="central">fill line</text>
  <text class="sl ink" x="245" y="270" text-anchor="middle" dominant-baseline="central">finished mix</text>
  <text class="n" x="245" y="288" text-anchor="middle">water plus C1</text>
  <path class="ext" d="M323,140H353M323,400H353"/>
  <path class="dim" d="M348,140V400" marker-start="url(#fo-rmt-ah)" marker-end="url(#fo-rmt-ah)"/>
  <text class="dt" x="354" y="270" dominant-baseline="central">F1 = 2 gal</text>

  <!-- Variables -->
  <text class="vt" x="440" y="64">Variables</text>
  <text class="vs" x="440" y="80">Chapter example [1]</text>
  <rect class="cell band" x="440" y="90" width="50" height="22"/>
  <rect class="cell band" x="490" y="90" width="160" height="22"/>
  <rect class="cell band" x="650" y="90" width="90" height="22"/>
  <text class="cap ink" x="450" y="101" dominant-baseline="central">code</text>
  <text class="cap ink" x="500" y="101" dominant-baseline="central">item</text>
  <text class="cap ink" x="730" y="101" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M440,112H740V222H440Z"/>
  <path class="ln ink" d="M490,112V222M650,112V222"/>
  <path class="ln" d="M440,134H740M440,156H740M440,178H740M440,200H740"/>
  <text class="t" x="450" y="123" dominant-baseline="central">R1</text>
  <text class="t" x="500" y="123" dominant-baseline="central">label rate per gal</text>
  <text class="t" x="730" y="123" text-anchor="end" dominant-baseline="central">0.8 fl oz</text>
  <text class="t" x="450" y="145" dominant-baseline="central">F1</text>
  <text class="t" x="500" y="145" dominant-baseline="central">finished mix applied</text>
  <text class="t" x="730" y="145" text-anchor="end" dominant-baseline="central">2 gal</text>
  <text class="t b" x="450" y="167" dominant-baseline="central">C1</text>
  <text class="t" x="500" y="167" dominant-baseline="central">concentrate: R1 × F1</text>
  <text class="t b" x="730" y="167" text-anchor="end" dominant-baseline="central">1.6 fl oz</text>
  <text class="t" x="450" y="189" dominant-baseline="central">a</text>
  <text class="t" x="500" y="189" dominant-baseline="central">AI share of C1</text>
  <text class="t" x="730" y="189" text-anchor="end" dominant-baseline="central">[TBD]</text>
  <text class="t" x="450" y="211" dominant-baseline="central">A1</text>
  <text class="t" x="500" y="211" dominant-baseline="central">active ingr.: C1 × a</text>
  <text class="t" x="730" y="211" text-anchor="end" dominant-baseline="central">[TBD]</text>
  <text class="t" x="440" y="252">C1 = R1 × F1 = 0.8 × 2 = 1.6</text>
  <text class="t" x="440" y="272">A1 = C1 × a = 1.6 × [TBD]</text>
  <text class="n" x="440" y="298">entered: product, mix and F1</text>
  <text class="n" x="440" y="316">from the label version: R1 and a</text>
  <text class="n" x="440" y="334">computed and stored: C1 and A1 [3]</text>

  <!-- Plan view: the rate against the label's range -->
  <text class="vt" x="40" y="452">Plan view: rate check at entry</text>
  <text class="vs" x="40" y="468">Scale proportional · label range [TBD] from the label version</text>
  <rect class="hatch" x="100" y="520" width="160" height="30" fill="url(#fo-rmt-hatch)"/>
  <rect class="obj fill-2" x="260" y="520" width="280" height="30"/>
  <rect class="hatch" x="540" y="520" width="160" height="30" fill="url(#fo-rmt-hatch)"/>
  <text class="sl ink" x="470" y="535" text-anchor="middle" dominant-baseline="central">within label</text>
  <path class="ext" d="M260,517V493M540,517V493"/>
  <path class="dim" d="M260,498H540" marker-start="url(#fo-rmt-ah)" marker-end="url(#fo-rmt-ah)"/>
  <text class="dt" x="400" y="494" text-anchor="middle">L1 = Rmax - Rmin = [TBD]</text>
  <text class="sl ink ko" x="180" y="535" text-anchor="middle" dominant-baseline="central">warn or block</text>
  <text class="sl ink ko" x="620" y="535" text-anchor="middle" dominant-baseline="central">warn or block</text>
  <path class="ctr" d="M340,512V558"/>
  <circle class="dot" cx="340" cy="550" r="2"/>
  <text class="sl" x="260" y="572" text-anchor="middle" dominant-baseline="central">Rmin</text>
  <text class="sl" x="540" y="572" text-anchor="middle" dominant-baseline="central">Rmax</text>
  <text class="sl ink" x="340" y="572" text-anchor="middle" dominant-baseline="central">R1</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="600" width="680" height="74"/>
  <text class="sl ink" x="52" y="618">notes</text>
  <text class="n" x="52" y="636">[1] Rate and tank from this chapter's example; a and the range come from the label version in force that day.</text>
  <text class="n" x="52" y="652">[2] Not to scale: 1.6 fl oz is under 1% of the 256 fl oz in a 2 gal tank.</text>
  <text class="n" x="52" y="668">[3] Stored with the entered values and the formula version; a tank mix gets one line per product.</text>
</svg>
