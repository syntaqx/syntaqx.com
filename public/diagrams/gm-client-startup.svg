<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 878">
  <defs>
    <marker id="gm-cs-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-cs-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-cs-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-LCH-002</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">client startup budget</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- View A: published bootstrap times -->
  <text class="vt" x="40" y="64">Plan view: bootstrap, published</text>
  <text class="vs" x="40" y="80">Scale 1 s = 20 px · timeline · values in s</text>

  <path class="ext" d="M100,125V91M690,125V91"/>
  <path class="dim" d="M100,96H690" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="395" y="92" text-anchor="middle">B0 = 29.5 [1]</text>
  <rect class="obj fill-2" x="100" y="128" width="590" height="30"/>
  <text class="sl ink" x="395" y="143" text-anchor="middle" dominant-baseline="central">start of 2020</text>

  <rect class="obj fill-1" x="100" y="196" width="320" height="30"/>
  <text class="sl ink" x="240" y="211" text-anchor="middle" dominant-baseline="central">reported Feb 2021, p90</text>
  <text class="dt" x="428" y="211" dominant-baseline="central">B1 - G1 = 1.0</text>

  <!-- Goal line -->
  <path class="ctr" d="M400,172V262"/>
  <text class="sl ink" x="404" y="182">goal [2]</text>

  <path class="ext" d="M100,229V255M420,229V255"/>
  <path class="dim" d="M100,250H420" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="250" y="246" text-anchor="middle">B1 = 16.0 [1]</text>
  <text class="t" x="395" y="284" text-anchor="middle">B0 - B1 = 29.5 - 16.0 = 13.5, about 46% shorter</text>

  <!-- View B: an illustrative 15 s budget -->
  <text class="vt" x="40" y="326">Plan view: a 15 s budget</text>
  <text class="vs" x="40" y="342">Scale 1 s = 40 px · illustrative [3] · values in s</text>

  <path class="ext" d="M100,381V357M700,381V357"/>
  <path class="dim hl" d="M100,362H700" marker-start="url(#gm-cs-ah-hl)" marker-end="url(#gm-cs-ah-hl)"/>
  <text class="dt hl" x="400" y="358" text-anchor="middle">G1 = 15.00 [2]</text>

  <rect class="obj fill-2" x="100" y="384" width="40" height="36"/>
  <rect class="obj fill-2" x="140" y="384" width="80" height="36"/>
  <rect class="obj fill-2" x="220" y="384" width="60" height="36"/>
  <rect class="obj fill-1" x="280" y="384" width="180" height="36"/>
  <rect class="obj fill-2" x="460" y="384" width="120" height="36"/>
  <rect class="obj fill-2" x="580" y="384" width="60" height="36"/>
  <rect class="hatch" x="640" y="384" width="60" height="36" fill="url(#gm-cs-hatch)"/>
  <text class="t" x="120" y="402" text-anchor="middle" dominant-baseline="central">P1</text>
  <text class="t" x="180" y="402" text-anchor="middle" dominant-baseline="central">P2</text>
  <text class="t" x="250" y="402" text-anchor="middle" dominant-baseline="central">P3</text>
  <text class="t" x="370" y="402" text-anchor="middle" dominant-baseline="central">P4</text>
  <text class="t" x="520" y="402" text-anchor="middle" dominant-baseline="central">P5</text>
  <text class="t" x="610" y="402" text-anchor="middle" dominant-baseline="central">P6</text>
  <text class="t ko" x="670" y="402" text-anchor="middle" dominant-baseline="central">P7</text>

  <!-- Chain P1 to P7 -->
  <path class="ext" d="M100,423V449M140,423V449M220,423V449M280,423V449M460,423V449M580,423V449M640,423V449M700,423V449"/>
  <path class="dim" d="M80,444H100" marker-end="url(#gm-cs-ah)"/>
  <path class="dim" d="M100,444H140"/>
  <text class="dt" x="76" y="444" text-anchor="end" dominant-baseline="central">1.00</text>
  <path class="dim" d="M140,444H220" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="180" y="440" text-anchor="middle">2.00</text>
  <path class="dim" d="M220,444H280" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="250" y="440" text-anchor="middle">1.50</text>
  <path class="dim" d="M280,444H460" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="370" y="440" text-anchor="middle">4.50</text>
  <path class="dim" d="M460,444H580" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="520" y="440" text-anchor="middle">3.00</text>
  <path class="dim" d="M580,444H640" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="610" y="440" text-anchor="middle">1.50</text>
  <path class="dim" d="M640,444H700" marker-start="url(#gm-cs-ah)" marker-end="url(#gm-cs-ah)"/>
  <text class="dt" x="670" y="440" text-anchor="middle">1.50</text>
  <text class="t" x="400" y="476" text-anchor="middle">G1 = P1 + ... + P7 = 1.00 + 2.00 + 1.50 + 4.50 + 3.00 + 1.50 + 1.50 = 15.00</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="516">Variables</text>
  <text class="vs" x="40" y="532">B and G from Riot [1] [2] · P illustrative [3] · s</text>
  <rect class="cell band" x="40" y="542" width="50" height="22"/>
  <rect class="cell band" x="90" y="542" width="530" height="22"/>
  <rect class="cell band" x="620" y="542" width="100" height="22"/>
  <text class="cap ink" x="50" y="553" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="553" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="553" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,564H720V784H40Z"/>
  <path class="ln ink" d="M90,564V784M620,564V784"/>
  <path class="ln" d="M40,586H720M40,608H720M40,630H720M40,652H720M40,674H720M40,696H720M40,718H720M40,740H720M40,762H720"/>
  <text class="t" x="50" y="575" dominant-baseline="central">B0</text>
  <text class="t" x="100" y="575" dominant-baseline="central">League client bootstrap, start of 2020</text>
  <text class="t" x="710" y="575" text-anchor="end" dominant-baseline="central">29.5</text>
  <text class="t" x="50" y="597" dominant-baseline="central">B1</text>
  <text class="t" x="100" y="597" dominant-baseline="central">same, for 90% of players, reported February 2021</text>
  <text class="t" x="710" y="597" text-anchor="end" dominant-baseline="central">16.0</text>
  <text class="t b" x="50" y="619" dominant-baseline="central">G1</text>
  <text class="t" x="100" y="619" dominant-baseline="central">goal: about 15 s at the 90th percentile</text>
  <text class="t b" x="710" y="619" text-anchor="end" dominant-baseline="central">15.00</text>
  <text class="t" x="50" y="641" dominant-baseline="central">P1</text>
  <text class="t" x="100" y="641" dominant-baseline="central">process start, launcher self-update check</text>
  <text class="t" x="710" y="641" text-anchor="end" dominant-baseline="central">1.00</text>
  <text class="t" x="50" y="663" dominant-baseline="central">P2</text>
  <text class="t" x="100" y="663" dominant-baseline="central">session restore or sign-in</text>
  <text class="t" x="710" y="663" text-anchor="end" dominant-baseline="central">2.00</text>
  <text class="t" x="50" y="685" dominant-baseline="central">P3</text>
  <text class="t" x="100" y="685" dominant-baseline="central">local services up, loopback API ready</text>
  <text class="t" x="710" y="685" text-anchor="end" dominant-baseline="central">1.50</text>
  <text class="t" x="50" y="707" dominant-baseline="central">P4</text>
  <text class="t" x="100" y="707" dominant-baseline="central">boot-set plugins load (everything else deferred)</text>
  <text class="t" x="710" y="707" text-anchor="end" dominant-baseline="central">4.50</text>
  <text class="t" x="50" y="729" dominant-baseline="central">P5</text>
  <text class="t" x="100" y="729" dominant-baseline="central">first data: profile, friends, store, news</text>
  <text class="t" x="710" y="729" text-anchor="end" dominant-baseline="central">3.00</text>
  <text class="t" x="50" y="751" dominant-baseline="central">P6</text>
  <text class="t" x="100" y="751" dominant-baseline="central">home screen rendered and interactive</text>
  <text class="t" x="710" y="751" text-anchor="end" dominant-baseline="central">1.50</text>
  <text class="t" x="50" y="773" dominant-baseline="central">P7</text>
  <text class="t" x="100" y="773" dominant-baseline="central">headroom for slow disks, cold caches, busy servers</text>
  <text class="t" x="710" y="773" text-anchor="end" dominant-baseline="central">1.50</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="800" width="680" height="62"/>
  <text class="sl ink" x="52" y="818">notes</text>
  <text class="n" x="52" y="834">[1] Riot, February 2021: bootstrap went from 29.5 s at the start of 2020 to 16 s for 90% of players.</text>
  <text class="n" x="52" y="850">[2] Riot's March 2020 goal: about 15 s at the 90th percentile. [3] Illustrative split, not Riot's.</text>
</svg>
