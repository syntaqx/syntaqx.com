<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 984">
  <defs>
    <marker id="pb-dep-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">PB-DEL-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">canary release</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: a release that passes every gate -->
  <text class="vt" x="40" y="64">Plan view: canary stages, release passes</text>
  <text class="vs" x="40" y="80">Scale 1 min = 4 px · 100% = 200 px · bake time illustrative [1]</text>
  <text class="t" x="94" y="160" text-anchor="end" dominant-baseline="central">100%</text>
  <text class="t" x="94" y="260" text-anchor="end" dominant-baseline="central">50%</text>
  <text class="t" x="94" y="340" text-anchor="end" dominant-baseline="central">10%</text>
  <text class="t" x="94" y="358" text-anchor="end" dominant-baseline="central">1%</text>
  <rect class="obj fill-2" x="100" y="160" width="360" height="200"/>
  <rect class="obj fill-1" x="100" y="358" width="120" height="2"/>
  <rect class="obj fill-1" x="220" y="340" width="120" height="20"/>
  <rect class="obj fill-1" x="340" y="260" width="120" height="100"/>
  <rect class="obj fill-1" x="460" y="160" width="240" height="200"/>
  <text class="sl ink" x="160" y="200" text-anchor="middle" dominant-baseline="central">control</text>
  <text class="sl ink" x="400" y="310" text-anchor="middle" dominant-baseline="central">canary</text>
  <text class="sl ink" x="580" y="260" text-anchor="middle" dominant-baseline="central">new version</text>
  <path class="ctr" d="M220,152V368M340,152V368M460,152V368"/>
  <text class="t" x="220" y="142" text-anchor="middle" dominant-baseline="central">g1 [2]</text>
  <text class="t" x="340" y="142" text-anchor="middle" dominant-baseline="central">g2</text>
  <text class="t" x="460" y="142" text-anchor="middle" dominant-baseline="central">g3</text>

  <!-- Chain: bake time per stage -->
  <path class="ext" d="M100,363V389M220,371V389M340,371V389M460,371V389"/>
  <path class="dim" d="M100,384H220" marker-start="url(#pb-dep-ah)" marker-end="url(#pb-dep-ah)"/>
  <text class="dt" x="160" y="380" text-anchor="middle">B = 30 min</text>
  <path class="dim" d="M220,384H340" marker-start="url(#pb-dep-ah)" marker-end="url(#pb-dep-ah)"/>
  <text class="dt" x="280" y="380" text-anchor="middle">B = 30 min</text>
  <path class="dim" d="M340,384H460" marker-start="url(#pb-dep-ah)" marker-end="url(#pb-dep-ah)"/>
  <text class="dt" x="400" y="380" text-anchor="middle">B = 30 min</text>
  <text class="t" x="400" y="414" text-anchor="middle">R1 = 3 × B = 3 × 30 = 90 min from first canary to everyone</text>

  <!-- Plan view: a release rolled back at g2 -->
  <text class="vt" x="40" y="454">Plan view: release judged bad at g2</text>
  <text class="vs" x="40" y="470">Scale 1 min = 4 px · 100% = 100 px</text>
  <text class="t" x="94" y="490" text-anchor="end" dominant-baseline="central">100%</text>
  <text class="t" x="94" y="580" text-anchor="end" dominant-baseline="central">10%</text>
  <rect class="obj fill-2" x="100" y="490" width="600" height="100"/>
  <rect class="obj fill-1" x="100" y="589" width="120" height="1"/>
  <rect class="obj fill-1" x="220" y="580" width="120" height="10"/>
  <path class="phantom" d="M340,580V540H460V490H700"/>
  <text class="sl" x="580" y="508" text-anchor="middle" dominant-baseline="central">planned, never run</text>
  <circle class="dot" cx="340" cy="585" r="2"/>
  <path class="leader" d="M340,585L352,560H380"/>
  <text class="sl ink" x="384" y="560" dominant-baseline="central">rolled back [3]</text>
  <text class="sl ink" x="160" y="530" text-anchor="middle" dominant-baseline="central">control</text>
  <path class="ctr" d="M340,482V598"/>
  <text class="t" x="340" y="610" text-anchor="middle" dominant-baseline="central">g2</text>
  <text class="t" x="400" y="634" text-anchor="middle">X1 = (s1 + s2) × B = (0.01 + 0.10) × 30 = 3.3 min of full traffic</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="672">Variables</text>
  <text class="vs" x="40" y="688">Stages from the chapter · B illustrative [1]</text>
  <rect class="cell band" x="40" y="698" width="50" height="22"/>
  <rect class="cell band" x="90" y="698" width="470" height="22"/>
  <rect class="cell band" x="560" y="698" width="160" height="22"/>
  <text class="cap ink" x="50" y="709" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="709" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="709" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,720H720V874H40Z"/>
  <path class="ln ink" d="M90,720V874M560,720V874"/>
  <path class="ln" d="M40,742H720M40,764H720M40,786H720M40,808H720M40,830H720M40,852H720"/>
  <text class="t" x="50" y="731" dominant-baseline="central">s1</text>
  <text class="t" x="100" y="731" dominant-baseline="central">canary share, stage 1</text>
  <text class="t" x="710" y="731" text-anchor="end" dominant-baseline="central">1%</text>
  <text class="t" x="50" y="753" dominant-baseline="central">s2</text>
  <text class="t" x="100" y="753" dominant-baseline="central">canary share, stage 2</text>
  <text class="t" x="710" y="753" text-anchor="end" dominant-baseline="central">10%</text>
  <text class="t" x="50" y="775" dominant-baseline="central">s3</text>
  <text class="t" x="100" y="775" dominant-baseline="central">canary share, stage 3</text>
  <text class="t" x="710" y="775" text-anchor="end" dominant-baseline="central">50%</text>
  <text class="t" x="50" y="797" dominant-baseline="central">s4</text>
  <text class="t" x="100" y="797" dominant-baseline="central">everyone</text>
  <text class="t" x="710" y="797" text-anchor="end" dominant-baseline="central">100%</text>
  <text class="t" x="50" y="819" dominant-baseline="central">B</text>
  <text class="t" x="100" y="819" dominant-baseline="central">bake time per stage, judged against control</text>
  <text class="t" x="710" y="819" text-anchor="end" dominant-baseline="central">30 min</text>
  <text class="t b" x="50" y="841" dominant-baseline="central">R1</text>
  <text class="t" x="100" y="841" dominant-baseline="central">first canary to everyone: 3 × B</text>
  <text class="t b" x="710" y="841" text-anchor="end" dominant-baseline="central">90 min</text>
  <text class="t b" x="50" y="863" dominant-baseline="central">X1</text>
  <text class="t" x="100" y="863" dominant-baseline="central">exposure, rolled back at g2: (s1 + s2) × B</text>
  <text class="t b" x="710" y="863" text-anchor="end" dominant-baseline="central">3.3 min</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="890" width="680" height="74"/>
  <text class="sl ink" x="52" y="908">notes</text>
  <text class="n" x="52" y="926">[1] Stages from the chapter; the 30-minute bake is illustrative: long enough for the SLIs to separate.</text>
  <text class="n" x="52" y="942">[2] At each gate the verdict compares canary to control at the same time, on SLIs, and rolls back by itself.</text>
  <text class="n" x="52" y="958">[3] Routing the slice back to the old version: the bad release only ever reached the canary's share.</text>
</svg>
