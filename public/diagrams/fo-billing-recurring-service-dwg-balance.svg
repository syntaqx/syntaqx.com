    <marker id="fo-bsb-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">FO-BIL-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">service balance, level billing</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: one program year -->
  <text class="vt" x="40" y="64">Plan view: a seven-round program, one year</text>
  <text class="vs" x="40" y="80">Scale 1 month = 50 px · 1 USD = 1 px · illustrative [2] · USD</text>
  <path class="ext" d="M110,111V99M710,111V99"/>
  <path class="dim" d="M110,104H710" marker-start="url(#fo-bsb-ah)" marker-end="url(#fo-bsb-ah)"/>
  <text class="dt" x="410" y="100" text-anchor="middle">T1 = 12 months, billed on the 1st</text>
  <text class="sl ink" x="135" y="124" text-anchor="middle" dominant-baseline="central">jan</text>
  <text class="sl ink" x="185" y="124" text-anchor="middle" dominant-baseline="central">feb</text>
  <text class="sl ink" x="235" y="124" text-anchor="middle" dominant-baseline="central">mar</text>
  <text class="sl ink" x="285" y="124" text-anchor="middle" dominant-baseline="central">apr</text>
  <text class="sl ink" x="335" y="124" text-anchor="middle" dominant-baseline="central">may</text>
  <text class="sl ink" x="385" y="124" text-anchor="middle" dominant-baseline="central">jun</text>
  <text class="sl ink" x="435" y="124" text-anchor="middle" dominant-baseline="central">jul</text>
  <text class="sl ink" x="485" y="124" text-anchor="middle" dominant-baseline="central">aug</text>
  <text class="sl ink" x="535" y="124" text-anchor="middle" dominant-baseline="central">sep</text>
  <text class="sl ink" x="585" y="124" text-anchor="middle" dominant-baseline="central">oct</text>
  <text class="sl ink" x="635" y="124" text-anchor="middle" dominant-baseline="central">nov</text>
  <text class="sl ink" x="685" y="124" text-anchor="middle" dominant-baseline="central">dec</text>

  <!-- Charges and rounds -->
  <text class="sl ink" x="100" y="144" text-anchor="end" dominant-baseline="central">billed</text>
  <text class="sl ink" x="100" y="174" text-anchor="end" dominant-baseline="central">rounds</text>
  <rect class="obj fill-2" x="120" y="134" width="30" height="20"/>
  <text class="t" x="135" y="144" text-anchor="middle" dominant-baseline="central">35</text>
  <rect class="obj fill-2" x="170" y="134" width="30" height="20"/>
  <text class="t" x="185" y="144" text-anchor="middle" dominant-baseline="central">35</text>
  <rect class="obj fill-2" x="220" y="134" width="30" height="20"/>
  <text class="t" x="235" y="144" text-anchor="middle" dominant-baseline="central">35</text>
  <rect class="obj fill-1" x="220" y="164" width="30" height="20"/>
  <text class="t" x="235" y="174" text-anchor="middle" dominant-baseline="central">1</text>
