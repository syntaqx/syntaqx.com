<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290">
  <defs>
    <marker id="fo-lmd-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-lmd-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Zones -->
  <rect class="zone" x="8" y="30" width="322" height="200"/>
  <text class="cap" x="18" y="48">logistics: TMS and WMS</text>
  <rect class="zone" x="340" y="30" width="412" height="200"/>
  <text class="cap hl" x="350" y="48">field operations: routes, proof</text>

  <!-- First and middle mile -->
  <rect class="cell" x="16" y="110" width="84" height="40"/>
  <text class="t" x="58" y="130" text-anchor="middle" dominant-baseline="central">shipper</text>
  <text class="n" x="58" y="168" text-anchor="middle">retailer, maker</text>

  <rect class="cell" x="170" y="110" width="100" height="40"/>
  <text class="t" x="220" y="130" text-anchor="middle" dominant-baseline="central">warehouse</text>
  <text class="n" x="220" y="168" text-anchor="middle">store, pick, pack</text>

  <path class="ln" d="M100,130H168" marker-end="url(#fo-lmd-ah)"/>
  <text class="n" x="135" y="120" text-anchor="middle">first mile</text>
  <path class="ln" d="M270,130H348" marker-end="url(#fo-lmd-ah)"/>
  <text class="n" x="299" y="120" text-anchor="middle">middle mile</text>

  <!-- Hub -->
  <rect class="cell hl" x="350" y="110" width="120" height="40"/>
  <text class="t hl b" x="410" y="130" text-anchor="middle" dominant-baseline="central">hub or depot</text>
  <text class="n" x="410" y="168" text-anchor="middle">load by stop</text>

  <!-- Last mile -->
  <text class="n hl" x="545" y="122" text-anchor="middle">last mile</text>
  <path class="ln hl" d="M470,124L598,70" marker-end="url(#fo-lmd-ah-hl)"/>
  <path class="ln hl" d="M470,130H598" marker-end="url(#fo-lmd-ah-hl)"/>
  <path class="ln hl" d="M470,136L598,190" marker-end="url(#fo-lmd-ah-hl)"/>

  <rect class="cell" x="600" y="50" width="140" height="36"/>
  <text class="t" x="670" y="68" text-anchor="middle" dominant-baseline="central">recipient signs</text>
  <rect class="cell hl end" x="600" y="112" width="140" height="36"/>
  <text class="t hl b" x="670" y="130" text-anchor="middle" dominant-baseline="central">safe place, photo</text>
  <rect class="cell" x="600" y="174" width="140" height="36"/>
  <text class="t" x="670" y="192" text-anchor="middle" dominant-baseline="central">locker or counter</text>

  <!-- Failed attempt loop -->
  <path class="ln dash" d="M670,210V250H458V152" marker-end="url(#fo-lmd-ah)"/>
  <text class="n" x="540" y="268" text-anchor="middle">failed: retry, hold at a pickup point, or return</text>
</svg>
