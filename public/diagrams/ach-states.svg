<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196">
  <defs>
    <marker id="achs-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Timeline ruler, counted from the settlement date -->
  <text class="cap" x="40" y="20">ach debit</text>
  <text class="cap" x="680" y="20" text-anchor="end">from the settlement date</text>
  <path class="ln" d="M240,46H680"/>
  <path class="ln" d="M240,40V58M360,40V58M560,40V58M680,40V58"/>
  <text class="t dim" x="246" y="34">day 0</text>
  <text class="t dim" x="366" y="34">+2 banking days</text>
  <text class="t dim" x="566" y="34">+60 calendar days</text>

  <!-- States as a timeline: each starts where its window opens -->
  <rect class="cell" x="40" y="60" width="100" height="26"/>
  <text class="t" x="90" y="73" text-anchor="middle" dominant-baseline="central">pending</text>
  <rect class="cell" x="140" y="60" width="100" height="26"/>
  <text class="t" x="190" y="73" text-anchor="middle" dominant-baseline="central">submitted</text>
  <rect class="cell" x="240" y="60" width="120" height="26"/>
  <text class="t" x="300" y="73" text-anchor="middle" dominant-baseline="central">settled</text>
  <rect class="cell" x="360" y="60" width="200" height="26"/>
  <text class="t" x="460" y="73" text-anchor="middle" dominant-baseline="central">available</text>
  <rect class="cell hl end" x="560" y="60" width="120" height="26"/>
  <text class="t hl" x="620" y="73" text-anchor="middle" dominant-baseline="central">final</text>

  <text class="n" x="140" y="106" text-anchor="middle">sent in a file</text>
  <text class="n hl" x="620" y="106" text-anchor="middle">now it's yours</text>

  <!-- Returns -->
  <path class="ln dash" d="M300,86C300,130 300,163 328,163" marker-end="url(#achs-ah)"/>
  <text class="n" x="290" y="126" text-anchor="end">administrative return,</text>
  <text class="n" x="290" y="141" text-anchor="end">within 2 banking days</text>
  <path class="ln dash" d="M460,86C460,130 460,163 432,163" marker-end="url(#achs-ah)"/>
  <text class="n" x="470" y="126">consumer unauthorized return,</text>
  <text class="n" x="470" y="141">up to 60 calendar days</text>
  <rect class="cell ghost end" x="330" y="150" width="100" height="26"/>
  <text class="t dim" x="380" y="163" text-anchor="middle" dominant-baseline="central">returned</text>
</svg>
