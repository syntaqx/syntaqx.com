<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <defs>
    <marker id="chk-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Timeline ruler, counted from the deposit -->
  <text class="cap" x="40" y="20">a deposited check</text>
  <text class="cap" x="680" y="20" text-anchor="end">from the deposit</text>
  <path class="ln" d="M140,46H680"/>
  <path class="ln" d="M140,40V58M240,40V58M340,40V58M680,40V58"/>
  <text class="t dim" x="146" y="34">day 0</text>
  <text class="t dim" x="246" y="34">+2 bus. days</text>
  <text class="t dim" x="346" y="34">+3 to 4</text>
  <text class="t dim" x="674" y="34" text-anchor="end">a year or more</text>

  <!-- States -->
  <rect class="cell" x="40" y="60" width="100" height="26"/>
  <text class="t" x="90" y="73" text-anchor="middle" dominant-baseline="central">scanned</text>
  <rect class="cell" x="140" y="60" width="100" height="26"/>
  <text class="t" x="190" y="73" text-anchor="middle" dominant-baseline="central">deposited</text>
  <rect class="cell" x="240" y="60" width="100" height="26"/>
  <text class="t" x="290" y="73" text-anchor="middle" dominant-baseline="central">available</text>
  <rect class="cell" x="340" y="60" width="240" height="26"/>
  <text class="t" x="460" y="73" text-anchor="middle" dominant-baseline="central">probably good</text>
  <rect class="cell hl end" x="580" y="60" width="100" height="26"/>
  <text class="t hl" x="630" y="73" text-anchor="middle" dominant-baseline="central">final</text>

  <text class="n" x="290" y="106" text-anchor="middle">Reg CC releases funds</text>
  <text class="n hl" x="630" y="106" text-anchor="middle">by your policy</text>

  <!-- Returns -->
  <path class="ln dash" d="M290,86C290,140 290,177 318,177" marker-end="url(#chk-ah)"/>
  <text class="n" x="280" y="138" text-anchor="end">return by the paying bank's</text>
  <text class="n" x="280" y="153" text-anchor="end">deadline (A NSF, C stop, D closed)</text>
  <path class="ln dash" d="M500,86C500,140 500,177 422,177" marker-end="url(#chk-ah)"/>
  <text class="n" x="510" y="138">warranty or forgery claim:</text>
  <text class="n" x="510" y="153">altered, forged, deposited twice</text>
  <rect class="cell ghost end" x="320" y="164" width="100" height="26"/>
  <text class="t dim" x="370" y="177" text-anchor="middle" dominant-baseline="central">returned</text>
</svg>
