<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 668">
  <defs>
    <marker id="fo-ris-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ris-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="fo-ris-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">FO-REP-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">response and resolution clocks</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: one commercial work order -->
  <text class="vt" x="40" y="64">Plan view: two clocks on one work order</text>
  <text class="vs" x="40" y="80">1 h = 22 px · nights broken out [3] · business hours</text>

  <!-- Calendar strip -->
  <rect class="obj fill-2" x="110" y="104" width="110" height="20"/>
  <rect class="hatch" x="220" y="104" width="40" height="20" fill="url(#fo-ris-hatch)"/>
  <rect class="obj fill-2" x="260" y="104" width="198" height="20"/>
  <rect class="hatch" x="458" y="104" width="40" height="20" fill="url(#fo-ris-hatch)"/>
  <rect class="obj fill-2" x="498" y="104" width="198" height="20"/>
  <text class="sl ink" x="116" y="114" dominant-baseline="central">tue</text>
  <text class="sl ink" x="266" y="114" dominant-baseline="central">wed 08 to 17</text>
  <text class="sl ink" x="504" y="114" dominant-baseline="central">thu 08 to 17</text>

  <!-- Event lines -->
  <path class="ctr" d="M176,98V306M304,140V322M674,128V306"/>

  <!-- Response clock -->
  <text class="sl ink" x="40" y="172" dominant-baseline="central">response</text>
  <rect class="obj fill-1" x="176" y="162" width="44" height="20"/>
  <rect class="obj fill-1" x="260" y="162" width="33" height="20"/>
  <rect class="slot" x="293" y="162" width="11" height="20"/>
  <path class="ext" d="M176,159V141M304,159V141"/>
  <path class="dim" d="M176,146H304" marker-start="url(#fo-ris-ah)" marker-end="url(#fo-ris-ah)"/>
  <text class="dt" x="240" y="142" text-anchor="middle">R1 = 2 + 2 = 4</text>
  <circle class="dot" cx="293" cy="172" r="2"/>
  <path class="leader" d="M293,172L293,172H317"/>
  <text class="sl ink" x="321" y="172" dominant-baseline="central">on site wed 09:30 [1]</text>

  <!-- Resolution clock -->
  <text class="sl ink" x="40" y="240" dominant-baseline="central">resolution</text>
  <rect class="obj fill-1" x="176" y="230" width="44" height="20"/>
  <rect class="obj fill-1" x="260" y="230" width="66" height="20"/>
  <rect class="obj fill-1" x="392" y="230" width="66" height="20"/>
  <rect class="obj fill-1" x="498" y="230" width="132" height="20"/>
  <rect class="hatch" x="326" y="230" width="66" height="20" fill="url(#fo-ris-hatch)"/>
  <rect class="slot" x="630" y="230" width="44" height="20"/>
  <path class="ext" d="M176,227V209M674,227V209"/>
  <path class="dim" d="M176,214H674" marker-start="url(#fo-ris-ah)" marker-end="url(#fo-ris-ah)"/>
  <text class="dt" x="425" y="210" text-anchor="middle">S1 = 2 + 3 + 3 + 8 = 16 [1]</text>
  <path class="ext" d="M176,253V271M220,253V271M260,253V271M326,253V271M392,253V271M458,253V271M498,253V271M674,253V271"/>
  <path class="dim" d="M176,266H220" marker-start="url(#fo-ris-ah)" marker-end="url(#fo-ris-ah)"/>
  <text class="dt" x="198" y="262" text-anchor="middle">2</text>
  <path class="dim" d="M260,266H326" marker-start="url(#fo-ris-ah)" marker-end="url(#fo-ris-ah)"/>
  <text class="dt" x="293" y="262" text-anchor="middle">3</text>
  <path class="dim hl" d="M326,266H392" marker-start="url(#fo-ris-ah-hl)" marker-end="url(#fo-ris-ah-hl)"/>
  <text class="dt hl" x="359" y="262" text-anchor="middle">P1 = 3</text>
  <path class="dim" d="M392,266H458" marker-start="url(#fo-ris-ah)" marker-end="url(#fo-ris-ah)"/>
  <text class="dt" x="425" y="262" text-anchor="middle">3</text>
  <path class="dim" d="M498,266H674" marker-start="url(#fo-ris-ah)" marker-end="url(#fo-ris-ah)"/>
  <text class="dt" x="586" y="262" text-anchor="middle">8</text>
  <circle class="dot" cx="630" cy="240" r="2"/>
  <path class="leader" d="M630,240L580,290H566"/>
  <text class="sl ink" x="562" y="290" text-anchor="end" dominant-baseline="central">resolved thu 14:00</text>

  <!-- Event labels -->
  <text class="sl ink" x="176" y="316" text-anchor="middle" dominant-baseline="central">call tue 15:00</text>
  <text class="sl ink" x="304" y="332" text-anchor="middle" dominant-baseline="central">response due wed 10:00</text>
  <text class="sl ink" x="674" y="316" text-anchor="end" dominant-baseline="central">resolution due thu 16:00</text>

  <!-- Legend -->
  <rect class="obj fill-1" x="40" y="352" width="24" height="14"/>
  <text class="sl ink" x="72" y="359" dominant-baseline="central">counting</text>
  <rect class="slot" x="190" y="352" width="24" height="14"/>
  <text class="sl ink" x="222" y="359" dominant-baseline="central">slack</text>
  <rect class="hatch" x="310" y="352" width="24" height="14" fill="url(#fo-ris-hatch)"/>
  <text class="sl ink" x="342" y="359" dominant-baseline="central">paused or closed [2]</text>

  <!-- Variables -->
  <text class="vt" x="40" y="400">Variables</text>
  <text class="vs" x="40" y="416">Illustrative targets and calendar [1] · business hours</text>
  <rect class="cell band" x="40" y="426" width="50" height="22"/>
  <rect class="cell band" x="90" y="426" width="520" height="22"/>
  <rect class="cell band" x="610" y="426" width="110" height="22"/>
  <text class="cap ink" x="50" y="437" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="437" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="437" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,448H720V558H40Z"/>
  <path class="ln ink" d="M90,448V558M610,448V558"/>
  <path class="ln" d="M40,470H720M40,492H720M40,514H720M40,536H720"/>
  <text class="t" x="50" y="459" dominant-baseline="central">R1</text>
  <text class="t" x="100" y="459" dominant-baseline="central">response target, call to on site</text>
  <text class="t" x="710" y="459" text-anchor="end" dominant-baseline="central">4</text>
  <text class="t" x="50" y="481" dominant-baseline="central">M1</text>
  <text class="t" x="100" y="481" dominant-baseline="central">response used: 2 + 1.5</text>
  <text class="t" x="710" y="481" text-anchor="end" dominant-baseline="central">3.5</text>
  <text class="t" x="50" y="503" dominant-baseline="central">S1</text>
  <text class="t" x="100" y="503" dominant-baseline="central">resolution target, call to resolved</text>
  <text class="t" x="710" y="503" text-anchor="end" dominant-baseline="central">16</text>
  <text class="t b" x="50" y="525" dominant-baseline="central">P1</text>
  <text class="t" x="100" y="525" dominant-baseline="central">paused, waiting on customer access: not counted</text>
  <text class="t b" x="710" y="525" text-anchor="end" dominant-baseline="central">3</text>
  <text class="t" x="50" y="547" dominant-baseline="central">U1</text>
  <text class="t" x="100" y="547" dominant-baseline="central">resolution used: 2 + 3 + 3 + 6</text>
  <text class="t" x="710" y="547" text-anchor="end" dominant-baseline="central">14</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="574" width="680" height="74"/>
  <text class="sl ink" x="52" y="592">notes</text>
  <text class="n" x="52" y="610">[1] Illustrative: weekdays 08:00 to 17:00 in the property's zone, a 4 h response and a 16 h resolution target.</text>
  <text class="n" x="52" y="626">[2] A pause needs a reason; store started, paused, resumed and met as events so a breach can be replayed.</text>
  <text class="n" x="52" y="642">[3] Nights are drawn as fixed breaks, not to scale; outside business hours neither clock counts.</text>
</svg>
