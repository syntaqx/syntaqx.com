<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 600">
  <defs>
    <marker id="pb-idem-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="pb-idem-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">PB-PAY-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">idempotency key lifecycle</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <text class="vt" x="40" y="64">Plan view: one key, from claim to prune</text>
  <text class="vs" x="40" y="80">Not to scale · timeline · seconds, then hours</text>

  <!-- R1: retention -->
  <path class="ext" d="M150,107V145M640,107V177"/>
  <path class="dim hl" d="M150,112H640" marker-start="url(#pb-idem-ah-hl)" marker-end="url(#pb-idem-ah-hl)"/>
  <text class="dt hl" x="395" y="108" text-anchor="middle">R1 ≥ 24 h, from the first claim [3]</text>

  <!-- Client lane: attempts with key K -->
  <text class="sl ink" x="40" y="150" dominant-baseline="central">client</text>
  <circle class="dot" cx="150" cy="150" r="3"/>
  <circle class="dot" cx="215" cy="150" r="3"/>
  <circle class="dot" cx="340" cy="150" r="3"/>
  <circle class="dot" cx="460" cy="150" r="3"/>
  <circle class="dot" cx="680" cy="150" r="3"/>
  <text class="t b" x="157" y="144" dominant-baseline="central">a1 [1]</text>
  <text class="t b" x="222" y="144" dominant-baseline="central">a2</text>
  <text class="t b" x="347" y="144" dominant-baseline="central">a3</text>
  <text class="t b" x="467" y="144" dominant-baseline="central">a4</text>
  <text class="t b" x="687" y="144" dominant-baseline="central">a5</text>
  <path class="ln ink" d="M150,154V177" marker-end="url(#pb-idem-ah)"/>
  <path class="ln ink" d="M215,154V177" marker-end="url(#pb-idem-ah)"/>
  <path class="ln ink" d="M340,154V177" marker-end="url(#pb-idem-ah)"/>
  <path class="ln ink" d="M460,154V177" marker-end="url(#pb-idem-ah)"/>
  <path class="ln ink" d="M680,154V177" marker-end="url(#pb-idem-ah)"/>
  <!-- Key lane -->
  <text class="sl ink" x="40" y="196" dominant-baseline="central">key</text>
  <rect class="obj fill-2" x="150" y="180" width="130" height="32"/>
  <rect class="obj fill-1" x="280" y="180" width="360" height="32"/>
  <rect class="slot" x="640" y="180" width="80" height="32"/>
  <text class="sl ink" x="215" y="196" text-anchor="middle" dominant-baseline="central">in progress</text>
  <text class="sl ink" x="460" y="196" text-anchor="middle" dominant-baseline="central">completed, response stored</text>
  <text class="sl" x="680" y="196" text-anchor="middle" dominant-baseline="central">pruned</text>

  <!-- Side-effect lane -->
  <text class="sl ink" x="40" y="234" dominant-baseline="central">effect</text>
  <rect class="slot" x="150" y="222" width="130" height="24"/>
  <rect class="obj fill-2" x="280" y="222" width="440" height="24"/>
  <text class="sl ink" x="500" y="234" text-anchor="middle" dominant-baseline="central">payment row</text>
  <path class="ctr" d="M280,172V252"/>
  <text class="t" x="286" y="168" dominant-baseline="central">[2]</text>

  <!-- Response lane -->
  <text class="sl ink" x="40" y="268" dominant-baseline="central">response</text>
  <text class="t" x="150" y="268" text-anchor="middle" dominant-baseline="central">lost</text>
  <text class="t" x="215" y="268" text-anchor="middle" dominant-baseline="central">409</text>
  <text class="t" x="340" y="268" text-anchor="middle" dominant-baseline="central">201 replayed</text>
  <text class="t" x="460" y="268" text-anchor="middle" dominant-baseline="central">400</text>
  <text class="t" x="680" y="268" text-anchor="middle" dominant-baseline="central">new op</text>

  <!-- Attempt table -->
  <text class="vt" x="40" y="310">Attempts</text>
  <text class="vs" x="40" y="326">Behavior from the chapter · same key K throughout</text>
  <rect class="cell band" x="40" y="336" width="50" height="22"/>
  <rect class="cell band" x="90" y="336" width="200" height="22"/>
  <rect class="cell band" x="290" y="336" width="140" height="22"/>
  <rect class="cell band" x="430" y="336" width="290" height="22"/>
  <text class="cap ink" x="50" y="347" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="347" dominant-baseline="central">request</text>
  <text class="cap ink" x="300" y="347" dominant-baseline="central">key state</text>
  <text class="cap ink" x="440" y="347" dominant-baseline="central">response</text>
  <path class="cell" d="M40,358H720V490H40Z"/>
  <path class="ln ink" d="M90,358V490M290,358V490M430,358V490"/>
  <path class="ln" d="M40,380H720M40,402H720M40,424H720M40,446H720M40,468H720"/>
  <text class="t b" x="50" y="369" dominant-baseline="central">a1</text>
  <text class="t" x="100" y="369" dominant-baseline="central">POST, key K, body B</text>
  <text class="t" x="300" y="369" dominant-baseline="central">none, then claimed</text>
  <text class="t" x="440" y="369" dominant-baseline="central">connection drops before the reply</text>
  <text class="t b" x="50" y="391" dominant-baseline="central">a2</text>
  <text class="t" x="100" y="391" dominant-baseline="central">retry, K, B</text>
  <text class="t" x="300" y="391" dominant-baseline="central">in_progress</text>
  <text class="t" x="440" y="391" dominant-baseline="central">409 Conflict, retry shortly</text>
  <text class="t b" x="50" y="413" dominant-baseline="central">a3</text>
  <text class="t" x="100" y="413" dominant-baseline="central">retry, K, B</text>
  <text class="t" x="300" y="413" dominant-baseline="central">completed</text>
  <text class="t" x="440" y="413" dominant-baseline="central">201, Idempotent-Replayed: true</text>
  <text class="t b" x="50" y="435" dominant-baseline="central">a4</text>
  <text class="t" x="100" y="435" dominant-baseline="central">K, different body</text>
  <text class="t" x="300" y="435" dominant-baseline="central">completed</text>
  <text class="t" x="440" y="435" dominant-baseline="central">400 Bad Request, key mismatch</text>
  <text class="t b" x="50" y="457" dominant-baseline="central">a5</text>
  <text class="t" x="100" y="457" dominant-baseline="central">K, after R1</text>
  <text class="t" x="300" y="457" dominant-baseline="central">pruned</text>
  <text class="t" x="440" y="457" dominant-baseline="central">processed as a new operation</text>
  <text class="t b" x="50" y="479" dominant-baseline="central">R1</text>
  <text class="t" x="100" y="479" dominant-baseline="central">retention, from creation</text>
  <text class="t" x="300" y="479" dominant-baseline="central">any</text>
  <text class="t" x="440" y="479" dominant-baseline="central">at least 24 h, then pruned</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="506" width="680" height="74"/>
  <text class="sl ink" x="52" y="524">notes</text>
  <text class="n" x="52" y="542">[1] One key per logical operation: generated before a1, stored with the order, reused on every retry.</text>
  <text class="n" x="52" y="558">[2] The key record and the side effect commit in one transaction, so both exist or neither does.</text>
  <text class="n" x="52" y="574">[3] Past R1 a retry is a new decision: clients stop retrying and reconcile by fetching the object.</text>
</svg>
