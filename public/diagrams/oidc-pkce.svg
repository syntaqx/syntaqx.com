<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394">
  <defs>
    <marker id="oi-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="oi-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="40" y="20">sign-in with openid connect, top to bottom in time</text>

  <!-- Participants -->
  <rect class="cell" x="40" y="32" width="213" height="26"/>
  <text class="t b" x="146" y="45" text-anchor="middle" dominant-baseline="central">browser</text>
  <rect class="cell" x="253" y="32" width="214" height="26"/>
  <text class="t b" x="360" y="45" text-anchor="middle" dominant-baseline="central">your app</text>
  <rect class="cell" x="467" y="32" width="213" height="26"/>
  <text class="t b" x="573" y="45" text-anchor="middle" dominant-baseline="central">identity provider</text>

  <!-- Lifelines -->
  <path class="ln dash" d="M146,58V364"/>
  <path class="ln dash" d="M360,58V338"/>
  <path class="ln dash" d="M573,58V364"/>

  <!-- 1. The app prepares secrets the browser never learns -->
  <rect class="cell" x="270" y="70" width="180" height="24"/>
  <text class="t" x="360" y="82" text-anchor="middle" dominant-baseline="central">verifier, state, nonce</text>

  <!-- 2. Redirect to the provider -->
  <text class="n" x="253" y="114" text-anchor="middle">redirect</text>
  <path class="ln ink" d="M360,122H148" marker-end="url(#oi-ah-ink)"/>
  <text class="n" x="360" y="146" text-anchor="middle">authorize: code_challenge, state, nonce</text>
  <path class="ln ink" d="M146,154H571" marker-end="url(#oi-ah-ink)"/>

  <!-- 3. The user signs in at the provider -->
  <rect class="cell" x="513" y="168" width="120" height="24"/>
  <text class="t" x="573" y="180" text-anchor="middle" dominant-baseline="central">sign in, MFA</text>

  <!-- 4. Back with a one-time code -->
  <text class="n" x="360" y="212" text-anchor="middle">redirect back: code, state</text>
  <path class="ln ink" d="M573,220H148" marker-end="url(#oi-ah-ink)"/>
  <text class="n" x="253" y="244" text-anchor="middle">code, state: check state</text>
  <path class="ln ink" d="M146,252H358" marker-end="url(#oi-ah-ink)"/>

  <!-- 5. The back channel: the only place tokens travel -->
  <text class="n hl" x="466" y="276" text-anchor="middle">code + code_verifier, server to server</text>
  <path class="ln hl" d="M360,284H571" marker-end="url(#oi-ah-hl)"/>
  <text class="n hl" x="466" y="308" text-anchor="middle">ID token, access token</text>
  <path class="ln hl" d="M573,316H362" marker-end="url(#oi-ah-hl)"/>

  <!-- 6. Validate, then start your own session -->
  <rect class="cell hl end" x="240" y="338" width="240" height="26"/>
  <text class="t hl" x="360" y="351" text-anchor="middle" dominant-baseline="central">validate, then start a session</text>
  <text class="n" x="360" y="382" text-anchor="middle">check iss, aud, exp, nonce and the signature</text>
</svg>
