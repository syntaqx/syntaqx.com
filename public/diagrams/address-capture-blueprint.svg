<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 655">
  <!-- Generated by scripts/dwg/build.mjs from scripts/dwg/sheets; edit the source, not this file. -->
  <defs><marker id="acb-ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,1.6L10,5L0,8.4Z"/></marker></defs>
  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">SAVED ADDRESSES CARRY THE CUSTOMER'S OWN LABELS, PRIVATE TO THEM, MOST RECENT FIRST.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">SUGGESTIONS ARE FOR TYPING: ONLY THE ONE THE CUSTOMER PICKS MAY BE KEPT, FOR THEIR TRANSACTION.</text>
  <rect class="nb" x="31" y="86.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="96" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">ENTER MANUALLY IS ALWAYS THE LAST ROW; THAT PATH REJOINS AT CONFIRM, SO IT GETS A PIN TOO.</text>
  <rect class="nb" x="31" y="103.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="113" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">UNIT, BUILDING AND PLACE TYPE COME FROM THE CUSTOMER; THE UNIT STAYS WITH THE ADDRESS LINES.</text>
  <rect class="nb" x="31" y="120.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="130" text-anchor="middle">5</text>
  <text class="nt" x="50" y="130">THE GATE CODE OPENS A GATE: ENCRYPTED IN THE APPLICATION, SHOWN ONLY DURING AN ACTIVE JOB.</text>
  <rect class="nb" x="31" y="137.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="147" text-anchor="middle">6</text>
  <text class="nt" x="50" y="147">THE PIN STARTS ON A GEOCODE YOU MAY STORE; THE POINT THE CUSTOMER CONFIRMS OR MOVES IS KEPT.</text>
  <rect class="nb" x="31" y="154.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="164" text-anchor="middle">7</text>
  <text class="nt" x="50" y="164">COUNTRY COMES FIRST AND DECIDES THE FIELDS; NO STATE OR PROVINCE IS PRESELECTED.</text>
  <rect class="nb" x="31" y="171.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="181" text-anchor="middle">8</text>
  <text class="nt" x="50" y="181">SAVE WRITES THE ADDRESS AND ITS GEOCODE JOB IN ONE TRANSACTION; ORDERS COPY THE ADDRESS.</text>
  <text class="nt" x="50" y="198">WIREFRAMES SHOW SLOTS, NOT COPY. NOT TO SCALE.</text>
