<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236">
  <defs>
    <marker id="fo-ro-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ro-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ro-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Column heads -->
  <text class="cap" x="90" y="40" text-anchor="middle">build</text>
  <text class="cap" x="206" y="40" text-anchor="middle">engine</text>
  <text class="cap" x="322" y="40" text-anchor="middle">solver</text>
  <text class="cap" x="438" y="40" text-anchor="middle">result</text>
  <text class="cap" x="554" y="40" text-anchor="middle">gate</text>
  <text class="cap" x="670" y="40" text-anchor="middle">commit</text>

  <!-- Pipeline -->
  <rect class="cell" x="40" y="54" width="100" height="28"/>
  <text class="t" x="90" y="68" text-anchor="middle" dominant-baseline="central">snapshot</text>
  <rect class="cell" x="156" y="54" width="100" height="28"/>
  <text class="t" x="206" y="68" text-anchor="middle" dominant-baseline="central">travel matrix</text>
  <rect class="cell" x="272" y="54" width="100" height="28"/>
  <text class="t" x="322" y="68" text-anchor="middle" dominant-baseline="central">async job</text>
  <rect class="cell" x="388" y="54" width="100" height="28"/>
  <text class="t" x="438" y="68" text-anchor="middle" dominant-baseline="central">candidate</text>
  <rect class="cell hl" x="504" y="54" width="100" height="28"/>
  <text class="t hl b" x="554" y="68" text-anchor="middle" dominant-baseline="central">version check</text>
  <rect class="cell hl" x="620" y="54" width="100" height="28"/>
  <text class="t hl b" x="670" y="68" text-anchor="middle" dominant-baseline="central">apply</text>

  <path class="ln" d="M140,68H154" marker-end="url(#fo-ro-ah)"/>
  <path class="ln" d="M256,68H270" marker-end="url(#fo-ro-ah)"/>
  <path class="ln" d="M372,68H386" marker-end="url(#fo-ro-ah)"/>
  <path class="ln" d="M488,68H502" marker-end="url(#fo-ro-ah)"/>
  <path class="ln hl" d="M604,68H618" marker-end="url(#fo-ro-ah-hl)"/>

  <!-- What each step holds -->
  <text class="n" x="90" y="100" text-anchor="middle">visits, shifts,</text>
  <text class="n" x="90" y="114" text-anchor="middle">pins, version</text>
  <text class="n" x="206" y="100" text-anchor="middle">OSRM, Valhalla,</text>
  <text class="n" x="206" y="114" text-anchor="middle">vendor API</text>
  <text class="n" x="322" y="100" text-anchor="middle">time limit,</text>
  <text class="n" x="322" y="114" text-anchor="middle">poll or webhook</text>
  <text class="n" x="438" y="100" text-anchor="middle">routes, ETAs,</text>
  <text class="n" x="438" y="114" text-anchor="middle">unassigned</text>
  <text class="n hl" x="554" y="100" text-anchor="middle">versions match?</text>
  <text class="n hl" x="554" y="114" text-anchor="middle">diff reviewed?</text>
  <text class="n" x="670" y="100" text-anchor="middle">one transaction,</text>
  <text class="n" x="670" y="114" text-anchor="middle">run id on stops</text>

  <!-- Unassigned work -->
  <path class="ln ink" d="M438,122V156" marker-end="url(#fo-ro-ah-ink)"/>
  <rect class="cell band" x="378" y="158" width="120" height="26"/>
  <text class="t" x="438" y="171" text-anchor="middle" dominant-baseline="central">pool + reasons</text>

  <!-- Stale: discard and rebuild -->
  <path class="ln dash" d="M554,122V206H24V68H38" marker-end="url(#fo-ro-ah)"/>
  <text class="n" x="300" y="224" text-anchor="middle">a version changed while it ran: discard the result, re-solve from a new snapshot</text>
</svg>
