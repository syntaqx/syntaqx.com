<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 636">
  <defs>
    <marker id="pm-ac-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="pm-ac-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="pm-ac-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>
  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">PM-AUT-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">authorization clocks, visa pos</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: one point-of-sale authorization on a time axis -->
  <text class="vt" x="40" y="64">Plan view: one POS authorization, US</text>
  <text class="vs" x="40" y="80">Scale 1 s = 36 px · timeline · values in seconds</text>

  <!-- I1 and A1 above the issuer row -->
  <path class="ext" d="M100,147V95M460,147V95"/>
  <path class="dim" d="M100,100H460" marker-start="url(#pm-ac-ah)" marker-end="url(#pm-ac-ah)"/>
  <text class="dt" x="280" y="96" text-anchor="middle">I1 = 10.00 [1]</text>
  <path class="ext" d="M280,147V119"/>
  <path class="dim" d="M100,124H280" marker-start="url(#pm-ac-ah)" marker-end="url(#pm-ac-ah)"/>
  <text class="dt" x="190" y="120" text-anchor="middle">A1 = 5.00 [2]</text>

  <!-- Issuer row -->
  <text class="t" x="88" y="167" text-anchor="end" dominant-baseline="central">issuer</text>
  <rect class="obj fill-2" x="100" y="150" width="360" height="34"/>
  <path class="ctr" d="M280,144V190"/>
  <text class="sl ink" x="370" y="167" text-anchor="middle" dominant-baseline="central">issuer window</text>
  <circle class="dot" cx="460" cy="167" r="2"/>
  <path class="leader" d="M460,167L472,155H500"/>
  <text class="sl ink" x="504" y="155" dominant-baseline="central">stand-in answers</text>

  <!-- G1 between the rows -->
  <path class="ext" d="M460,187V211"/>
  <path class="ext" d="M640,227V201"/>
  <path class="dim" d="M460,206H640" marker-start="url(#pm-ac-ah)" marker-end="url(#pm-ac-ah)"/>
  <text class="dt" x="550" y="202" text-anchor="middle">G1 = M1 - I1 = 5.00</text>

  <!-- Merchant row: no timeout allowed before M1 -->
  <text class="t" x="88" y="247" text-anchor="end" dominant-baseline="central">merchant</text>
  <rect class="hatch" x="100" y="230" width="540" height="34" fill="url(#pm-ac-hatch)"/>
  <text class="sl ink ko" x="370" y="247" text-anchor="middle" dominant-baseline="central">no timeout before M1 [3]</text>
  <rect class="slot" x="640" y="230" width="72" height="34"/>
  <text class="t" x="676" y="247" text-anchor="middle" dominant-baseline="central">[4]</text>

  <!-- M1, the subject -->
  <path class="ext" d="M100,267V297M640,267V297"/>
  <path class="dim hl" d="M100,292H640" marker-start="url(#pm-ac-ah-hl)" marker-end="url(#pm-ac-ah-hl)"/>
  <text class="dt hl" x="370" y="288" text-anchor="middle">M1 ≥ 15.00 [3]</text>
  <text class="t" x="380" y="330" text-anchor="middle">M1 = I1 + G1 = 10.00 + 5.00 = 15.00</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="372">Variables</text>
  <text class="vs" x="40" y="388">Visa Rules, April 2026 · seconds</text>
  <rect class="cell band" x="40" y="398" width="60" height="22"/>
  <rect class="cell band" x="100" y="398" width="520" height="22"/>
  <rect class="cell band" x="620" y="398" width="100" height="22"/>
  <text class="cap ink" x="50" y="409" dominant-baseline="central">code</text>
  <text class="cap ink" x="110" y="409" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="409" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,420H720V508H40Z"/>
  <path class="ln ink" d="M100,420V508M620,420V508"/>
  <path class="ln" d="M40,442H720M40,464H720M40,486H720"/>
  <text class="t" x="50" y="431" dominant-baseline="central">I1</text>
  <text class="t" x="110" y="431" dominant-baseline="central">issuer answer limit before stand-in, POS</text>
  <text class="t" x="710" y="431" text-anchor="end" dominant-baseline="central">10.00</text>
  <text class="t" x="50" y="453" dominant-baseline="central">A1</text>
  <text class="t" x="110" y="453" dominant-baseline="central">issuer monthly average ceiling, US</text>
  <text class="t" x="710" y="453" text-anchor="end" dominant-baseline="central">5.00</text>
  <text class="t b" x="50" y="475" dominant-baseline="central">M1</text>
  <text class="t b" x="110" y="475" dominant-baseline="central">earliest acquirer or merchant timeout, POS</text>
  <text class="t b" x="710" y="475" text-anchor="end" dominant-baseline="central">≥ 15.00</text>
  <text class="t" x="50" y="497" dominant-baseline="central">G1</text>
  <text class="t" x="110" y="497" dominant-baseline="central">room for stand-in and the trip back: M1 - I1</text>
  <text class="t" x="710" y="497" text-anchor="end" dominant-baseline="central">5.00</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="524" width="680" height="92"/>
  <text class="sl ink" x="52" y="542">notes</text>
  <text class="n" x="52" y="560">[1] Visa Rules Table 7-1, POS outside Europe: if the issuer misses I1, Visa answers by Stand-In Processing.</text>
  <text class="n" x="52" y="576">[2] Visa Rules 7.3.3: in the US the issuer, stand-in included, must average at most A1 over each calendar month.</text>
  <text class="n" x="52" y="592">[3] Visa Rules 7.3.4.2: no POS timeout sooner than M1 (not in Europe). My own timeouts sit inside these.</text>
  <text class="n" x="52" y="608">[4] An approval that arrives after the merchant timed out must be reversed, never left to lapse.</text>
</svg>
