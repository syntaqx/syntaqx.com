<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 724">
  <defs>
    <marker id="gm-sp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-sp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-SOC-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">presence fan-out</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- View A: the roster -->
  <text class="vt" x="40" y="64">Plan view A: one player's friends list</text>
  <text class="vs" x="40" y="80">Illustrative [1] · 1 friend = 4 px</text>

  <path class="ext" d="M140,127V105M620,127V105"/>
  <path class="dim" d="M140,110H620" marker-start="url(#gm-sp-ah)" marker-end="url(#gm-sp-ah)"/>
  <text class="dt" x="380" y="106" text-anchor="middle">F1 = R1 + V1 + O1 = 25 + 5 + 90 = 120</text>

  <rect class="obj hl" x="140" y="130" width="100" height="24"/>
  <rect class="hatch" x="240" y="130" width="20" height="24" fill="url(#gm-sp-hatch)"/>
  <rect class="obj fill-2" x="260" y="130" width="360" height="24"/>
  <text class="sl ink" x="190" y="142" text-anchor="middle" dominant-baseline="central">online</text>
  <text class="sl ink" x="440" y="142" text-anchor="middle" dominant-baseline="central">offline friends</text>

  <!-- Chain under the strip -->
  <path class="ext" d="M140,157V227M240,157V185M260,157V227M620,157V185"/>
  <path class="dim" d="M140,180H240" marker-start="url(#gm-sp-ah)" marker-end="url(#gm-sp-ah)"/>
  <text class="dt" x="190" y="176" text-anchor="middle">R1 = 25</text>
  <path class="dim" d="M240,180H260"/>
  <text class="dt" x="265" y="198">V1 = 5 [2]</text>
  <path class="dim" d="M260,180H620" marker-start="url(#gm-sp-ah)" marker-end="url(#gm-sp-ah)"/>
  <text class="dt" x="440" y="176" text-anchor="middle">O1 = 90</text>
  <path class="dim" d="M140,222H260" marker-start="url(#gm-sp-ah)" marker-end="url(#gm-sp-ah)"/>
  <text class="dt" x="200" y="218" text-anchor="middle">N2 = 30</text>
  <text class="t" x="280" y="222" dominant-baseline="central">N2 = R1 + V1 = 25 + 5 = 30 online</text>

  <!-- View B: the pipeline -->
  <text class="vt" x="40" y="270">Plan view B: one status change, fanned out</text>
  <text class="vs" x="40" y="286">Not to scale · per change after coalescing [3]</text>

  <rect class="obj fill-2" x="40" y="310" width="150" height="40"/>
  <rect class="obj fill-2" x="220" y="310" width="150" height="40"/>
  <rect class="obj fill-2" x="400" y="310" width="150" height="40"/>
  <rect class="obj fill-1" x="580" y="310" width="150" height="40"/>
  <text class="sl ink" x="115" y="330" text-anchor="middle" dominant-baseline="central">status change</text>
  <text class="sl ink" x="295" y="330" text-anchor="middle" dominant-baseline="central">privacy filter</text>
  <text class="sl ink" x="475" y="330" text-anchor="middle" dominant-baseline="central">session router</text>
  <text class="sl ink" x="655" y="330" text-anchor="middle" dominant-baseline="central">edge sockets</text>
  <path class="ln ink" d="M190,330H219" marker-end="url(#gm-sp-ah)"/>
  <path class="ln ink" d="M370,330H399" marker-end="url(#gm-sp-ah)"/>
  <path class="ln ink" d="M550,330H579" marker-end="url(#gm-sp-ah)"/>
  <text class="n" x="115" y="370" text-anchor="middle">one event from the player</text>
  <text class="n" x="115" y="386" text-anchor="middle">U1 = 6 per hour</text>
  <text class="n" x="295" y="370" text-anchor="middle">N2 = 30 online friends</text>
  <text class="n" x="295" y="386" text-anchor="middle">drops V1 = 5</text>
  <text class="n" x="475" y="370" text-anchor="middle">R1 = 25 recipients</text>
  <text class="n" x="475" y="386" text-anchor="middle">D1 = 1.2 sessions each</text>
  <text class="n" x="655" y="370" text-anchor="middle">M1 = R1 x D1</text>
  <text class="n" x="655" y="386" text-anchor="middle">= 25 x 1.2 = 30 pushes</text>

  <text class="t" x="380" y="424" text-anchor="middle">Q1 = C1 x U1 x M1 / 3600 = 1,000,000 x 6 x 30 / 3600 = 50,000 pushes/s [4]</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="464">Variables</text>
  <text class="vs" x="40" y="480">Illustrative [1]</text>
  <rect class="cell band" x="40" y="490" width="50" height="22"/>
  <rect class="cell band" x="90" y="490" width="220" height="22"/>
  <rect class="cell band" x="310" y="490" width="90" height="22"/>
  <text class="cap ink" x="50" y="501" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="501" dominant-baseline="central">item</text>
  <text class="cap ink" x="390" y="501" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,512H400V710H40Z"/>
  <path class="ln ink" d="M90,512V710M310,512V710"/>
  <path class="ln" d="M40,534H400M40,556H400M40,578H400M40,600H400M40,622H400M40,644H400M40,666H400M40,688H400"/>
  <text class="t b" x="50" y="523" dominant-baseline="central">F1</text>
  <text class="t" x="100" y="523" dominant-baseline="central">friends on the list</text>
  <text class="t" x="390" y="523" text-anchor="end" dominant-baseline="central">120</text>
  <text class="t b" x="50" y="545" dominant-baseline="central">N2</text>
  <text class="t" x="100" y="545" dominant-baseline="central">friends online now</text>
  <text class="t" x="390" y="545" text-anchor="end" dominant-baseline="central">30</text>
  <text class="t b" x="50" y="567" dominant-baseline="central">V1</text>
  <text class="t" x="100" y="567" dominant-baseline="central">online, filtered out</text>
  <text class="t" x="390" y="567" text-anchor="end" dominant-baseline="central">5</text>
  <text class="t b" x="50" y="589" dominant-baseline="central">R1</text>
  <text class="t" x="100" y="589" dominant-baseline="central">recipients: N2 - V1</text>
  <text class="t" x="390" y="589" text-anchor="end" dominant-baseline="central">25</text>
  <text class="t b" x="50" y="611" dominant-baseline="central">O1</text>
  <text class="t" x="100" y="611" dominant-baseline="central">offline: F1 - N2</text>
  <text class="t" x="390" y="611" text-anchor="end" dominant-baseline="central">90</text>
  <text class="t b" x="50" y="633" dominant-baseline="central">D1</text>
  <text class="t" x="100" y="633" dominant-baseline="central">sessions per recipient</text>
  <text class="t" x="390" y="633" text-anchor="end" dominant-baseline="central">1.2</text>
  <text class="t b" x="50" y="655" dominant-baseline="central">M1</text>
  <text class="t" x="100" y="655" dominant-baseline="central">pushes per change</text>
  <text class="t" x="390" y="655" text-anchor="end" dominant-baseline="central">30</text>
  <text class="t b" x="50" y="677" dominant-baseline="central">U1</text>
  <text class="t" x="100" y="677" dominant-baseline="central">changes per player-hour</text>
  <text class="t" x="390" y="677" text-anchor="end" dominant-baseline="central">6</text>
  <text class="t b" x="50" y="699" dominant-baseline="central">C1</text>
  <text class="t" x="100" y="699" dominant-baseline="central">concurrent players</text>
  <text class="t" x="390" y="699" text-anchor="end" dominant-baseline="central">1,000,000</text>

  <!-- Notes -->
  <rect class="note-box" x="420" y="490" width="300" height="220"/>
  <text class="sl ink" x="432" y="508">notes</text>
  <text class="n" x="432" y="528">[1] Every value on this sheet is illustrative;</text>
  <text class="n" x="432" y="543">measure your own roster sizes and churn.</text>
  <text class="n" x="432" y="563">[2] Online but not told: the player appears</text>
  <text class="n" x="432" y="578">offline to them, they blocked each other, or</text>
  <text class="n" x="432" y="593">a privacy setting hides presence from them.</text>
  <text class="n" x="432" y="613">[3] Changes inside a short window merge</text>
  <text class="n" x="432" y="628">into one push; U1 counts after the merge.</text>
  <text class="n" x="432" y="648">[4] Q1 grows with C1 x U1 x M1, so roster</text>
  <text class="n" x="432" y="663">size and churn matter as much as player</text>
  <text class="n" x="432" y="678">count. Cut U1 first: it is the one you</text>
  <text class="n" x="432" y="693">control without hurting anyone's list.</text>
</svg>
