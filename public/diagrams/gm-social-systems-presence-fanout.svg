  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">EVERY VALUE ON THIS SHEET IS ILLUSTRATIVE; MEASURE YOUR OWN ROSTER SIZES AND CHURN.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">ONLINE BUT NOT TOLD: THE PLAYER APPEARS OFFLINE TO THEM, THEY BLOCKED EACH OTHER, OR A PRIVACY SETTING HIDES</text>
  <text class="nt" x="50" y="92">PRESENCE FROM THEM.</text>
  <rect class="nb" x="32" y="100.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="108.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">CHANGES INSIDE A SHORT WINDOW MERGE INTO ONE PUSH; U1 COUNTS AFTER THE MERGE.</text>
  <rect class="nb" x="32" y="117.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="125.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="126">Q1 GROWS WITH C1, U1 AND M1, SO ROSTER SIZE AND CHURN MATTER AS MUCH AS PLAYER COUNT. CUT U1 FIRST: IT IS THE ONE</text>
  <text class="nt" x="50" y="139">YOU CONTROL WITHOUT HURTING ANYONE'S LIST.</text>
  <text class="nt" x="50" y="156">THE DRAWING CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLE.</text>
