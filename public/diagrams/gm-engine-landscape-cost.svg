<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 794">
  <defs>
    <marker id="gm-elc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-elc-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-ELC-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">engine license cost at one revenue</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- View 1: revenue -->
  <text class="vt" x="40" y="64">Plan view: lifetime gross revenue</text>
  <text class="vs" x="40" y="80">Illustrative · scale $1M = 120 px · hatched: royalty-free [1]</text>

  <rect class="hatch" x="80" y="150" width="120" height="36" fill="url(#gm-elc-hatch)"/>
  <rect class="obj fill-2" x="200" y="150" width="480" height="36"/>
  <text class="sl ink" x="520" y="168" text-anchor="middle" dominant-baseline="central">royalty base</text>

  <!-- G1 -->
  <path class="ext" d="M80,147V107M680,147V107"/>
  <path class="dim" d="M80,112H680" marker-start="url(#gm-elc-ah)" marker-end="url(#gm-elc-ah)"/>
  <text class="dt" x="380" y="108" text-anchor="middle">G1 = E1 + B1 = 1.00 + 4.00 = 5.00</text>

  <!-- Chain: E1, B1 -->
  <path class="ext" d="M80,189V241M200,189V211M680,189V211"/>
  <path class="dim" d="M80,206H200" marker-start="url(#gm-elc-ah)" marker-end="url(#gm-elc-ah)"/>
  <text class="dt" x="140" y="202" text-anchor="middle">E1 = 1.00</text>
  <path class="dim" d="M200,206H680" marker-start="url(#gm-elc-ah)" marker-end="url(#gm-elc-ah)"/>
  <text class="dt" x="440" y="202" text-anchor="middle">B1 = G1 - E1 = 4.00</text>

  <!-- K1: break-even between the Unreal royalty and Unity Pro seats -->
  <path class="ctr" d="M358.4,140V244"/>
  <path class="dim" d="M80,236H358.4" marker-start="url(#gm-elc-ah)" marker-end="url(#gm-elc-ah)"/>
  <text class="dt" x="366" y="236" dominant-baseline="central">K1 = E1 + U1 / 0.05 = 1.00 + 1.32 = 2.32 [2]</text>

  <!-- View 2: license cost -->
  <text class="vt" x="40" y="290">Plan view: license cost, 10:1</text>
  <text class="vs" x="40" y="306">Illustrative · scale $1M = 1,200 px · values in $M</text>

  <path class="ctr" d="M200,320V480"/>

  <rect class="obj hl" x="200" y="330" width="240" height="22"/>
  <text class="sl ink" x="190" y="341" text-anchor="end" dominant-baseline="central">unreal 5%</text>
  <text class="dt hl" x="450" y="341" dominant-baseline="central">R1 = 0.05 × B1 = 0.05 × 4.00 = 0.200</text>

  <rect class="obj fill-2" x="200" y="370" width="168" height="22"/>
  <text class="sl ink" x="190" y="381" text-anchor="end" dominant-baseline="central">unreal 3.5% [3]</text>
  <text class="dt" x="378" y="381" dominant-baseline="central">R2 = 0.035 × B1 = 0.035 × 4.00 = 0.140</text>

  <rect class="obj fill-2" x="200" y="410" width="79.2" height="22"/>
  <text class="sl ink" x="190" y="421" text-anchor="end" dominant-baseline="central">unity pro</text>
  <text class="dt" x="289.2" y="421" dominant-baseline="central">U1 = N1 × P1 × Y1 = 10 × 2,200 × 3 = $66,000 = 0.066</text>

  <circle class="dot" cx="200" cy="461" r="2"/>
  <text class="sl ink" x="190" y="461" text-anchor="end" dominant-baseline="central">godot</text>
  <text class="dt" x="210" y="461" dominant-baseline="central">L1 = 0.000</text>

  <!-- Variables -->
  <text class="vt" x="40" y="510">Variables</text>
  <text class="vs" x="40" y="526">Illustrative [4] · $M unless noted</text>

  <rect class="cell band" x="40" y="536" width="50" height="22"/>
  <rect class="cell band" x="90" y="536" width="220" height="22"/>
  <rect class="cell band" x="310" y="536" width="70" height="22"/>
  <text class="cap ink" x="50" y="547" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="547" dominant-baseline="central">item</text>
  <text class="cap ink" x="370" y="547" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,558H380V668H40Z"/>
  <path class="ln ink" d="M90,558V668M310,558V668"/>
  <path class="ln" d="M40,580H380M40,602H380M40,624H380M40,646H380"/>
  <text class="t b" x="50" y="569" dominant-baseline="central">G1</text>
  <text class="t" x="100" y="569" dominant-baseline="central">lifetime gross: E1 + B1</text>
  <text class="t b" x="370" y="569" text-anchor="end" dominant-baseline="central">5.00</text>
  <text class="t" x="50" y="591" dominant-baseline="central">E1</text>
  <text class="t" x="100" y="591" dominant-baseline="central">royalty-free first $1M</text>
  <text class="t" x="370" y="591" text-anchor="end" dominant-baseline="central">1.00</text>
  <text class="t" x="50" y="613" dominant-baseline="central">B1</text>
  <text class="t" x="100" y="613" dominant-baseline="central">royalty base: G1 - E1</text>
  <text class="t" x="370" y="613" text-anchor="end" dominant-baseline="central">4.00</text>
  <text class="t" x="50" y="635" dominant-baseline="central">R1</text>
  <text class="t" x="100" y="635" dominant-baseline="central">Unreal royalty at 5%</text>
  <text class="t" x="370" y="635" text-anchor="end" dominant-baseline="central">0.200</text>
  <text class="t" x="50" y="657" dominant-baseline="central">R2</text>
  <text class="t" x="100" y="657" dominant-baseline="central">at 3.5%, EGS first</text>
  <text class="t" x="370" y="657" text-anchor="end" dominant-baseline="central">0.140</text>

  <rect class="cell band" x="400" y="536" width="50" height="22"/>
  <rect class="cell band" x="450" y="536" width="220" height="22"/>
  <rect class="cell band" x="670" y="536" width="70" height="22"/>
  <text class="cap ink" x="410" y="547" dominant-baseline="central">code</text>
  <text class="cap ink" x="460" y="547" dominant-baseline="central">item</text>
  <text class="cap ink" x="730" y="547" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M400,558H740V668H400Z"/>
  <path class="ln ink" d="M450,558V668M670,558V668"/>
  <path class="ln" d="M400,580H740M400,602H740M400,624H740M400,646H740"/>
  <text class="t" x="410" y="569" dominant-baseline="central">N1</text>
  <text class="t" x="460" y="569" dominant-baseline="central">seats</text>
  <text class="t" x="730" y="569" text-anchor="end" dominant-baseline="central">10</text>
  <text class="t" x="410" y="591" dominant-baseline="central">P1</text>
  <text class="t" x="460" y="591" dominant-baseline="central">Unity Pro, $ per seat-year</text>
  <text class="t" x="730" y="591" text-anchor="end" dominant-baseline="central">2,200</text>
  <text class="t" x="410" y="613" dominant-baseline="central">Y1</text>
  <text class="t" x="460" y="613" dominant-baseline="central">years on the subscription</text>
  <text class="t" x="730" y="613" text-anchor="end" dominant-baseline="central">3</text>
  <text class="t b" x="410" y="635" dominant-baseline="central">U1</text>
  <text class="t" x="460" y="635" dominant-baseline="central">Unity Pro: N1 x P1 x Y1</text>
  <text class="t b" x="730" y="635" text-anchor="end" dominant-baseline="central">0.066</text>
  <text class="t b" x="410" y="657" dominant-baseline="central">K1</text>
  <text class="t" x="460" y="657" dominant-baseline="central">break-even gross</text>
  <text class="t b" x="730" y="657" text-anchor="end" dominant-baseline="central">2.32</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="684" width="680" height="90"/>
  <text class="sl ink" x="52" y="705">notes</text>
  <text class="n" x="110" y="705">[1] Unreal (October 2026): 5% of gross above a product's first $1M; games pay royalties, not seats.</text>
  <text class="n" x="110" y="723">[2] Below K1 the Unity Pro seats cost more than the Unreal royalty; above it, the royalty costs more.</text>
  <text class="n" x="110" y="741">[3] Unity (Sept 12, 2024): Pro is $2,200 per seat-year from Jan 1, 2025. Unreal at 3.5%: EGS first.</text>
  <text class="n" x="110" y="759">[4] License fees only: no store fees, engineering or support. Godot is MIT, so L1 = 0.</text>
</svg>
