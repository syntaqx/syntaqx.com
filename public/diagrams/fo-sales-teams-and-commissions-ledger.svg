<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236">
  <defs>
    <marker id="fo-stc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-stc-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Happy path -->
  <path class="ln" d="M140,73H178" marker-end="url(#fo-stc-ah)"/>
  <text class="n" x="159" y="50" text-anchor="middle">signed</text>
  <path class="ln hl" d="M290,73H328" marker-end="url(#fo-stc-ah-hl)"/>
  <text class="n hl" x="310" y="50" text-anchor="middle">active, first visit</text>
  <path class="ln hl" d="M440,73H498" marker-end="url(#fo-stc-ah-hl)"/>
  <text class="n hl" x="470" y="50" text-anchor="middle">pay period</text>

  <rect class="cell" x="40" y="60" width="100" height="26"/>
  <text class="t" x="90" y="73" text-anchor="middle" dominant-baseline="central">sale</text>
  <rect class="cell band" x="180" y="60" width="110" height="26"/>
  <text class="t b" x="235" y="73" text-anchor="middle" dominant-baseline="central">pending</text>
  <rect class="cell hl" x="330" y="60" width="110" height="26"/>
  <text class="t hl b" x="385" y="73" text-anchor="middle" dominant-baseline="central">earned</text>
  <rect class="cell hl" x="500" y="60" width="100" height="26"/>
  <text class="t hl" x="550" y="73" text-anchor="middle" dominant-baseline="central">paid now</text>

  <!-- Holdback -->
  <path class="ln" d="M440,80C470,80 470,133 498,133" marker-end="url(#fo-stc-ah)"/>
  <rect class="cell" x="500" y="120" width="100" height="26"/>
  <text class="t" x="550" y="133" text-anchor="middle" dominant-baseline="central">held back</text>
  <path class="ln hl" d="M600,133H638" marker-end="url(#fo-stc-ah-hl)"/>
  <text class="n" x="620" y="112" text-anchor="middle">season end</text>
  <rect class="cell hl" x="640" y="120" width="90" height="26"/>
  <text class="t hl" x="685" y="133" text-anchor="middle" dominant-baseline="central">released</text>

  <!-- Cancellations -->
  <path class="ln" d="M235,86V178" marker-end="url(#fo-stc-ah)"/>
  <text class="n" x="228" y="136" text-anchor="end">cancelled in window</text>
  <path class="ln" d="M385,86V178" marker-end="url(#fo-stc-ah)"/>
  <text class="n" x="392" y="130">terminated in</text>
  <text class="n" x="392" y="144">clawback period</text>

  <rect class="cell ghost end" x="180" y="180" width="110" height="26"/>
  <text class="t dim" x="235" y="193" text-anchor="middle" dominant-baseline="central">void</text>
  <rect class="cell ghost end" x="330" y="180" width="110" height="26"/>
  <text class="t dim" x="385" y="193" text-anchor="middle" dominant-baseline="central">clawback (-)</text>

  <!-- Clawbacks net against holdback -->
  <path class="ln dash" d="M440,193H685V148" marker-end="url(#fo-stc-ah)"/>
  <text class="n" x="562" y="212" text-anchor="middle">nets against holdback first</text>
  <text class="n" x="235" y="224" text-anchor="middle">nothing was owed</text>
</svg>
