<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244">
  <defs>
    <marker id="fo-dv-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-dv-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- What moves each state -->
  <text class="n" x="115" y="44" text-anchor="middle">booked, windowed</text>
  <text class="n" x="247" y="44" text-anchor="middle">route published</text>
  <text class="n" x="379" y="44" text-anchor="middle">tap or geofence</text>
  <text class="n" x="511" y="44" text-anchor="middle">check-in or dwell</text>
  <text class="n" x="643" y="44" text-anchor="middle">proof captured</text>

  <!-- Happy path -->
  <rect class="cell" x="60" y="56" width="110" height="28"/>
  <text class="t" x="115" y="70" text-anchor="middle" dominant-baseline="central">scheduled</text>
  <rect class="cell hl" x="192" y="56" width="110" height="28"/>
  <text class="t hl" x="247" y="70" text-anchor="middle" dominant-baseline="central">dispatched</text>
  <rect class="cell hl" x="324" y="56" width="110" height="28"/>
  <text class="t hl" x="379" y="70" text-anchor="middle" dominant-baseline="central">en route</text>
  <rect class="cell hl" x="456" y="56" width="110" height="28"/>
  <text class="t hl" x="511" y="70" text-anchor="middle" dominant-baseline="central">on site</text>
  <rect class="cell hl end" x="588" y="56" width="110" height="28"/>
  <text class="t hl b" x="643" y="70" text-anchor="middle" dominant-baseline="central">completed</text>

  <path class="ln hl" d="M170,70H190" marker-end="url(#fo-dv-ah-hl)"/>
  <path class="ln hl" d="M302,70H322" marker-end="url(#fo-dv-ah-hl)"/>
  <path class="ln hl" d="M434,70H454" marker-end="url(#fo-dv-ah-hl)"/>
  <path class="ln hl" d="M566,70H586" marker-end="url(#fo-dv-ah-hl)"/>

  <!-- Visits that end without the work -->
  <path class="ln dash" d="M247,84V136M379,84V136M511,84V136H247"/>
  <path class="ln dash" d="M379,136V160" marker-end="url(#fo-dv-ah)"/>
  <rect class="cell ghost end" x="299" y="162" width="160" height="26"/>
  <text class="t dim" x="379" y="175" text-anchor="middle" dominant-baseline="central">not completed</text>
  <path class="ln dash" d="M459,175H526" marker-end="url(#fo-dv-ah)"/>
  <rect class="cell band" x="528" y="162" width="170" height="26"/>
  <text class="t" x="613" y="175" text-anchor="middle" dominant-baseline="central">work order to pool</text>
  <text class="n" x="299" y="204">reason: not home, no access, weather, unsafe</text>

  <!-- Cancellation -->
  <path class="ln dash" d="M115,84V160" marker-end="url(#fo-dv-ah)"/>
  <rect class="cell ghost end" x="60" y="162" width="110" height="26"/>
  <text class="t dim" x="115" y="175" text-anchor="middle" dominant-baseline="central">cancelled</text>

  <text class="n" x="60" y="228">running late is a flag on the visit, not a state: an ETA past the window end sends a notice</text>
</svg>
