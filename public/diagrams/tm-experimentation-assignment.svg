<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 818">
  <defs>
    <marker id="tm-ex-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="tm-ex-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="tm-ex-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">TM-EX-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">assignment and sample ratio</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: the bucket space -->
  <text class="vt" x="40" y="64">Plan view: hash buckets of one experiment</text>
  <text class="vs" x="40" y="80">Scale 1,000 buckets = 64 px · illustrative [4]</text>
  <rect class="hatch" x="60" y="140" width="12.8" height="40" fill="url(#tm-ex-hatch)"/>
  <rect class="obj fill-2" x="72.8" y="140" width="313.6" height="40"/>
  <rect class="obj hl" x="386.4" y="140" width="313.6" height="40"/>
  <text class="sl ink" x="229.6" y="160" text-anchor="middle" dominant-baseline="central">control</text>
  <text class="sl ink" x="543.2" y="160" text-anchor="middle" dominant-baseline="central">treatment</text>
  <circle class="dot" cx="66.4" cy="160" r="2"/>
  <path class="leader" d="M66.4,160L84,128H112"/>
  <text class="sl ink" x="116" y="128" dominant-baseline="central">holdout [2]</text>
  <path class="ext" d="M60,137V105M700,137V105"/>
  <path class="dim" d="M60,110H700" marker-start="url(#tm-ex-ah)" marker-end="url(#tm-ex-ah)"/>
  <text class="dt" x="380" y="106" text-anchor="middle">N = H + C + T = 10,000 buckets [1]</text>
  <path class="ext" d="M60,183V245M72.8,183V245M386.4,183V215M700,183V215"/>
  <path class="dim" d="M72.8,210H386.4" marker-start="url(#tm-ex-ah)" marker-end="url(#tm-ex-ah)"/>
  <text class="dt" x="229.6" y="206" text-anchor="middle">C = 4,900</text>
  <path class="dim hl" d="M386.4,210H700" marker-start="url(#tm-ex-ah-hl)" marker-end="url(#tm-ex-ah-hl)"/>
  <text class="dt hl" x="543.2" y="206" text-anchor="middle">T = 4,900</text>
  <path class="dim" d="M40,240H60" marker-end="url(#tm-ex-ah)"/>
  <path class="dim" d="M60,240H72.8"/>
  <path class="dim" d="M92.8,240H72.8" marker-end="url(#tm-ex-ah)"/>
  <text class="dt" x="98" y="240" dominant-baseline="central">H = 200</text>

  <!-- View B: observed exposures -->
  <text class="vt" x="40" y="284">View B: users observed, 50/50 configured</text>
  <text class="vs" x="40" y="300">Scale 1 px = 2,000 users · counts from [3]</text>
  <rect class="obj fill-2" x="140" y="320" width="410.8" height="24"/>
  <rect class="obj fill-1" x="140" y="352" width="407.7" height="24"/>
  <text class="sl ink" x="150" y="332" dominant-baseline="central">NC</text>
  <text class="sl ink" x="150" y="364" dominant-baseline="central">NT</text>
  <text class="sl" x="130" y="332" text-anchor="end" dominant-baseline="central">control</text>
  <text class="sl" x="130" y="364" text-anchor="end" dominant-baseline="central">treatment</text>
  <path class="ext" d="M550.8,347V405M547.7,379V405"/>
  <path class="dim" d="M527.7,400H547.7" marker-end="url(#tm-ex-ah)"/>
  <path class="dim" d="M547.7,400H550.8"/>
  <path class="dim" d="M570.8,400H550.8" marker-end="url(#tm-ex-ah)"/>
  <text class="dt" x="576" y="400" dominant-baseline="central">ΔN = 6,106</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="440">Variables</text>
  <text class="vs" x="40" y="456">Buckets illustrative [4] · users from [3]</text>
  <rect class="cell band" x="40" y="466" width="60" height="22"/>
  <rect class="cell band" x="100" y="466" width="480" height="22"/>
  <rect class="cell band" x="580" y="466" width="140" height="22"/>
  <text class="cap ink" x="50" y="477" dominant-baseline="central">code</text>
  <text class="cap ink" x="110" y="477" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="477" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,488H720V686H40Z"/>
  <path class="ln ink" d="M100,488V686M580,488V686"/>
  <path class="ln" d="M40,510H720M40,532H720M40,554H720M40,576H720M40,598H720M40,620H720M40,642H720M40,664H720"/>
  <text class="t" x="50" y="499" dominant-baseline="central">N</text>
  <text class="t" x="110" y="499" dominant-baseline="central">buckets in the hash space</text>
  <text class="t" x="710" y="499" text-anchor="end" dominant-baseline="central">10,000</text>
  <text class="t" x="50" y="521" dominant-baseline="central">H</text>
  <text class="t" x="110" y="521" dominant-baseline="central">holdout buckets, 2%</text>
  <text class="t" x="710" y="521" text-anchor="end" dominant-baseline="central">200</text>
  <text class="t" x="50" y="543" dominant-baseline="central">C</text>
  <text class="t" x="110" y="543" dominant-baseline="central">control buckets</text>
  <text class="t" x="710" y="543" text-anchor="end" dominant-baseline="central">4,900</text>
  <text class="t" x="50" y="565" dominant-baseline="central">T</text>
  <text class="t" x="110" y="565" dominant-baseline="central">treatment buckets</text>
  <text class="t" x="710" y="565" text-anchor="end" dominant-baseline="central">4,900</text>
  <text class="t" x="50" y="587" dominant-baseline="central">NC</text>
  <text class="t" x="110" y="587" dominant-baseline="central">control users observed</text>
  <text class="t" x="710" y="587" text-anchor="end" dominant-baseline="central">821,588</text>
  <text class="t" x="50" y="609" dominant-baseline="central">NT</text>
  <text class="t" x="110" y="609" dominant-baseline="central">treatment users observed</text>
  <text class="t" x="710" y="609" text-anchor="end" dominant-baseline="central">815,482</text>
  <text class="t" x="50" y="631" dominant-baseline="central">ΔN</text>
  <text class="t" x="110" y="631" dominant-baseline="central">NC - NT (50.19% / 49.81%)</text>
  <text class="t" x="710" y="631" text-anchor="end" dominant-baseline="central">6,106</text>
  <text class="t" x="50" y="653" dominant-baseline="central">X2</text>
  <text class="t" x="110" y="653" dominant-baseline="central">chi-square vs 50/50, 1 df</text>
  <text class="t" x="710" y="653" text-anchor="end" dominant-baseline="central">22.77</text>
  <text class="t b" x="50" y="675" dominant-baseline="central">p</text>
  <text class="t" x="110" y="675" dominant-baseline="central">chance of a split this uneven</text>
  <text class="t b" x="710" y="675" text-anchor="end" dominant-baseline="central">0.0000018</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="706" width="680" height="92"/>
  <text class="sl ink" x="52" y="724">notes</text>
  <text class="n" x="52" y="742">[1] bucket = hash(seed + unit id) mod 10,000: the same id always lands in the same bucket.</text>
  <text class="n" x="52" y="758">[2] Holdout buckets see no launched features; 1% to 2% is the size Statsig recommends.</text>
  <text class="n" x="52" y="774">[3] Fabijan et al., KDD 2019: a 50.2/49.8 split that chance explains less than 1 in 500,000.</text>
  <text class="n" x="52" y="790">[4] Bucket counts are illustrative. A gap of 0.37 points is invisible in View B and decisive.</text>
</svg>
