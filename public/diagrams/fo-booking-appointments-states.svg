<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276">
  <defs>
    <marker id="fo-ba-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ba-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Outside the visit lifecycle -->
  <rect class="cell ghost" x="120" y="36" width="220" height="26"/>
  <text class="t dim" x="230" y="49" text-anchor="middle" dominant-baseline="central">request: work order or lead</text>
  <path class="ln" d="M206,62V108" marker-end="url(#fo-ba-ah)"/>
  <text class="n" x="214" y="90">office books a slot</text>

  <!-- Visit states -->
  <rect class="cell band" x="40" y="110" width="100" height="26"/>
  <text class="t b" x="90" y="123" text-anchor="middle" dominant-baseline="central">held</text>
  <rect class="cell hl" x="156" y="110" width="100" height="26"/>
  <text class="t hl b" x="206" y="123" text-anchor="middle" dominant-baseline="central">scheduled</text>
  <rect class="cell" x="272" y="110" width="100" height="26"/>
  <text class="t" x="322" y="123" text-anchor="middle" dominant-baseline="central">dispatched</text>
  <rect class="cell" x="388" y="110" width="100" height="26"/>
  <text class="t" x="438" y="123" text-anchor="middle" dominant-baseline="central">en_route</text>
  <rect class="cell" x="504" y="110" width="100" height="26"/>
  <text class="t" x="554" y="123" text-anchor="middle" dominant-baseline="central">on_site</text>
  <rect class="cell end" x="620" y="110" width="100" height="26"/>
  <text class="t b" x="670" y="123" text-anchor="middle" dominant-baseline="central">completed</text>

  <path class="ln hl" d="M140,123H154" marker-end="url(#fo-ba-ah-hl)"/>
  <path class="ln hl" d="M256,123H270" marker-end="url(#fo-ba-ah-hl)"/>
  <path class="ln hl" d="M372,123H386" marker-end="url(#fo-ba-ah-hl)"/>
  <path class="ln hl" d="M488,123H502" marker-end="url(#fo-ba-ah-hl)"/>
  <path class="ln hl" d="M604,123H618" marker-end="url(#fo-ba-ah-hl)"/>
  <text class="n hl" x="148" y="102" text-anchor="middle">confirm</text>

  <!-- Exits -->
  <rect class="cell ghost end" x="156" y="190" width="100" height="26"/>
  <text class="t dim" x="206" y="203" text-anchor="middle" dominant-baseline="central">cancelled</text>
  <path class="ln dash" d="M90,136C90,170 180,166 180,188" marker-end="url(#fo-ba-ah)"/>
  <path class="ln dash" d="M206,136V188" marker-end="url(#fo-ba-ah)"/>
  <text class="n" x="206" y="234" text-anchor="middle">reason, by whom (an expired hold too)</text>

  <rect class="cell ghost end" x="504" y="190" width="100" height="26"/>
  <text class="t dim" x="554" y="203" text-anchor="middle" dominant-baseline="central">not_completed</text>
  <path class="ln dash" d="M554,136V188" marker-end="url(#fo-ba-ah)"/>
  <text class="n" x="554" y="234" text-anchor="middle">reason: not home, no access, weather</text>

  <text class="n hl" x="720" y="264" text-anchor="end">rescheduling changes the window, never the visit</text>
</svg>
