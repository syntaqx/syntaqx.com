  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE BUSINESS CLOCK: PLACED BEFORE PICKUP, RELEASED ON SCHEDULE AFTER RETURN UNLESS A CLAIM IS FILED.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">THE CARD CLOCK: ONE AUTHORIZATION LAPSES FIRST, SO A DEPOSIT IS A SEQUENCE OF AUTHORIZATIONS.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">A CLAIM EXTENDS THE HOLD; A DECLINED RE-AUTHORIZATION BECOMES A TASK AND A NOTICE, NOT A SILENT GAP.</text>
  <text class="nt" x="50" y="113">DAYS FROM THE TRIP'S START. THE TRIP LENGTH IS AN EXAMPLE. CODES ON THE DRAWING; VALUES IN THE TABLE.</text>
