<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260">
  <defs>
    <marker id="fo-cpl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-cpl-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="40" y="30">stage</text>

  <!-- Stages -->
  <rect class="cell band" x="40" y="40" width="100" height="28"/>
  <text class="t b" x="90" y="54" text-anchor="middle" dominant-baseline="central">knock</text>
  <path class="ln hl" d="M140,54H154" marker-end="url(#fo-cpl-ah-hl)"/>

  <rect class="cell hl" x="156" y="40" width="100" height="28"/>
  <text class="t hl b" x="206" y="54" text-anchor="middle" dominant-baseline="central">sign</text>
  <path class="ln hl" d="M256,54H270" marker-end="url(#fo-cpl-ah-hl)"/>

  <rect class="cell hl" x="272" y="40" width="100" height="28"/>
  <text class="t hl b" x="322" y="54" text-anchor="middle" dominant-baseline="central">window</text>
  <path class="ln hl" d="M372,54H386" marker-end="url(#fo-cpl-ah-hl)"/>

  <rect class="cell hl" x="388" y="40" width="100" height="28"/>
  <text class="t hl b" x="438" y="54" text-anchor="middle" dominant-baseline="central">term</text>
  <path class="ln hl" d="M488,54H502" marker-end="url(#fo-cpl-ah-hl)"/>

  <rect class="cell hl" x="504" y="40" width="100" height="28"/>
  <text class="t hl b" x="554" y="54" text-anchor="middle" dominant-baseline="central">contact</text>
  <path class="ln dash" d="M604,54H618" marker-end="url(#fo-cpl-ah)"/>

  <rect class="cell band" x="620" y="40" width="100" height="28"/>
  <text class="t b" x="670" y="54" text-anchor="middle" dominant-baseline="central">collections</text>

  <!-- Rules -->
  <text class="cap" x="40" y="96">the rules</text>
  <rect class="cell" x="40" y="104" width="100" height="84"/>
  <text class="n" x="48" y="120">city permit</text>
  <text class="n" x="48" y="136">ID badge</text>
  <text class="n" x="48" y="152">no-knock list</text>
  <text class="n" x="48" y="168">local hours</text>

  <rect class="cell" x="156" y="104" width="100" height="84"/>
  <text class="n" x="164" y="120">Cooling-Off</text>
  <text class="n" x="164" y="136">state law</text>
  <text class="n" x="164" y="152">ESIGN consent</text>
  <text class="n" x="164" y="168">Reg Z, Holder</text>

  <rect class="cell" x="272" y="104" width="100" height="84"/>
  <text class="n" x="276" y="120">3 business days</text>
  <text class="n" x="276" y="136">longer by state</text>
  <text class="n" x="276" y="152">refund in 10</text>
  <text class="n" x="276" y="168">no early lien</text>

  <rect class="cell" x="388" y="104" width="100" height="84"/>
  <text class="n" x="392" y="120">ROSCA</text>
  <text class="n" x="392" y="136">state ARLs</text>
  <text class="n" x="392" y="152">yearly reminder</text>
  <text class="n" x="392" y="168">easy cancel</text>

  <rect class="cell" x="504" y="104" width="100" height="84"/>
  <text class="n" x="512" y="120">TCPA, state</text>
  <text class="n" x="512" y="136">CAN-SPAM</text>
  <text class="n" x="512" y="152">AI disclosure</text>
  <text class="n" x="512" y="168">recording</text>

  <rect class="cell" x="620" y="104" width="100" height="84"/>
  <text class="n" x="628" y="120">FDCPA</text>
  <text class="n" x="628" y="136">Regulation F</text>
  <text class="n" x="628" y="152">if a third</text>
  <text class="n" x="628" y="168">party collects</text>

  <!-- Cancellation branch -->
  <path class="ln dash" d="M322,188V214" marker-end="url(#fo-cpl-ah)"/>
  <rect class="cell ghost end" x="262" y="216" width="120" height="26"/>
  <text class="t dim" x="322" y="229" text-anchor="middle" dominant-baseline="central">cancelled</text>
  <text class="n" x="398" y="229" dominant-baseline="central">receipt time starts the refund clock</text>
</svg>
