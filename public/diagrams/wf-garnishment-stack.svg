  <text class="nt" x="50" y="62">DISPOSABLE EARNINGS SUBTRACT ONLY DEDUCTIONS REQUIRED BY LAW; VOLUNTARY ONES STAY IN THE BASE.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">SUPPORT IS TAKEN FIRST, UP TO ITS CAP; THE IRS LEVY THEN TAKES TAKE-HOME PAY ABOVE THE EXEMPT AMOUNT.</text>
