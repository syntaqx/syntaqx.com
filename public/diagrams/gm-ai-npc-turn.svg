  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">T1 IS THE SILENCE THE CLIENT WAITS FOR BEFORE DECIDING THE PLAYER HAS FINISHED SPEAKING.</text>
