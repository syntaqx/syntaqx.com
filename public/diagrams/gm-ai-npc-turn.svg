<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 590">
  <defs>
    <marker id="gm-ai-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-ai-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-ai-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-AI-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">voice npc turn, latency budget</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view -->
  <text class="vt" x="40" y="64">Plan view: one conversation turn</text>
  <text class="vs" x="40" y="80">Scale 1 ms = 0.5 px · timeline · values in ms</text>

  <!-- L1 -->
  <path class="ext" d="M100,125V95M675,125V95"/>
  <path class="dim hl" d="M100,100H675" marker-start="url(#gm-ai-ah-hl)" marker-end="url(#gm-ai-ah-hl)"/>
  <text class="dt hl" x="387.5" y="96" text-anchor="middle">L1 = 1,150 [1]</text>

  <!-- Stages -->
  <rect class="obj fill-2" x="100" y="128" width="150" height="40"/>
  <rect class="obj fill-2" x="250" y="128" width="75" height="40"/>
  <rect class="obj fill-1" x="325" y="128" width="25" height="40"/>
  <rect class="obj fill-2" x="350" y="128" width="200" height="40"/>
  <rect class="obj fill-1" x="550" y="128" width="25" height="40"/>
  <rect class="obj fill-2" x="575" y="128" width="100" height="40"/>
  <text class="sl ink" x="175" y="148" text-anchor="middle" dominant-baseline="central">end of speech</text>
  <text class="sl ink" x="287.5" y="148" text-anchor="middle" dominant-baseline="central">ASR</text>
  <text class="sl ink" x="450" y="148" text-anchor="middle" dominant-baseline="central">LLM</text>
  <text class="sl ink" x="625" y="148" text-anchor="middle" dominant-baseline="central">TTS</text>

  <!-- Leaders for the two filters -->
  <circle class="dot" cx="337.5" cy="140" r="2"/>
  <path class="leader" d="M337.5,140L326,116H300"/>
  <text class="sl ink" x="296" y="116" text-anchor="end" dominant-baseline="central">input filter</text>
  <circle class="dot" cx="562.5" cy="140" r="2"/>
  <path class="leader" d="M562.5,140L551,116H530"/>
  <text class="sl ink" x="526" y="116" text-anchor="end" dominant-baseline="central">output filter</text>

  <!-- Detail circle on T5 -->
  <circle class="detail" cx="562.5" cy="148" r="22"/>
  <text class="sl ink" x="589" y="116" dominant-baseline="central">detail A</text>

  <!-- Chain T1 to T6 -->
  <path class="ext" d="M100,171V197M250,171V197M325,171V219M350,171V219M550,171V219M575,171V219M675,171V197"/>
  <path class="dim" d="M100,192H250" marker-start="url(#gm-ai-ah)" marker-end="url(#gm-ai-ah)"/>
  <text class="dt" x="175" y="188" text-anchor="middle">T1 = 300</text>
  <path class="dim" d="M250,192H325" marker-start="url(#gm-ai-ah)" marker-end="url(#gm-ai-ah)"/>
  <text class="dt" x="287.5" y="188" text-anchor="middle">T2 = 150</text>
  <path class="dim" d="M350,192H550" marker-start="url(#gm-ai-ah)" marker-end="url(#gm-ai-ah)"/>
  <text class="dt" x="450" y="188" text-anchor="middle">T4 = 400</text>
  <path class="dim" d="M575,192H675" marker-start="url(#gm-ai-ah)" marker-end="url(#gm-ai-ah)"/>
  <text class="dt" x="625" y="188" text-anchor="middle">T6 = 200</text>
  <path class="dim" d="M305,214H325" marker-end="url(#gm-ai-ah)"/>
  <path class="dim" d="M325,214H350"/>
  <path class="dim" d="M370,214H350" marker-end="url(#gm-ai-ah)"/>
  <text class="dt" x="301" y="214" text-anchor="end" dominant-baseline="central">T3 = 50</text>
  <path class="dim" d="M530,214H550" marker-end="url(#gm-ai-ah)"/>
  <path class="dim" d="M550,214H575"/>
  <path class="dim" d="M595,214H575" marker-end="url(#gm-ai-ah)"/>
  <text class="dt" x="599" y="214" dominant-baseline="central">T5 = 50</text>
  <text class="t" x="387.5" y="246" text-anchor="middle">L1 = T1 + ... + T6 = 300 + 150 + 50 + 400 + 50 + 200 = 1,150</text>

  <!-- Detail A: output filter, per sentence -->
  <text class="vt" x="40" y="282">Detail A: output filter</text>
  <text class="vs" x="40" y="298">Not to scale · gated per sentence</text>
  <text class="sl ink" x="50" y="324" dominant-baseline="central">llm</text>
  <text class="sl ink" x="50" y="366" dominant-baseline="central">filter</text>
  <text class="sl ink" x="50" y="408" dominant-baseline="central">tts</text>
  <rect class="obj fill-2" x="140" y="312" width="90" height="24"/>
  <rect class="obj fill-2" x="230" y="312" width="90" height="24"/>
  <rect class="hatch" x="320" y="312" width="90" height="24" fill="url(#gm-ai-hatch)"/>
  <text class="sl ink" x="185" y="324" text-anchor="middle" dominant-baseline="central">S1</text>
  <text class="sl ink" x="275" y="324" text-anchor="middle" dominant-baseline="central">S2</text>
  <text class="sl ink ko" x="365" y="324" text-anchor="middle" dominant-baseline="central">S3</text>
  <rect class="obj" x="170" y="356" width="30" height="20"/>
  <rect class="obj" x="260" y="356" width="30" height="20"/>
  <rect class="obj" x="350" y="356" width="30" height="20"/>
  <text class="t" x="386" y="366" dominant-baseline="central">[3]</text>
  <path class="ln ink" d="M185,338V354" marker-end="url(#gm-ai-ah)"/>
  <path class="ln ink" d="M275,338V354" marker-end="url(#gm-ai-ah)"/>
  <path class="ln ink" d="M365,338V354" marker-end="url(#gm-ai-ah)"/>
  <path class="ln ink" d="M185,378V394" marker-end="url(#gm-ai-ah)"/>
  <path class="ln ink" d="M275,378V394" marker-end="url(#gm-ai-ah)"/>
  <path class="ln ink" d="M365,378V394" marker-end="url(#gm-ai-ah)"/>
  <rect class="obj fill-2" x="140" y="396" width="90" height="24"/>
  <rect class="obj fill-2" x="230" y="396" width="90" height="24"/>
  <rect class="obj fill-1" x="320" y="396" width="90" height="24"/>
  <text class="sl ink" x="185" y="408" text-anchor="middle" dominant-baseline="central">S1</text>
  <text class="sl ink" x="275" y="408" text-anchor="middle" dominant-baseline="central">S2</text>
  <text class="sl ink" x="365" y="408" text-anchor="middle" dominant-baseline="central">fallback</text>
  <text class="n" x="140" y="444">Each sentence is checked before it is spoken;</text>
  <text class="n" x="140" y="460">S1 plays while S2 is still being generated.</text>

  <!-- Variable table -->
  <text class="vt" x="440" y="282">Variables</text>
  <text class="vs" x="440" y="298">Illustrative [1] · ms</text>
  <rect class="cell band" x="440" y="308" width="50" height="22"/>
  <rect class="cell band" x="490" y="308" width="180" height="22"/>
  <rect class="cell band" x="670" y="308" width="70" height="22"/>
  <text class="cap ink" x="450" y="319" dominant-baseline="central">code</text>
  <text class="cap ink" x="500" y="319" dominant-baseline="central">item</text>
  <text class="cap ink" x="730" y="319" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M440,330H740V484H440Z"/>
  <path class="ln ink" d="M490,330V484M670,330V484"/>
  <path class="ln" d="M440,352H740M440,374H740M440,396H740M440,418H740M440,440H740M440,462H740"/>
  <text class="t b" x="450" y="341" dominant-baseline="central">L1</text>
  <text class="t" x="500" y="341" dominant-baseline="central">speech end to voice</text>
  <text class="t b" x="730" y="341" text-anchor="end" dominant-baseline="central">1,150</text>
  <text class="t" x="450" y="363" dominant-baseline="central">T1</text>
  <text class="t" x="500" y="363" dominant-baseline="central">end of speech [2]</text>
  <text class="t" x="730" y="363" text-anchor="end" dominant-baseline="central">300</text>
  <text class="t" x="450" y="385" dominant-baseline="central">T2</text>
  <text class="t" x="500" y="385" dominant-baseline="central">ASR final text</text>
  <text class="t" x="730" y="385" text-anchor="end" dominant-baseline="central">150</text>
  <text class="t" x="450" y="407" dominant-baseline="central">T3</text>
  <text class="t" x="500" y="407" dominant-baseline="central">input moderation</text>
  <text class="t" x="730" y="407" text-anchor="end" dominant-baseline="central">50</text>
  <text class="t" x="450" y="429" dominant-baseline="central">T4</text>
  <text class="t" x="500" y="429" dominant-baseline="central">LLM first sentence</text>
  <text class="t" x="730" y="429" text-anchor="end" dominant-baseline="central">400</text>
  <text class="t" x="450" y="451" dominant-baseline="central">T5</text>
  <text class="t" x="500" y="451" dominant-baseline="central">output moderation</text>
  <text class="t" x="730" y="451" text-anchor="end" dominant-baseline="central">50</text>
  <text class="t" x="450" y="473" dominant-baseline="central">T6</text>
  <text class="t" x="500" y="473" dominant-baseline="central">TTS first audio</text>
  <text class="t" x="730" y="473" text-anchor="end" dominant-baseline="central">200</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="500" width="700" height="76"/>
  <text class="sl ink" x="52" y="518">notes</text>
  <text class="n" x="52" y="536">[1] Illustrative budget, not a measurement: real values come from your vendors, models and network.</text>
  <text class="n" x="52" y="552">[2] The silence the client waits for before deciding the player has finished speaking.</text>
  <text class="n" x="52" y="568">[3] A blocked sentence never reaches TTS: a scripted fallback line plays and the turn is logged.</text>
</svg>
