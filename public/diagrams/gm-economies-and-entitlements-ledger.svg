  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE: P1 BUYS 1000 PAID GEMS, G1 GRANTS 200 EARNED, S1 SPENDS 600 EARNED-FIRST (200 EARNED, THEN</text>
  <text class="nt" x="50" y="75">400 PAID).</text>
  <rect class="nb" x="31" y="82.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">R1 CLAWS BACK ALL 1000 PAID GEMS; ALONE IT LEAVES PAID AT MINUS 400 (THE HATCHED GHOST), SO V1 REVOKES</text>
  <text class="nt" x="50" y="105">THE ITEM IN THE SAME TRANSACTION.</text>
  <rect class="nb" x="31" y="112.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="122" text-anchor="middle">3</text>
  <text class="nt" x="50" y="122">EACH LEDGER ROW SUMS TO ZERO AND EACH COLUMN TO ITS CLOSING BALANCE: THE WALLET IS ONLY EVER THE SUM</text>
  <text class="nt" x="50" y="135">OF ITS ENTRIES.</text>
  <text class="nt" x="50" y="152">VALUES IN GEMS. THE PLAN VIEW CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLES.</text>
