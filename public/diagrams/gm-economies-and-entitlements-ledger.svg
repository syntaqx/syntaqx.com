<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 640">
  <defs>
    <marker id="gm-ee-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-ee-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-ee-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-ECO-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">currency ledger, one wallet</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: wallet balance after each transaction -->
  <text class="vt" x="40" y="64">Plan view: wallet after each transaction</text>
  <text class="vs" x="40" y="80">Scale 100 gems = 10 px · illustrative [1] · gems</text>

  <!-- Axis: zero balance -->
  <path class="ctr" d="M100,230H600"/>
  <text class="sl" x="94" y="230" text-anchor="end" dominant-baseline="central">0</text>

  <!-- Tx1 purchase: paid 1000 -->
  <rect class="obj fill-1" x="120" y="130" width="70" height="100"/>
  <text class="t" x="155" y="120" text-anchor="middle">1000</text>
  <!-- Tx2 grant: paid 1000, earned 200 -->
  <rect class="obj fill-1" x="250" y="130" width="70" height="100"/>
  <rect class="obj fill-2" x="250" y="110" width="70" height="20"/>
  <text class="t" x="285" y="100" text-anchor="middle">1200</text>
  <!-- Tx3 spend: paid 600, earned 0 -->
  <rect class="obj fill-1" x="380" y="170" width="70" height="60"/>
  <text class="t" x="415" y="160" text-anchor="middle">600</text>
  <!-- Tx4 refund + revoke: paid 0, earned 200 -->
  <rect class="obj fill-2" x="510" y="210" width="70" height="20"/>
  <text class="t" x="545" y="200" text-anchor="middle">200</text>
  <!-- Ghost: clawback posted without the revoke -->
  <rect class="hatch" x="510" y="230" width="70" height="40" fill="url(#gm-ee-hatch)"/>
  <circle class="dot" cx="545" cy="262" r="2"/>
  <path class="leader" d="M545,262L557,274H600"/>
  <text class="t" x="604" y="274" dominant-baseline="central">[2] &#x2212;400</text>

  <!-- P1 dimension on the Tx1 bar -->
  <path class="ext" d="M117,130H97M117,230H97"/>
  <path class="dim" d="M102,130V230" marker-start="url(#gm-ee-ah)" marker-end="url(#gm-ee-ah)"/>
  <text class="dt" x="96" y="160" text-anchor="end" dominant-baseline="central">P1 = 1000</text>

  <!-- Bar labels -->
  <text class="sl ink" x="155" y="294" text-anchor="middle">tx1</text>
  <text class="sl" x="155" y="308" text-anchor="middle">purchase</text>
  <text class="sl ink" x="285" y="294" text-anchor="middle">tx2</text>
  <text class="sl" x="285" y="308" text-anchor="middle">grant</text>
  <text class="sl ink" x="415" y="294" text-anchor="middle">tx3</text>
  <text class="sl" x="415" y="308" text-anchor="middle">spend</text>
  <text class="sl ink" x="545" y="294" text-anchor="middle">tx4</text>
  <text class="sl" x="545" y="308" text-anchor="middle">refund</text>

  <!-- Legend -->
  <rect class="obj fill-1" x="630" y="110" width="16" height="12"/>
  <text class="sl ink" x="654" y="116" dominant-baseline="central">paid</text>
  <rect class="obj fill-2" x="630" y="134" width="16" height="12"/>
  <text class="sl ink" x="654" y="140" dominant-baseline="central">earned</text>
  <rect class="hatch" x="630" y="158" width="16" height="12" fill="url(#gm-ee-hatch)"/>
  <text class="sl ink" x="654" y="164" dominant-baseline="central">ghost</text>

  <!-- Ledger: entries per transaction -->
  <text class="vt" x="40" y="348">Ledger: entries by account</text>
  <text class="vs" x="40" y="364">Every row sums to zero [3] · gems</text>
  <rect class="cell band" x="30" y="374" width="40" height="22"/>
  <rect class="cell band" x="70" y="374" width="130" height="22"/>
  <rect class="cell band" x="200" y="374" width="90" height="22"/>
  <rect class="cell band" x="290" y="374" width="90" height="22"/>
  <rect class="cell band" x="380" y="374" width="90" height="22"/>
  <rect class="cell band" x="470" y="374" width="90" height="22"/>
  <rect class="cell band" x="560" y="374" width="90" height="22"/>
  <rect class="cell band" x="650" y="374" width="80" height="22"/>
  <text class="t b" x="38" y="385" dominant-baseline="central">tx</text>
  <text class="t b" x="78" y="385" dominant-baseline="central">event</text>
  <text class="t b" x="282" y="385" text-anchor="end" dominant-baseline="central">player_paid</text>
  <text class="t b" x="372" y="385" text-anchor="end" dominant-baseline="central">player_earned</text>
  <text class="t b" x="462" y="385" text-anchor="end" dominant-baseline="central">issued_paid</text>
  <text class="t b" x="552" y="385" text-anchor="end" dominant-baseline="central">issued_earned</text>
  <text class="t b" x="642" y="385" text-anchor="end" dominant-baseline="central">consumed</text>
  <text class="t b" x="722" y="385" text-anchor="end" dominant-baseline="central">sum</text>
  <path class="cell" d="M30,396H730V506H30Z"/>
  <path class="ln ink" d="M70,396V506M200,396V506M290,396V506M380,396V506M470,396V506M560,396V506M650,396V506M30,484H730"/>
  <path class="ln" d="M30,418H730M30,440H730M30,462H730"/>
  <!-- Tx1 -->
  <text class="t" x="38" y="407" dominant-baseline="central">1</text>
  <text class="t" x="78" y="407" dominant-baseline="central">purchase P1</text>
  <text class="t" x="282" y="407" text-anchor="end" dominant-baseline="central">+1000</text>
  <text class="t" x="462" y="407" text-anchor="end" dominant-baseline="central">&#x2212;1000</text>
  <text class="t" x="722" y="407" text-anchor="end" dominant-baseline="central">0</text>
  <!-- Tx2 -->
  <text class="t" x="38" y="429" dominant-baseline="central">2</text>
  <text class="t" x="78" y="429" dominant-baseline="central">grant G1</text>
  <text class="t" x="372" y="429" text-anchor="end" dominant-baseline="central">+200</text>
  <text class="t" x="552" y="429" text-anchor="end" dominant-baseline="central">&#x2212;200</text>
  <text class="t" x="722" y="429" text-anchor="end" dominant-baseline="central">0</text>
  <!-- Tx3 -->
  <text class="t" x="38" y="451" dominant-baseline="central">3</text>
  <text class="t" x="78" y="451" dominant-baseline="central">spend S1</text>
  <text class="t" x="282" y="451" text-anchor="end" dominant-baseline="central">&#x2212;400</text>
  <text class="t" x="372" y="451" text-anchor="end" dominant-baseline="central">&#x2212;200</text>
  <text class="t" x="642" y="451" text-anchor="end" dominant-baseline="central">+600</text>
  <text class="t" x="722" y="451" text-anchor="end" dominant-baseline="central">0</text>
  <!-- Tx4 -->
  <text class="t" x="38" y="473" dominant-baseline="central">4</text>
  <text class="t" x="78" y="473" dominant-baseline="central">refund R1+V1</text>
  <text class="t" x="282" y="473" text-anchor="end" dominant-baseline="central">&#x2212;600</text>
  <text class="t" x="372" y="473" text-anchor="end" dominant-baseline="central">+200</text>
  <text class="t" x="462" y="473" text-anchor="end" dominant-baseline="central">+1000</text>
  <text class="t" x="642" y="473" text-anchor="end" dominant-baseline="central">&#x2212;600</text>
  <text class="t" x="722" y="473" text-anchor="end" dominant-baseline="central">0</text>
  <!-- Closing -->
  <text class="t b" x="78" y="495" dominant-baseline="central">closing</text>
  <text class="t b" x="282" y="495" text-anchor="end" dominant-baseline="central">0</text>
  <text class="t b" x="372" y="495" text-anchor="end" dominant-baseline="central">200</text>
  <text class="t b" x="462" y="495" text-anchor="end" dominant-baseline="central">0</text>
  <text class="t b" x="552" y="495" text-anchor="end" dominant-baseline="central">&#x2212;200</text>
  <text class="t b" x="642" y="495" text-anchor="end" dominant-baseline="central">0</text>
  <text class="t b" x="722" y="495" text-anchor="end" dominant-baseline="central">0</text>

  <!-- Closing formulas -->
  <text class="t" x="30" y="528">BP = P1 &#x2212; S1p &#x2212; R1 + V1p = 1000 &#x2212; 400 &#x2212; 1000 + 400 = 0</text>
  <text class="t" x="30" y="546">BE = G1 &#x2212; S1e + V1e = 200 &#x2212; 200 + 200 = 200</text>

  <!-- Notes -->
  <rect class="note-box" x="30" y="560" width="700" height="72"/>
  <text class="sl ink" x="42" y="578">notes</text>
  <text class="n" x="42" y="596">[1] Illustrative: P1 buys 1000 paid gems, G1 grants 200 earned, S1 spends 600 earned-first (S1e 200, S1p 400).</text>
  <text class="n" x="42" y="611">[2] R1 claws back all 1000 paid gems; alone it leaves paid at &#x2212;400, so V1 revokes the item in the same transaction.</text>
  <text class="n" x="42" y="626">[3] Each column sums to its closing balance, and the wallet is only ever the sum of its entries.</text>
</svg>
