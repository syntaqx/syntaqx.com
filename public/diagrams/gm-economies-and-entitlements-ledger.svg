  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE: P1 BUYS 1000 PAID GEMS, G1 GRANTS 200 EARNED, S1 SPENDS 600 EARNED-FIRST (200 EARNED, THEN 400 PAID).</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">R1 CLAWS BACK ALL 1000 PAID GEMS; ALONE IT LEAVES PAID AT MINUS 400 (THE HATCHED GHOST), SO V1 REVOKES THE ITEM IN</text>
  <text class="nt" x="50" y="92">THE SAME TRANSACTION.</text>
  <rect class="nb" x="32" y="100.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="108.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">EACH LEDGER ROW SUMS TO ZERO AND EACH COLUMN TO ITS CLOSING BALANCE: THE WALLET IS ONLY EVER THE SUM OF ITS</text>
  <text class="nt" x="50" y="122">ENTRIES.</text>
  <text class="nt" x="50" y="139">VALUES IN GEMS. THE PLAN VIEW CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLES.</text>
