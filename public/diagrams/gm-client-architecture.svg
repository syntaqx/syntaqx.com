  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE HOST LOADS THE PLUGINS THE MANIFEST LISTS, IF THEIR VERSIONS AGREE, AS THE PLAYER'S</text>
  <text class="nt" x="50" y="75">ENTITLEMENTS ALLOW.</text>
  <rect class="nb" x="31" y="82.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">THE UI REBUILDS FROM THE SERVICES WITH GETS AND WATCHES CHANGES; IT CAN CLOSE WHILE SERVICES KEEP</text>
  <text class="nt" x="50" y="105">STATE.</text>
  <rect class="nb" x="31" y="112.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="122" text-anchor="middle">3</text>
  <text class="nt" x="50" y="122">HAND THE GAME A SHORT-LIVED TOKEN, NEVER THE ACCOUNT CREDENTIAL; THE CLIENT STEPS BACK WHILE THE</text>
  <text class="nt" x="50" y="135">MATCH RUNS.</text>
  <text class="nt" x="50" y="152">NOT TO SCALE; PLATE CONTENTS ARE SCHEMATIC. PLUGIN MODEL PER A STUDIO'S 2016 AND 2017 POSTS; FIGURES</text>
  <text class="nt" x="50" y="165">IN MB.</text>
