<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 804">
  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-LCH-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">desktop client process stack</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <text class="vt" x="40" y="64">Exploded axonometric: front-end client</text>
  <text class="vs" x="40" y="80">Not to scale · plugin model per Riot's 2016 and 2017 posts</text>

  <!-- Assembly lines through the stack's outer corners, behind the plates -->
  <path class="phantom" d="M295,244V464M645,201V421"/>

  <!-- 00 game process: its own executable, drawn with a gap below the client -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 370)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="125" height="60"/>
    <rect class="cell band" x="155" y="100" width="125" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="458.65" r="2"/>
  <path class="leader" d="M309.5,458.65L297.5,446.65H270"/>
  <text class="sl ink" x="264" y="446.65" text-anchor="end" dominant-baseline="central">00 game process</text>
  <text class="n" x="264" y="462.65" text-anchor="end">separate executable, own loopback API</text>

  <!-- 01 plugin host -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 274)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="260" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="362.65" r="2"/>
  <path class="leader" d="M309.5,362.65L297.5,350.65H270"/>
  <text class="sl ink" x="264" y="350.65" text-anchor="end" dominant-baseline="central">01 plugin host</text>
  <text class="n" x="264" y="366.65" text-anchor="end">manifest, semver, entitlements [1]</text>

  <!-- 02 local services -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 212)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="57.5" height="60"/>
    <rect class="cell band" x="87.5" y="100" width="57.5" height="60"/>
    <rect class="cell band" x="155" y="100" width="57.5" height="60"/>
    <rect class="cell band" x="222.5" y="100" width="57.5" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="300.65" r="2"/>
  <path class="leader" d="M309.5,300.65L297.5,288.65H270"/>
  <text class="sl ink" x="264" y="288.65" text-anchor="end" dominant-baseline="central">02 local services</text>
  <text class="n" x="264" y="304.65" text-anchor="end">back-end plugins, canonical state [2]</text>

  <!-- 03 web UI -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 150)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="80" height="60"/>
    <rect class="cell band" x="110" y="100" width="80" height="60"/>
    <rect class="cell band" x="200" y="100" width="80" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="238.65" r="2"/>
  <path class="leader" d="M309.5,238.65L297.5,226.65H270"/>
  <text class="sl ink" x="264" y="226.65" text-anchor="end" dominant-baseline="central">03 web UI</text>
  <text class="n" x="264" y="242.65" text-anchor="end">CEF renderer, front-end plugins</text>

  <!-- Interfaces between layers -->
  <text class="n" x="740" y="236" text-anchor="end">REST and</text>
  <text class="n" x="740" y="250" text-anchor="end">WebSocket [2]</text>
  <text class="n" x="740" y="366" text-anchor="end">launches</text>
  <text class="n" x="740" y="380" text-anchor="end">with token [3]</text>

  <!-- Published figures -->
  <text class="vt" x="40" y="552">Published figures</text>
  <text class="vs" x="40" y="568">Riot engineering and dev posts · MB</text>
  <rect class="cell band" x="40" y="578" width="50" height="22"/>
  <rect class="cell band" x="90" y="578" width="530" height="22"/>
  <rect class="cell band" x="620" y="578" width="100" height="22"/>
  <text class="cap ink" x="50" y="589" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="589" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="589" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,600H720V688H40Z"/>
  <path class="ln ink" d="M90,600V688M620,600V688"/>
  <path class="ln" d="M40,622H720M40,644H720M40,666H720"/>
  <text class="t" x="50" y="611" dominant-baseline="central">M1</text>
  <text class="t" x="100" y="611" dominant-baseline="central">desktop services ("foundation") memory, about, 2016</text>
  <text class="t" x="710" y="611" text-anchor="end" dominant-baseline="central">20</text>
  <text class="t" x="50" y="633" dominant-baseline="central">M2</text>
  <text class="t" x="100" y="633" dominant-baseline="central">front-end memory per session, p50, CEF 74</text>
  <text class="t" x="710" y="633" text-anchor="end" dominant-baseline="central">597</text>
  <text class="t" x="50" y="655" dominant-baseline="central">M3</text>
  <text class="t" x="100" y="655" dominant-baseline="central">same, p50, CEF 91 (patch 11.17, September 2021)</text>
  <text class="t" x="710" y="655" text-anchor="end" dominant-baseline="central">275</text>
  <text class="t b" x="50" y="677" dominant-baseline="central">M4</text>
  <text class="t" x="100" y="677" dominant-baseline="central">saved by the engine upgrade: M2 - M3 = 597 - 275</text>
  <text class="t b" x="710" y="677" text-anchor="end" dominant-baseline="central">322</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="706" width="680" height="78"/>
  <text class="sl ink" x="52" y="724">notes</text>
  <text class="n" x="52" y="742">[1] The host loads the plugins a build's manifest lists, if their versions agree, chosen by the player's entitlements.</text>
  <text class="n" x="52" y="758">[2] The UI rebuilds itself from the services with GETs and watches changes, so it can close while services keep state.</text>
  <text class="n" x="52" y="774">[3] Hand the game a short-lived token, never the account credential; the client steps back while the match runs.</text>
</svg>
