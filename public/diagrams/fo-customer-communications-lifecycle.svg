<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206">
  <defs>
    <marker id="fo-cc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-cc-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Row heads -->
  <text class="cap" x="30" y="30">job event</text>

  <!-- Job events along the timeline -->
  <rect class="cell" x="30" y="40" width="108" height="26"/>
  <text class="t" x="84" y="53" text-anchor="middle" dominant-baseline="central">booked</text>
  <rect class="cell" x="150" y="40" width="108" height="26"/>
  <text class="t" x="204" y="53" text-anchor="middle" dominant-baseline="central">day before</text>
  <rect class="cell hl" x="270" y="40" width="108" height="26"/>
  <text class="t hl" x="324" y="53" text-anchor="middle" dominant-baseline="central">tech en route</text>
  <rect class="cell" x="390" y="40" width="108" height="26"/>
  <text class="t" x="444" y="53" text-anchor="middle" dominant-baseline="central">visit complete</text>
  <rect class="cell" x="510" y="40" width="108" height="26"/>
  <text class="t" x="564" y="53" text-anchor="middle" dominant-baseline="central">invoiced</text>
  <rect class="cell" x="630" y="40" width="108" height="26"/>
  <text class="t" x="684" y="53" text-anchor="middle" dominant-baseline="central">days later</text>

  <path class="ln" d="M138,53H149" marker-end="url(#fo-cc-ah)"/>
  <path class="ln hl" d="M258,53H269" marker-end="url(#fo-cc-ah-hl)"/>
  <path class="ln" d="M378,53H389" marker-end="url(#fo-cc-ah)"/>
  <path class="ln" d="M498,53H509" marker-end="url(#fo-cc-ah)"/>
  <path class="ln" d="M618,53H629" marker-end="url(#fo-cc-ah)"/>

  <!-- The message each event sends -->
  <text class="cap" x="30" y="90">message</text>
  <rect class="cell" x="30" y="98" width="108" height="26"/>
  <text class="t" x="84" y="111" text-anchor="middle" dominant-baseline="central">confirmation</text>
  <rect class="cell" x="150" y="98" width="108" height="26"/>
  <text class="t" x="204" y="111" text-anchor="middle" dominant-baseline="central">reminder</text>
  <rect class="cell hl" x="270" y="98" width="108" height="26"/>
  <text class="t hl b" x="324" y="111" text-anchor="middle" dominant-baseline="central">on my way + ETA</text>
  <rect class="cell" x="390" y="98" width="108" height="26"/>
  <text class="t" x="444" y="111" text-anchor="middle" dominant-baseline="central">service report</text>
  <rect class="cell" x="510" y="98" width="108" height="26"/>
  <text class="t" x="564" y="111" text-anchor="middle" dominant-baseline="central">invoice, receipt</text>
  <rect class="cell" x="630" y="98" width="108" height="26"/>
  <text class="t" x="684" y="111" text-anchor="middle" dominant-baseline="central">review request</text>

  <!-- Channel -->
  <text class="n" x="84" y="140" text-anchor="middle">SMS and email</text>
  <text class="n" x="204" y="140" text-anchor="middle">SMS, email, voice</text>
  <text class="n hl" x="324" y="140" text-anchor="middle">SMS, live link</text>
  <text class="n" x="444" y="140" text-anchor="middle">email, PDF</text>
  <text class="n" x="564" y="140" text-anchor="middle">email, pay link</text>
  <text class="n" x="684" y="140" text-anchor="middle">SMS or email</text>

  <!-- Consent class -->
  <text class="cap" x="30" y="162">CTIA class</text>
  <rect class="cell band" x="30" y="170" width="588" height="22"/>
  <text class="t" x="324" y="181" text-anchor="middle" dominant-baseline="central">informational: express consent, no promotion inside</text>
  <rect class="cell ghost" x="630" y="170" width="108" height="22"/>
  <text class="t dim" x="684" y="181" text-anchor="middle" dominant-baseline="central">check purpose</text>
</svg>
