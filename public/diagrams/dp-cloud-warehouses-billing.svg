  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE WAREHOUSE BILLS FROM START TO SUSPEND, WHETHER OR NOT A QUERY IS RUNNING.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">WITH A1 THE IDLE GAP BETWEEN THE QUERIES NEVER REACHES THE SUSPEND THRESHOLD, SO IT STAYS BILLED.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">WITH A2 IT SUSPENDS BETWEEN QUERIES AND RESUMES ON THE NEXT ONE. EACH START BILLS AT LEAST M1, AND DROPS THE</text>
  <text class="nt" x="50" y="109">LOCAL CACHE.</text>
  <text class="nt" x="50" y="126">SECONDS. WORKLOAD ILLUSTRATIVE. THE DRAWING CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLE.</text>
