  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE WAREHOUSE BILLS FROM START TO SUSPEND, WHETHER OR NOT A QUERY IS RUNNING.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">WITH A1 THE IDLE GAP BETWEEN THE QUERIES NEVER REACHES THE SUSPEND THRESHOLD, SO IT STAYS BILLED.</text>
  <rect class="nb" x="31" y="86.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="96" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">WITH A2 IT SUSPENDS BETWEEN QUERIES AND RESUMES ON THE NEXT ONE. EACH START BILLS AT LEAST M1, AND</text>
  <text class="nt" x="50" y="109">DROPS THE LOCAL CACHE.</text>
  <text class="nt" x="50" y="126">SECONDS. WORKLOAD ILLUSTRATIVE. THE DRAWING CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLE.</text>
