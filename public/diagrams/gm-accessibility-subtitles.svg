<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 940">
  <defs>
    <marker id="gm-ax-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-ax-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-A11Y-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">subtitle legibility, 1080p</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: the frame -->
  <text class="vt" x="40" y="64">Plan view: one 1080p frame, console</text>
  <text class="vs" x="40" y="80">Scale 1:4 · layout illustrative · values in px at 1080p</text>

  <!-- W0 -->
  <path class="ext" d="M60,107V95M540,107V95"/>
  <path class="dim" d="M60,100H540" marker-start="url(#gm-ax-ah)" marker-end="url(#gm-ax-ah)"/>
  <text class="dt" x="300" y="96" text-anchor="middle">W0 = 1920</text>

  <!-- Frame -->
  <rect class="obj fill-2" x="60" y="110" width="480" height="270"/>
  <path class="ctr" d="M300,116V290"/>

  <!-- H0 -->
  <path class="ext" d="M543,110H565M543,380H565"/>
  <path class="dim" d="M560,110V380" marker-start="url(#gm-ax-ah)" marker-end="url(#gm-ax-ah)"/>
  <text class="dt" x="568" y="245" dominant-baseline="central">H0 = 1080</text>

  <!-- Subtitle block -->
  <rect class="obj fill-1" x="150" y="320" width="300" height="38"/>
  <rect class="cell band" x="162" y="327" width="276" height="7"/>
  <rect class="cell band" x="162" y="343" width="200" height="7"/>

  <!-- L1 across the line -->
  <path class="ext" d="M162,324V297M438,324V297"/>
  <path class="dim" d="M162,302H438" marker-start="url(#gm-ax-ah)" marker-end="url(#gm-ax-ah)"/>
  <text class="dt" x="300" y="298" text-anchor="middle">L1 ≤ 40 chars [1]</text>

  <!-- Detail circle on line 1 -->
  <circle class="detail" cx="172" cy="330.5" r="14"/>
  <text class="sl ink" x="150" y="300" text-anchor="end" dominant-baseline="central">detail A</text>

  <!-- Leaders, below the frame -->
  <circle class="dot" cx="340" cy="346.5" r="2"/>
  <path class="leader" d="M340,346.5L328,398H290"/>
  <text class="sl ink" x="286" y="398" text-anchor="end" dominant-baseline="central">line 2 of L2 [1]</text>
  <circle class="dot" cx="444" cy="354" r="2"/>
  <path class="leader" d="M444,354L456,398H500"/>
  <text class="sl ink" x="504" y="398" dominant-baseline="central">background [2]</text>

  <!-- Detail A: text body height -->
  <text class="vt" x="40" y="470">Detail A: text body height</text>
  <text class="vs" x="40" y="486">Scale 10:1 against the plan · 1 px = 2.5</text>
  <path class="ln ink" d="M60,630H465"/>
  <rect class="obj fill-2" x="80" y="565" width="120" height="65"/>
  <rect class="obj fill-2" x="275" y="500" width="150" height="130"/>
  <text class="sl ink" x="140" y="597.5" text-anchor="middle" dominant-baseline="central">default</text>
  <text class="sl ink" x="350" y="565" text-anchor="middle" dominant-baseline="central">at 200%</text>
  <text class="sl" x="60" y="646" dominant-baseline="central">body height = descender + x-height + ascender</text>

  <!-- S1 -->
  <path class="ext" d="M203,565H217M203,630H217"/>
  <path class="dim" d="M212,565V630" marker-start="url(#gm-ax-ah)" marker-end="url(#gm-ax-ah)"/>
  <text class="dt" x="218" y="597.5" dominant-baseline="central">S1 = 26</text>

  <!-- S5 -->
  <path class="ext" d="M428,500H442M428,630H442"/>
  <path class="dim hl" d="M437,500V630" marker-start="url(#gm-ax-ah-hl)" marker-end="url(#gm-ax-ah-hl)"/>
  <text class="dt hl" x="443" y="550" dominant-baseline="central">S5 = S1 x K1</text>
  <text class="dt hl" x="443" y="566" dominant-baseline="central">= 26 x 2.00</text>
  <text class="dt hl" x="443" y="582" dominant-baseline="central">= 52 = T1 [3]</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="690">Variables</text>
  <text class="vs" x="40" y="706">From XAG 101, 102 and 104 · px at the given resolution</text>
  <rect class="cell band" x="40" y="716" width="50" height="22"/>
  <rect class="cell band" x="90" y="716" width="230" height="22"/>
  <rect class="cell band" x="320" y="716" width="60" height="22"/>
  <rect class="cell band" x="400" y="716" width="50" height="22"/>
  <rect class="cell band" x="450" y="716" width="210" height="22"/>
  <rect class="cell band" x="660" y="716" width="60" height="22"/>
  <text class="cap ink" x="48" y="727" dominant-baseline="central">code</text>
  <text class="cap ink" x="98" y="727" dominant-baseline="central">item</text>
  <text class="cap ink" x="374" y="727" text-anchor="end" dominant-baseline="central">value</text>
  <text class="cap ink" x="408" y="727" dominant-baseline="central">code</text>
  <text class="cap ink" x="458" y="727" dominant-baseline="central">item</text>
  <text class="cap ink" x="714" y="727" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,738H380V870H40Z"/>
  <path class="cell" d="M400,738H720V870H400Z"/>
  <path class="ln ink" d="M90,738V870M320,738V870M450,738V870M660,738V870"/>
  <path class="ln" d="M40,760H380M40,782H380M40,804H380M40,826H380M40,848H380M400,760H720M400,782H720M400,804H720M400,826H720M400,848H720"/>

  <text class="t" x="48" y="749" dominant-baseline="central">S1</text>
  <text class="t" x="98" y="749" dominant-baseline="central">console text, 1080p</text>
  <text class="t" x="374" y="749" text-anchor="end" dominant-baseline="central">26</text>
  <text class="t" x="48" y="771" dominant-baseline="central">S2</text>
  <text class="t" x="98" y="771" dominant-baseline="central">console text, 4K</text>
  <text class="t" x="374" y="771" text-anchor="end" dominant-baseline="central">52</text>
  <text class="t" x="48" y="793" dominant-baseline="central">S3</text>
  <text class="t" x="98" y="793" dominant-baseline="central">PC/VR text, 1080p</text>
  <text class="t" x="374" y="793" text-anchor="end" dominant-baseline="central">18</text>
  <text class="t" x="48" y="815" dominant-baseline="central">S4</text>
  <text class="t" x="98" y="815" dominant-baseline="central">PC/VR text, 4K</text>
  <text class="t" x="374" y="815" text-anchor="end" dominant-baseline="central">36</text>
  <text class="t" x="48" y="837" dominant-baseline="central">K1</text>
  <text class="t" x="98" y="837" dominant-baseline="central">text scaling, at least</text>
  <text class="t" x="374" y="837" text-anchor="end" dominant-baseline="central">2.00</text>
  <text class="t b" x="48" y="859" dominant-baseline="central">S5</text>
  <text class="t" x="98" y="859" dominant-baseline="central">console 1080p at K1: S1 x K1</text>
  <text class="t b" x="374" y="859" text-anchor="end" dominant-baseline="central">52</text>

  <text class="t" x="408" y="749" dominant-baseline="central">T1</text>
  <text class="t" x="458" y="749" dominant-baseline="central">large text, console 1080p</text>
  <text class="t" x="714" y="749" text-anchor="end" dominant-baseline="central">52</text>
  <text class="t" x="408" y="771" dominant-baseline="central">C1</text>
  <text class="t" x="458" y="771" dominant-baseline="central">contrast, standard text</text>
  <text class="t" x="714" y="771" text-anchor="end" dominant-baseline="central">4.5:1</text>
  <text class="t" x="408" y="793" dominant-baseline="central">C2</text>
  <text class="t" x="458" y="793" dominant-baseline="central">contrast, large text</text>
  <text class="t" x="714" y="793" text-anchor="end" dominant-baseline="central">3:1</text>
  <text class="t" x="408" y="815" dominant-baseline="central">L1</text>
  <text class="t" x="458" y="815" dominant-baseline="central">characters per line, max</text>
  <text class="t" x="714" y="815" text-anchor="end" dominant-baseline="central">40</text>
  <text class="t" x="408" y="837" dominant-baseline="central">L2</text>
  <text class="t" x="458" y="837" dominant-baseline="central">lines on screen, max</text>
  <text class="t" x="714" y="837" text-anchor="end" dominant-baseline="central">2</text>
  <text class="t" x="408" y="859" dominant-baseline="central">W0</text>
  <text class="t" x="458" y="859" dominant-baseline="central">frame width; H0 = 1080</text>
  <text class="t" x="714" y="859" text-anchor="end" dominant-baseline="central">1920</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="878" width="680" height="56"/>
  <text class="n" x="52" y="894">[1] XAG 104: avoid lines over 40 characters; show two lines at most (three in exceptional cases).</text>
  <text class="n" x="52" y="910">[2] XAG 104: a solid background behind subtitles, color set by the player, opacity adjustable from 0 to 100%.</text>
  <text class="n" x="52" y="926">[3] XAG 102: on console, 52 px at 1080p is large text, so S5 needs C2 against its background, smaller text C1.</text>
</svg>
