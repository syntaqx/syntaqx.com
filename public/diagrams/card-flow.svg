<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268">
  <defs>
    <marker id="cf-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="cf-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="cf-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- The parties -->
  <text class="cap" x="40" y="20">the four parties, and the network between them</text>
  <rect class="cell" x="40" y="32" width="128" height="26"/>
  <text class="t b" x="104" y="45" text-anchor="middle" dominant-baseline="central">cardholder</text>
  <rect class="cell" x="168" y="32" width="128" height="26"/>
  <text class="t b" x="232" y="45" text-anchor="middle" dominant-baseline="central">merchant</text>
  <rect class="cell" x="296" y="32" width="128" height="26"/>
  <text class="t b" x="360" y="45" text-anchor="middle" dominant-baseline="central">acquirer</text>
  <rect class="cell band" x="424" y="32" width="128" height="26"/>
  <text class="t b" x="488" y="45" text-anchor="middle" dominant-baseline="central">network</text>
  <rect class="cell" x="552" y="32" width="128" height="26"/>
  <text class="t b" x="616" y="45" text-anchor="middle" dominant-baseline="central">issuer</text>

  <text class="n" x="104" y="76" text-anchor="middle">presents the card</text>
  <text class="n" x="232" y="76" text-anchor="middle">sells, then captures</text>
  <text class="n" x="360" y="76" text-anchor="middle">and its processor</text>
  <text class="n" x="488" y="76" text-anchor="middle">routes, clears, rules</text>
  <text class="n" x="616" y="76" text-anchor="middle">approves, then pays</text>

  <!-- 1. Authorization -->
  <text class="cap ink" x="40" y="108">1. authorization, in seconds</text>
  <text class="t dim" x="680" y="108" text-anchor="end">0100 / 0110</text>
  <path class="ln ink" d="M168,120H678" marker-end="url(#cf-ah-ink)"/>
  <text class="n" x="176" y="136">request: is this card good for this amount?</text>
  <path class="ln" d="M680,146H170" marker-end="url(#cf-ah)"/>
  <text class="n" x="672" y="162" text-anchor="end">approved with an auth code, or a decline code; nothing has moved yet</text>

  <!-- 2. Clearing -->
  <text class="cap ink" x="40" y="190">2. capture and clearing, in batches</text>
  <path class="ln ink" d="M168,202H678" marker-end="url(#cf-ah-ink)"/>
  <text class="n" x="176" y="218">the final amount, in a clearing file the network matches to the authorization</text>

  <!-- 3. Settlement and funding -->
  <text class="cap hl" x="40" y="242">3. settlement and funding, later</text>
  <path class="ln hl" d="M680,254H170" marker-end="url(#cf-ah-hl)"/>
  <text class="n hl" x="672" y="242" text-anchor="end">money moves last, the other way, less interchange and fees</text>
</svg>
