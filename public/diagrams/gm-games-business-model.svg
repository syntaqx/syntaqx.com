  <text class="n" x="410" y="166" text-anchor="middle">held by an account</text>
  <text class="n" x="680" y="166" text-anchor="middle">held by a profile</text>

  <!-- Play -->
  <text class="cap" x="40" y="194">play</text>
  <rect class="cell" x="40" y="204" width="80" height="26"/>
  <text class="t" x="80" y="217" text-anchor="middle" dominant-baseline="central">party</text>
