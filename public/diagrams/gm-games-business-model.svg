  <text class="n" x="515" y="246" text-anchor="middle">runs a server build</text>

  <!-- Conduct -->
  <text class="cap" x="40" y="274">conduct</text>
  <rect class="cell" x="40" y="284" width="90" height="26"/>
  <text class="t" x="85" y="297" text-anchor="middle" dominant-baseline="central">report</text>
  <rect class="cell" x="210" y="284" width="100" height="26"/>
  <text class="t" x="260" y="297" text-anchor="middle" dominant-baseline="central">penalty</text>
  <path class="ln dash" d="M130,297H208" marker-end="url(#gm-gbmo-ah)"/>
  <text class="n" x="169" y="290" text-anchor="middle">can lead to</text>
  <text class="n" x="85" y="326" text-anchor="middle">profile about profile</text>
  <text class="n" x="260" y="326" text-anchor="middle">on an account: one game or all</text>
