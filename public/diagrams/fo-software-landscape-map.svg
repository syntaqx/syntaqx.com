<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312">
  <defs>
    <marker id="fo-sl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-sl-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Systems of record -->
  <text class="cap hl" x="30" y="30">systems of record: own the customer, agreement, schedule and ledger</text>
  <rect class="zone" x="30" y="40" width="700" height="72"/>
  <rect class="cell" x="40" y="54" width="124" height="26"/>
  <text class="t" x="102" y="67" text-anchor="middle" dominant-baseline="central">SMB horizontal</text>
  <text class="n" x="102" y="98" text-anchor="middle">Jobber, Workiz</text>
  <rect class="cell" x="178" y="54" width="124" height="26"/>
  <text class="t" x="240" y="67" text-anchor="middle" dominant-baseline="central">trade suites</text>
  <text class="n" x="240" y="98" text-anchor="middle">ServiceTitan</text>
  <rect class="cell" x="316" y="54" width="124" height="26"/>
  <text class="t" x="378" y="67" text-anchor="middle" dominant-baseline="central">property care</text>
  <text class="n" x="378" y="98" text-anchor="middle">FieldRoutes, Skimmer</text>
  <rect class="cell" x="454" y="54" width="124" height="26"/>
  <text class="t" x="516" y="67" text-anchor="middle" dominant-baseline="central">enterprise</text>
  <text class="n" x="516" y="98" text-anchor="middle">Salesforce, D365</text>
  <rect class="cell" x="592" y="54" width="124" height="26"/>
  <text class="t" x="654" y="67" text-anchor="middle" dominant-baseline="central">AI-native</text>
  <text class="n" x="654" y="98" text-anchor="middle">Solea</text>

  <!-- Integration arrows -->
  <path class="ln hl" d="M378,140V114" marker-end="url(#fo-sl-ah-hl)"/>
  <text class="n hl" x="386" y="131">APIs, webhooks, marketplaces</text>

  <!-- Specialists -->
  <text class="cap" x="30" y="136">specialists: one job done deeper</text>
  <rect class="zone" x="30" y="142" width="700" height="72"/>
  <rect class="cell" x="40" y="156" width="160" height="26"/>
  <text class="t" x="120" y="169" text-anchor="middle" dominant-baseline="central">scheduling engines</text>
  <text class="n" x="120" y="200" text-anchor="middle">Skedulo, Timefold</text>
  <rect class="cell" x="212" y="156" width="160" height="26"/>
  <text class="t" x="292" y="169" text-anchor="middle" dominant-baseline="central">delivery dispatch</text>
  <text class="n" x="292" y="200" text-anchor="middle">Onfleet, eLogii, Spoke</text>
  <rect class="cell" x="384" y="156" width="160" height="26"/>
  <text class="t" x="464" y="169" text-anchor="middle" dominant-baseline="central">D2D field sales</text>
  <text class="n" x="464" y="200" text-anchor="middle">SalesRabbit, Spotio</text>
  <rect class="cell" x="556" y="156" width="160" height="26"/>
  <text class="t" x="636" y="169" text-anchor="middle" dominant-baseline="central">AI front office</text>
  <text class="n" x="636" y="200" text-anchor="middle">Avoca, Probook, Rilla</text>

  <path class="ln" d="M378,242V216" marker-end="url(#fo-sl-ah)"/>
  <text class="n" x="386" y="233">embedded or connected</text>

  <!-- Ecosystem -->
  <text class="cap" x="30" y="238">ecosystem: rails and data</text>
  <rect class="zone" x="30" y="244" width="700" height="48"/>
  <rect class="cell ghost" x="40" y="255" width="104" height="26"/>
  <text class="t" x="92" y="268" text-anchor="middle" dominant-baseline="central">payments</text>
  <rect class="cell ghost" x="155" y="255" width="104" height="26"/>
  <text class="t" x="207" y="268" text-anchor="middle" dominant-baseline="central">financing</text>
  <rect class="cell ghost" x="270" y="255" width="104" height="26"/>
  <text class="t" x="322" y="268" text-anchor="middle" dominant-baseline="central">SMS, voice</text>
  <rect class="cell ghost" x="385" y="255" width="104" height="26"/>
  <text class="t" x="437" y="268" text-anchor="middle" dominant-baseline="central">telematics</text>
  <rect class="cell ghost" x="500" y="255" width="104" height="26"/>
  <text class="t" x="552" y="268" text-anchor="middle" dominant-baseline="central">property data</text>
  <rect class="cell ghost" x="615" y="255" width="104" height="26"/>
  <text class="t" x="667" y="268" text-anchor="middle" dominant-baseline="central">accounting</text>

  <text class="n" x="730" y="308" text-anchor="end">the record of truth sits in the top band; everything else reads from or writes to it</text>
</svg>
