  <text class="nbt" x="37.5" y="112.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">THE CPU BUILDS FRAME N+1 WHILE THE GPU DRAWS FRAME N: THE SLOWER SIDE SETS P1, THE OTHER WAITS W1.</text>
