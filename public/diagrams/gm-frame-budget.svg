  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE SPLIT, NOT A MEASUREMENT: REAL BUDGETS COME FROM PROFILING THE TARGET HARDWARE.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">INPUT THAT LANDS AFTER THE LATCH IS READ ON THE NEXT FRAME, UP TO ONE MORE FRAME OF LATENCY.</text>
  <rect class="nb" x="31" y="86.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="96" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">A SERIAL VIEW OF ONE FRAME'S CRITICAL PATH; THE PIPELINED VIEW SHOWS CPU AND GPU OVERLAPPING.</text>
