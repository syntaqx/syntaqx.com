<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230">
  <defs>
    <marker id="fo-psa-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-psa-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Draft and priced -->
  <rect class="cell" x="40" y="70" width="100" height="26"/>
  <text class="t" x="90" y="83" text-anchor="middle" dominant-baseline="central">draft</text>
  <path class="ln hl" d="M140,83H178" marker-end="url(#fo-psa-ah-hl)"/>
  <rect class="cell" x="180" y="70" width="100" height="26"/>
  <text class="t" x="230" y="83" text-anchor="middle" dominant-baseline="central">priced</text>

  <!-- Inside the band -->
  <path class="ln hl" d="M280,83H398" marker-end="url(#fo-psa-ah-hl)"/>
  <text class="n hl" x="339" y="76" text-anchor="middle">inside band</text>
  <rect class="cell hl" x="400" y="70" width="120" height="26"/>
  <text class="t hl b" x="460" y="83" text-anchor="middle" dominant-baseline="central">presented</text>

  <!-- Any edit re-prices -->
  <path class="ln dash" d="M450,70C450,36 240,36 240,68" marker-end="url(#fo-psa-ah)"/>
  <text class="n" x="345" y="34" text-anchor="middle">any edit re-prices</text>

  <!-- Below the band -->
  <path class="ln" d="M230,96C230,130 275,128 275,158" marker-end="url(#fo-psa-ah)"/>
  <text class="n" x="262" y="128" text-anchor="end">below band</text>
  <rect class="cell band" x="200" y="160" width="150" height="26"/>
  <text class="t b" x="275" y="173" text-anchor="middle" dominant-baseline="central">pending approval</text>
  <path class="ln" d="M350,173H418" marker-end="url(#fo-psa-ah)"/>
  <rect class="cell" x="420" y="160" width="100" height="26"/>
  <text class="t" x="470" y="173" text-anchor="middle" dominant-baseline="central">approved</text>
  <path class="ln" d="M470,160V98" marker-end="url(#fo-psa-ah)"/>

  <!-- Rejected -->
  <path class="ln dash" d="M200,173C90,173 90,130 90,98" marker-end="url(#fo-psa-ah)"/>
  <text class="n" x="96" y="196">rejected</text>

  <!-- Outcomes -->
  <rect class="cell hl end" x="600" y="40" width="120" height="26"/>
  <text class="t hl b" x="660" y="53" text-anchor="middle" dominant-baseline="central">accepted</text>
  <rect class="cell ghost" x="600" y="80" width="120" height="26"/>
  <text class="t dim" x="660" y="93" text-anchor="middle" dominant-baseline="central">declined</text>
  <rect class="cell ghost" x="600" y="120" width="120" height="26"/>
  <text class="t dim" x="660" y="133" text-anchor="middle" dominant-baseline="central">expired</text>
  <path class="ln hl" d="M520,83C560,83 560,53 598,53" marker-end="url(#fo-psa-ah-hl)"/>
  <path class="ln" d="M520,83C560,83 560,93 598,93" marker-end="url(#fo-psa-ah)"/>
  <path class="ln" d="M520,83C560,83 560,133 598,133" marker-end="url(#fo-psa-ah)"/>

  <text class="n" x="720" y="220" text-anchor="end">an approval binds to a hash of the priced estimate; any change voids it</text>
</svg>
