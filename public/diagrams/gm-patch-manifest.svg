<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 846">
  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-PCH-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">chunked release, exploded</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 2</text>

  <text class="vt" x="40" y="64">Exploded axonometric: one release</text>
  <text class="vs" x="40" y="80">Not to scale · League patcher per Riot, July 2019</text>

  <!-- Assembly lines through the stack's outer corners, behind the plates -->
  <path class="phantom" d="M295,244V430M645,201V387"/>

  <!-- 01 install on disk -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 336)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="150" height="60"/>
    <rect class="cell band" x="180" y="100" width="55" height="60"/>
    <rect class="cell band" x="245" y="100" width="35" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="424.65" r="2"/>
  <path class="leader" d="M309.5,424.65L297.5,412.65H270"/>
  <text class="sl ink" x="264" y="412.65" text-anchor="end" dominant-baseline="central">01 install</text>
  <text class="n" x="264" y="428.65" text-anchor="end">game files plus Game.db (SQLite)</text>

  <!-- 02 chunks -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 274)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="25" height="60"/>
    <rect class="cell band" x="50" y="100" width="40" height="60"/>
    <rect class="cell band" x="95" y="100" width="20" height="60"/>
    <rect class="cell band" x="120" y="100" width="35" height="60"/>
    <rect class="cell band" x="160" y="100" width="30" height="60"/>
    <rect class="cell band" x="195" y="100" width="45" height="60"/>
    <rect class="cell band" x="245" y="100" width="35" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="362.65" r="2"/>
  <path class="leader" d="M309.5,362.65L297.5,350.65H270"/>
  <text class="sl ink" x="264" y="350.65" text-anchor="end" dominant-baseline="central">02 chunks</text>
  <text class="n" x="264" y="366.65" text-anchor="end">content-defined, 64-bit ids, zstd 19</text>

  <!-- 03 bundles -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 212)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="57.5" height="60"/>
    <rect class="cell band" x="87.5" y="100" width="57.5" height="60"/>
    <rect class="cell band" x="155" y="100" width="57.5" height="60"/>
    <rect class="cell band" x="222.5" y="100" width="57.5" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="300.65" r="2"/>
  <path class="leader" d="M309.5,300.65L297.5,288.65H270"/>
  <text class="sl ink" x="264" y="288.65" text-anchor="end" dominant-baseline="central">03 bundles</text>
  <text class="n" x="264" y="304.65" text-anchor="end">CDN objects, over 85% reused</text>

  <!-- 04 release manifest -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 150)">
    <rect class="obj hl" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="260" height="25"/>
    <rect class="cell band" x="20" y="135" width="260" height="25"/>
  </g>
  <circle class="dot" cx="309.5" cy="238.65" r="2"/>
  <path class="leader" d="M309.5,238.65L297.5,226.65H270"/>
  <text class="sl ink" x="264" y="226.65" text-anchor="end" dominant-baseline="central">04 release manifest</text>
  <text class="n" x="264" y="242.65" text-anchor="end">signed FlatBuffers, about 8 MB</text>

  <!-- Client steps between layers -->
  <text class="n" x="740" y="228" text-anchor="end">verify, then</text>
  <text class="n" x="740" y="242" text-anchor="end">diff [1]</text>
  <text class="n" x="740" y="290" text-anchor="end">range</text>
  <text class="n" x="740" y="304" text-anchor="end">requests [2]</text>
  <text class="n" x="740" y="352" text-anchor="end">write in</text>
  <text class="n" x="740" y="366" text-anchor="end">place [3]</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="520">Published figures</text>
  <text class="vs" x="40" y="536">Riot tech blog, July 2019 · League game data</text>
  <rect class="cell band" x="40" y="546" width="50" height="22"/>
  <rect class="cell band" x="90" y="546" width="530" height="22"/>
  <rect class="cell band" x="620" y="546" width="100" height="22"/>
  <text class="cap ink" x="50" y="557" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="557" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="557" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,568H720V744H40Z"/>
  <path class="ln ink" d="M90,568V744M620,568V744"/>
  <path class="ln" d="M40,590H720M40,612H720M40,634H720M40,656H720M40,678H720M40,700H720M40,722H720"/>
  <text class="t" x="50" y="579" dominant-baseline="central">C1</text>
  <text class="t" x="100" y="579" dominant-baseline="central">chunks in a release</text>
  <text class="t" x="710" y="579" text-anchor="end" dominant-baseline="central">&gt; 300,000</text>
  <text class="t" x="50" y="601" dominant-baseline="central">B1</text>
  <text class="t" x="100" y="601" dominant-baseline="central">bundles the chunks are grouped into</text>
  <text class="t" x="710" y="601" text-anchor="end" dominant-baseline="central">&lt; 5,000</text>
  <text class="t b" x="50" y="623" dominant-baseline="central">R1</text>
  <text class="t" x="100" y="623" dominant-baseline="central">HTTP requests for a full download: R1 &lt;= B1</text>
  <text class="t b" x="710" y="623" text-anchor="end" dominant-baseline="central">&lt;= 5,000</text>
  <text class="t" x="50" y="645" dominant-baseline="central">S1</text>
  <text class="t" x="100" y="645" dominant-baseline="central">bundles shared with the previous version</text>
  <text class="t" x="710" y="645" text-anchor="end" dominant-baseline="central">&gt; 85%</text>
  <text class="t" x="50" y="667" dominant-baseline="central">D1</text>
  <text class="t" x="100" y="667" dominant-baseline="central">chunks removed by deduplication</text>
  <text class="t" x="710" y="667" text-anchor="end" dominant-baseline="central">about 10%</text>
  <text class="t" x="50" y="689" dominant-baseline="central">A1</text>
  <text class="t" x="100" y="689" dominant-baseline="central">average chunk in the post's example (cut at 16 zero bits)</text>
  <text class="t" x="710" y="689" text-anchor="end" dominant-baseline="central">64 KB</text>
  <text class="t" x="50" y="711" dominant-baseline="central">M1</text>
  <text class="t" x="100" y="711" dominant-baseline="central">release manifest</text>
  <text class="t" x="710" y="711" text-anchor="end" dominant-baseline="central">about 8 MB</text>
  <text class="t" x="50" y="733" dominant-baseline="central">W1</text>
  <text class="t" x="100" y="733" dominant-baseline="central">largest write slice / download bytes in flight</text>
  <text class="t" x="710" y="733" text-anchor="end" dominant-baseline="central">64 / 128 MB</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="762" width="680" height="64"/>
  <text class="sl ink" x="52" y="780">notes</text>
  <text class="n" x="52" y="796">[1] Only a signed manifest loads; its chunk list is compared with Game.db. [2] Multipart range requests, 8 connections.</text>
  <text class="n" x="52" y="812">[3] In place, in slices up to 64 MB on chunk boundaries, with Game.db committed after each slice.</text>
</svg>
