<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292">
  <defs>
    <marker id="tr-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="tr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="tr-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Settlement in -->
  <rect class="cell" x="280" y="20" width="120" height="26"/>
  <text class="t" x="340" y="33" text-anchor="middle" dominant-baseline="central">acquirers</text>
  <path class="ln hl" d="M340,46V116" marker-end="url(#tr-ah-hl)"/>
  <text class="n" x="330" y="76" text-anchor="end">settles daily, net or gross of fees</text>

  <!-- Prefunding: the provider's own money covering a timing gap -->
  <path class="ln dash" d="M600,96C600,58 440,58 440,94" marker-end="url(#tr-ah)"/>
  <text class="n" x="520" y="50" text-anchor="middle">prefund when payouts lead settlement</text>

  <!-- The bank and its accounts -->
  <rect class="frame" x="60" y="96" width="600" height="96"/>
  <rect class="cell band" x="60" y="96" width="600" height="22"/>
  <text class="cap ink" x="72" y="107" dominant-baseline="central">sponsor bank: one bank, separate accounts</text>

  <rect class="cell" x="60" y="118" width="200" height="74"/>
  <text class="t b" x="160" y="138" text-anchor="middle" dominant-baseline="central">reserve</text>
  <text class="n" x="160" y="160" text-anchor="middle">held against disputes,</text>
  <text class="n" x="160" y="175" text-anchor="middle">refunds and losses</text>

  <rect class="cell hl" x="260" y="118" width="200" height="74"/>
  <text class="t hl b" x="360" y="138" text-anchor="middle" dominant-baseline="central">fbo / custodial</text>
  <text class="n ink" x="360" y="160" text-anchor="middle">merchants' money, titled</text>
  <text class="n ink" x="360" y="175" text-anchor="middle">for their benefit</text>

  <rect class="cell" x="460" y="118" width="200" height="74"/>
  <text class="t b" x="560" y="138" text-anchor="middle" dominant-baseline="central">operating</text>
  <text class="n" x="560" y="160" text-anchor="middle">your money: fees earned,</text>
  <text class="n" x="560" y="175" text-anchor="middle">payroll, every expense</text>

  <!-- Moves out of the custodial account -->
  <path class="ln ink" d="M300,192C300,226 160,226 160,194" marker-end="url(#tr-ah-ink)"/>
  <text class="n" x="230" y="236" text-anchor="middle">held back</text>
  <path class="ln ink" d="M420,192C420,226 560,226 560,194" marker-end="url(#tr-ah-ink)"/>
  <text class="n" x="490" y="236" text-anchor="middle">only fees earned, swept</text>

  <!-- Payouts out -->
  <path class="ln hl" d="M360,192V244" marker-end="url(#tr-ah-hl)"/>
  <rect class="cell" x="290" y="246" width="140" height="26"/>
  <text class="t" x="360" y="259" text-anchor="middle" dominant-baseline="central">merchants' banks</text>
  <text class="n hl" x="440" y="259" dominant-baseline="central">payouts</text>
</svg>
