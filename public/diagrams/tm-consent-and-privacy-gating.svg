<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 852">
  <defs>
    <marker id="tm-cp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="tm-cp-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="tm-cp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">TM-CNS-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">consent gating and lifetimes</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view 1: first page view -->
  <text class="vt" x="40" y="64">Plan view: first page view</text>
  <text class="vs" x="40" y="80">Scale 1 s = 60 px · timeline · values in s</text>

  <!-- W1: wait for the choice -->
  <path class="ext" d="M160,125V95M520,125V95"/>
  <path class="dim hl" d="M160,100H520" marker-start="url(#tm-cp-ah-hl)" marker-end="url(#tm-cp-ah-hl)"/>
  <text class="dt hl" x="340" y="96" text-anchor="middle">W1 = 6.00 [1]</text>

  <!-- Lanes -->
  <text class="sl ink" x="148" y="144" text-anchor="end" dominant-baseline="central">banner</text>
  <rect class="obj fill-2" x="184" y="128" width="336" height="32"/>
  <text class="sl ink" x="352" y="144" text-anchor="middle" dominant-baseline="central">consent banner</text>

  <text class="sl ink" x="148" y="194" text-anchor="end" dominant-baseline="central">necessary</text>
  <rect class="obj fill-2" x="160" y="178" width="480" height="32"/>
  <text class="sl ink" x="400" y="194" text-anchor="middle" dominant-baseline="central">session, cart</text>

  <text class="sl ink" x="148" y="244" text-anchor="end" dominant-baseline="central">analytics</text>
  <rect class="hatch" x="160" y="228" width="360" height="32" fill="url(#tm-cp-hatch)"/>
  <rect class="obj fill-1" x="520" y="228" width="120" height="32"/>
  <text class="sl ink" x="580" y="244" text-anchor="middle" dominant-baseline="central">running</text>

  <text class="sl ink" x="148" y="294" text-anchor="end" dominant-baseline="central">advertising</text>
  <rect class="hatch" x="160" y="278" width="480" height="32" fill="url(#tm-cp-hatch)"/>
  <text class="t" x="648" y="294" dominant-baseline="central">[2]</text>

  <!-- Time axis -->
  <path class="ln ink" d="M160,330H640M160,326V334M220,326V334M280,326V334M340,326V334M400,326V334M460,326V334M520,326V334M580,326V334M640,326V334"/>
  <text class="t" x="160" y="344" text-anchor="middle" dominant-baseline="central">0</text>
  <text class="t" x="220" y="344" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="t" x="280" y="344" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="t" x="340" y="344" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="t" x="400" y="344" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="t" x="460" y="344" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="t" x="520" y="344" text-anchor="middle" dominant-baseline="central">6</text>
  <text class="t" x="580" y="344" text-anchor="middle" dominant-baseline="central">7</text>
  <text class="t" x="640" y="344" text-anchor="middle" dominant-baseline="central">8</text>

  <!-- Plan view 2: lifetimes -->
  <text class="vt" x="40" y="390">Plan view: lifetimes</text>
  <text class="vs" x="40" y="406">Scale 1 month = 36 px · timeline · values in months</text>

  <text class="sl ink" x="148" y="446" text-anchor="end" dominant-baseline="central">identifier</text>
  <rect class="obj fill-2" x="160" y="430" width="468" height="32"/>
  <text class="sl ink" x="394" y="446" text-anchor="middle" dominant-baseline="central">analytics identifier</text>
  <path class="ext" d="M160,465V491M628,465V491"/>
  <path class="dim" d="M160,486H628" marker-start="url(#tm-cp-ah)" marker-end="url(#tm-cp-ah)"/>
  <text class="dt" x="394" y="482" text-anchor="middle">M1 = 13.00 [3]</text>

  <text class="sl ink" x="148" y="526" text-anchor="end" dominant-baseline="central">re-ask</text>
  <rect class="obj fill-2" x="160" y="510" width="216" height="32"/>
  <text class="sl ink" x="268" y="526" text-anchor="middle" dominant-baseline="central">declined</text>
  <path class="ext" d="M160,545V571M376,545V571"/>
  <path class="dim" d="M160,566H376" marker-start="url(#tm-cp-ah)" marker-end="url(#tm-cp-ah)"/>
  <text class="dt" x="268" y="562" text-anchor="middle">M2 = 6.00 [4]</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="610">Variables</text>
  <text class="vs" x="40" y="626">W1 illustrative · M1 and M2 sourced</text>
  <rect class="cell band" x="40" y="636" width="50" height="22"/>
  <rect class="cell band" x="90" y="636" width="530" height="22"/>
  <rect class="cell band" x="620" y="636" width="100" height="22"/>
  <text class="cap ink" x="50" y="647" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="647" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="647" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,658H720V724H40Z"/>
  <path class="ln ink" d="M90,658V724M620,658V724"/>
  <path class="ln" d="M40,680H720M40,702H720"/>
  <text class="t b" x="50" y="669" dominant-baseline="central">W1</text>
  <text class="t" x="100" y="669" dominant-baseline="central">wait for a choice, s: nothing non-exempt runs</text>
  <text class="t b" x="710" y="669" text-anchor="end" dominant-baseline="central">6.00</text>
  <text class="t" x="50" y="691" dominant-baseline="central">M1</text>
  <text class="t" x="100" y="691" dominant-baseline="central">max lifetime of an exempt analytics tracker, months</text>
  <text class="t" x="710" y="691" text-anchor="end" dominant-baseline="central">13.00</text>
  <text class="t" x="50" y="713" dominant-baseline="central">M2</text>
  <text class="t" x="100" y="713" dominant-baseline="central">wait before asking a refuser again, months</text>
  <text class="t" x="710" y="713" text-anchor="end" dominant-baseline="central">6.00</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="742" width="680" height="90"/>
  <text class="sl ink" x="52" y="760">notes</text>
  <text class="n" x="52" y="778">[1] Illustrative wait. Where consent is required, nothing non-exempt is stored or read before the choice (ICO).</text>
  <text class="n" x="52" y="794">[2] Refused in the banner; a Sec-GPC: 1 header also opts the device out of sale and sharing in California.</text>
  <text class="n" x="52" y="810">[3] CNIL: audience measurement trackers exempt from consent live at most 13 months.</text>
  <text class="n" x="52" y="826">[4] ICO: as a general guideline, about six months before asking someone who declined again.</text>
</svg>
