<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <defs>
    <marker id="fo-atc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-atc-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-atc-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- The command -->
  <text class="cap" x="40" y="54">a write</text>
  <rect class="cell band" x="40" y="62" width="150" height="26"/>
  <text class="t b" x="115" y="75" text-anchor="middle" dominant-baseline="central">command: who, why</text>
  <path class="ln hl" d="M190,75H218" marker-end="url(#fo-atc-ah-hl)"/>

  <!-- One transaction -->
  <rect class="zone" x="220" y="30" width="210" height="130"/>
  <text class="cap hl" x="230" y="46">one transaction</text>
  <rect class="cell" x="230" y="56" width="190" height="26"/>
  <text class="t" x="240" y="69" dominant-baseline="central">state change</text>
  <rect class="cell" x="230" y="90" width="190" height="26"/>
  <text class="t" x="240" y="103" dominant-baseline="central">audit entry: who, why</text>
  <rect class="cell" x="230" y="124" width="190" height="26"/>
  <text class="t" x="240" y="137" dominant-baseline="central">row capture, before/after</text>

  <!-- Into the audit store -->
  <path class="ln hl" d="M420,103H468" marker-end="url(#fo-atc-ah-hl)"/>
  <path class="ln hl" d="M420,137C446,137 446,116 468,116" marker-end="url(#fo-atc-ah-hl)"/>
  <rect class="cell hl" x="470" y="90" width="220" height="44"/>
  <text class="t hl b" x="580" y="105" text-anchor="middle" dominant-baseline="central">append-only audit store</text>
  <text class="n hl" x="580" y="122" text-anchor="middle" dominant-baseline="central">hash-chained per tenant, day</text>

  <!-- Reads and access -->
  <text class="cap" x="40" y="186">reads</text>
  <rect class="cell" x="40" y="194" width="150" height="26"/>
  <text class="t" x="115" y="207" text-anchor="middle" dominant-baseline="central">exports, views, logins</text>
  <path class="ln ink" d="M190,207H440C456,207 456,128 468,128" marker-end="url(#fo-atc-ah-ink)"/>
  <text class="n" x="200" y="226">access is logged into the same store</text>

  <!-- Archive and export -->
  <path class="ln hl" d="M580,134V174" marker-end="url(#fo-atc-ah-hl)"/>
  <rect class="cell band" x="470" y="176" width="220" height="26"/>
  <text class="t b" x="580" y="189" text-anchor="middle" dominant-baseline="central">WORM archive</text>
  <text class="n" x="590" y="226">retention by type, holds</text>
  <path class="ln" d="M580,202V246" marker-end="url(#fo-atc-ah)"/>
  <rect class="cell" x="470" y="248" width="220" height="26"/>
  <text class="t" x="580" y="261" text-anchor="middle" dominant-baseline="central">export with hash manifest</text>
</svg>
