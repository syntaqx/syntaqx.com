<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 832">
  <defs>
    <marker id="pb-slo-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="pb-slo-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="pb-slo-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">PB-OPS-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">error budget, 99.9% over 30 days</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: the window -->
  <text class="vt" x="40" y="64">Plan view: one 30-day SLO window</text>
  <text class="vs" x="40" y="80">Scale 1 day = 20 px · timeline · days</text>
  <path class="ext" d="M100,125V95M700,125V95"/>
  <path class="dim" d="M100,100H700" marker-start="url(#pb-slo-ah)" marker-end="url(#pb-slo-ah)"/>
  <text class="dt" x="400" y="96" text-anchor="middle">N1 = 30 d = 720 h = 43,200 min</text>
  <rect class="obj fill-2" x="100" y="128" width="599.4" height="32"/>
  <rect class="hatch" x="699.4" y="128" width="0.6" height="32" fill="url(#pb-slo-hatch)"/>
  <text class="sl ink" x="400" y="144" text-anchor="middle" dominant-baseline="central">SLO S1 = 99.9% good [1]</text>
  <circle class="detail" cx="700" cy="144" r="16"/>
  <text class="sl ink" x="684" y="118" text-anchor="end" dominant-baseline="central">detail A</text>
  <path class="ln" d="M100,160V166M200,160V166M300,160V166M400,160V166M500,160V166M600,160V166M700,160V166"/>
  <text class="t" x="100" y="178" text-anchor="middle" dominant-baseline="central">0</text>
  <text class="t" x="200" y="178" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="t" x="300" y="178" text-anchor="middle" dominant-baseline="central">10</text>
  <text class="t" x="400" y="178" text-anchor="middle" dominant-baseline="central">15</text>
  <text class="t" x="500" y="178" text-anchor="middle" dominant-baseline="central">20</text>
  <text class="t" x="600" y="178" text-anchor="middle" dominant-baseline="central">25</text>
  <text class="t" x="700" y="178" text-anchor="middle" dominant-baseline="central">30</text>

  <!-- Detail A: the budget itself -->
  <text class="vt" x="40" y="216">Detail A: the error budget</text>
  <text class="vs" x="40" y="232">Scale 720:1 · 1 min = 10 px</text>
  <path class="ext" d="M100,265V247M532,265V247"/>
  <path class="dim hl" d="M100,252H532" marker-start="url(#pb-slo-ah-hl)" marker-end="url(#pb-slo-ah-hl)"/>
  <text class="dt hl" x="316" y="248" text-anchor="middle">B1 = (1 - S1) × N1 = 0.001 × 43,200 = 43.2 min</text>
  <rect class="hatch" x="100" y="268" width="432" height="32" fill="url(#pb-slo-hatch)"/>
  <text class="sl ink" x="548" y="280" dominant-baseline="central">error budget</text>
  <text class="n" x="548" y="296">any mix of failures [2]</text>

  <!-- Plan view: burn rate to exhaustion -->
  <text class="vt" x="40" y="340">Plan view: burn rate to exhaustion</text>
  <text class="vs" x="40" y="356">Scale 1 day = 20 px · timeline · SRE Workbook rates [3]</text>
  <text class="sl ink" x="100" y="378" dominant-baseline="central">1 page, fast burn</text>
  <rect class="obj fill-1" x="100" y="386" width="41.67" height="24"/>
  <text class="dt" x="152" y="398" dominant-baseline="central">E1 = N1 / 14.4 = 720 / 14.4 = 50 h</text>
  <text class="sl ink" x="100" y="430" dominant-baseline="central">2 page, slow burn</text>
  <rect class="obj fill-1" x="100" y="438" width="100" height="24"/>
  <text class="dt" x="210" y="450" dominant-baseline="central">E2 = N1 / 6 = 720 / 6 = 120 h</text>
  <text class="sl ink" x="100" y="482" dominant-baseline="central">3 ticket</text>
  <rect class="obj fill-1" x="160" y="490" width="540" height="24"/>
  <rect class="hatch" x="100" y="490" width="60" height="24" fill="url(#pb-slo-hatch)"/>
  <circle class="dot" cx="130" cy="508" r="2"/>
  <path class="leader" d="M130,508L142,528H160"/>
  <text class="sl ink" x="164" y="528" dominant-baseline="central">long window L3 = 72 h [4]</text>
  <path class="ext" d="M100,517V553M700,517V553"/>
  <path class="dim" d="M100,548H700" marker-start="url(#pb-slo-ah)" marker-end="url(#pb-slo-ah)"/>
  <text class="dt" x="560" y="544" text-anchor="middle">E3 = N1 / 1 = 720 h</text>

  <!-- Alert table -->
  <text class="vt" x="40" y="590">Burn-rate alerts</text>
  <text class="vs" x="40" y="606">SRE Workbook, 99.9% over 30 days [3] · C = R × L / N1</text>
  <rect class="cell band" x="40" y="616" width="110" height="22"/>
  <rect class="cell band" x="150" y="616" width="90" height="22"/>
  <rect class="cell band" x="240" y="616" width="80" height="22"/>
  <rect class="cell band" x="320" y="616" width="80" height="22"/>
  <rect class="cell band" x="400" y="616" width="170" height="22"/>
  <rect class="cell band" x="570" y="616" width="150" height="22"/>
  <text class="cap ink" x="50" y="627" dominant-baseline="central">alert</text>
  <text class="cap ink" x="160" y="627" dominant-baseline="central">long L</text>
  <text class="cap ink" x="250" y="627" dominant-baseline="central">short</text>
  <text class="cap ink" x="330" y="627" dominant-baseline="central">burn R</text>
  <text class="cap ink" x="410" y="627" dominant-baseline="central">consumed C</text>
  <text class="cap ink" x="580" y="627" dominant-baseline="central">exhausted E</text>
  <path class="cell" d="M40,638H720V704H40Z"/>
  <path class="ln ink" d="M150,638V704M240,638V704M320,638V704M400,638V704M570,638V704"/>
  <path class="ln" d="M40,660H720M40,682H720"/>
  <text class="t b" x="50" y="649" dominant-baseline="central">1 page</text>
  <text class="t" x="160" y="649" dominant-baseline="central">1 h</text>
  <text class="t" x="250" y="649" dominant-baseline="central">5 min</text>
  <text class="t" x="330" y="649" dominant-baseline="central">14.4</text>
  <text class="t" x="410" y="649" dominant-baseline="central">14.4 × 1 / 720 = 2%</text>
  <text class="t" x="580" y="649" dominant-baseline="central">720 / 14.4 = 50 h</text>
  <text class="t b" x="50" y="671" dominant-baseline="central">2 page</text>
  <text class="t" x="160" y="671" dominant-baseline="central">6 h</text>
  <text class="t" x="250" y="671" dominant-baseline="central">30 min</text>
  <text class="t" x="330" y="671" dominant-baseline="central">6</text>
  <text class="t" x="410" y="671" dominant-baseline="central">6 × 6 / 720 = 5%</text>
  <text class="t" x="580" y="671" dominant-baseline="central">720 / 6 = 120 h</text>
  <text class="t b" x="50" y="693" dominant-baseline="central">3 ticket</text>
  <text class="t" x="160" y="693" dominant-baseline="central">3 d = 72 h</text>
  <text class="t" x="250" y="693" dominant-baseline="central">6 h</text>
  <text class="t" x="330" y="693" dominant-baseline="central">1</text>
  <text class="t" x="410" y="693" dominant-baseline="central">1 × 72 / 720 = 10%</text>
  <text class="t" x="580" y="693" dominant-baseline="central">720 / 1 = 720 h</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="720" width="680" height="92"/>
  <text class="sl ink" x="52" y="738">notes</text>
  <text class="n" x="52" y="756">[1] S1 is the target for the SLI, good events over valid events, across a rolling 30 days.</text>
  <text class="n" x="52" y="772">[2] 43.2 minutes of full outage, or a partial one: 1% errors for 72 hours spends the same budget.</text>
  <text class="n" x="52" y="788">[3] Burn rate R is the error rate over the rate the SLO allows; at R the budget is gone after E = N1 / R.</text>
  <text class="n" x="52" y="804">[4] An alert fires when both its long window L and its short window, L / 12, burn faster than R.</text>
</svg>
