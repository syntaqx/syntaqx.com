<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 724">
  <defs>
    <marker id="gm-lb-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-lb-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-LBX-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">drop table and odds sheet</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <!-- Plan view: the whole table -->
  <text class="vt" x="40" y="64">Plan view: one drop table</text>
  <text class="vs" x="40" y="80">Scale 1% = 5.4 px · illustrative [1] · values in %</text>

  <!-- P0: the whole table -->
  <path class="ext" d="M120,125V95M660,125V95"/>
  <path class="dim hl" d="M120,100H660" marker-start="url(#gm-lb-ah-hl)" marker-end="url(#gm-lb-ah-hl)"/>
  <text class="dt hl" x="390" y="96" text-anchor="middle">P0 = P1 + P2 + P3 + P4 = 100.00</text>

  <!-- The table, by rarity -->
  <rect class="obj fill-1" x="120" y="128" width="5.4" height="40"/>
  <rect class="obj fill-2" x="125.4" y="128" width="48.6" height="40"/>
  <rect class="obj fill-2" x="174" y="128" width="162" height="40"/>
  <rect class="obj fill-2" x="336" y="128" width="324" height="40"/>
  <text class="t" x="157" y="148" text-anchor="middle" dominant-baseline="central">epic</text>
  <text class="sl ink" x="255" y="148" text-anchor="middle" dominant-baseline="central">rare</text>
  <text class="sl ink" x="498" y="148" text-anchor="middle" dominant-baseline="central">common</text>

  <!-- Detail circle on P1 -->
  <circle class="detail" cx="122.7" cy="148" r="18"/>
  <text class="sl ink" x="102" y="120" text-anchor="end" dominant-baseline="central">detail A</text>

  <!-- Chain, tier 1: P3, P4 -->
  <path class="ext" d="M336,171V197M660,171V197"/>
  <path class="ext" d="M120,171V219M125.4,171V219M174,171V219"/>
  <path class="dim" d="M174,192H336" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="255" y="188" text-anchor="middle">P3 = 30.00</text>
  <path class="dim" d="M336,192H660" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="498" y="188" text-anchor="middle">P4 = 60.00</text>

  <!-- Chain, tier 2: P1 outside left, P2 with text outside right -->
  <path class="dim" d="M100,214H120" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="96" y="214" text-anchor="end" dominant-baseline="central">P1 = 1.00</text>
  <path class="dim" d="M120,214H125.4"/>
  <path class="dim" d="M125.4,214H174" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="180" y="214" dominant-baseline="central">P2 = 9.00</text>
  <text class="t" x="390" y="246" text-anchor="middle">P0 = 1.00 + 9.00 + 30.00 + 60.00 = 100.00</text>

  <!-- Detail A: the legendary band -->
  <text class="vt" x="40" y="290">Detail A: legendary, P1</text>
  <text class="vs" x="40" y="306">Scale 74:1 · 1% = 400 px</text>
  <rect class="obj fill-1" x="60" y="320" width="100" height="40"/>
  <rect class="obj fill-1" x="160" y="320" width="100" height="40"/>
  <rect class="obj fill-1" x="260" y="320" width="100" height="40"/>
  <rect class="obj fill-1" x="360" y="320" width="100" height="40"/>
  <text class="sl ink" x="110" y="340" text-anchor="middle" dominant-baseline="central">item a</text>
  <text class="sl ink" x="210" y="340" text-anchor="middle" dominant-baseline="central">item b</text>
  <text class="sl ink" x="310" y="340" text-anchor="middle" dominant-baseline="central">item c</text>
  <text class="sl ink" x="410" y="340" text-anchor="middle" dominant-baseline="central">item d</text>
  <path class="ext" d="M60,363V393M160,363V393M260,363V393M360,363V393M460,363V393"/>
  <path class="dim" d="M60,388H160" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="110" y="384" text-anchor="middle">L1 = 0.25</text>
  <path class="dim" d="M160,388H260" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="210" y="384" text-anchor="middle">L2 = 0.25</text>
  <path class="dim" d="M260,388H360" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="310" y="384" text-anchor="middle">L3 = 0.25</text>
  <path class="dim" d="M360,388H460" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="410" y="384" text-anchor="middle">L4 = 0.25</text>
  <text class="t" x="260" y="418" text-anchor="middle">P1 = L1 + L2 + L3 + L4 = 4 x 0.25 = 1.00</text>

  <!-- Detail B: pity -->
  <text class="vt" x="40" y="456">Detail B: hard pity</text>
  <text class="vs" x="40" y="472">Scale 1 pull = 8 px · illustrative [2]</text>
  <rect class="obj fill-2" x="60" y="486" width="400" height="20"/>
  <path class="ctr" d="M376,480V512"/>
  <rect class="obj fill-1" x="452" y="486" width="8" height="20"/>
  <path class="ext" d="M60,509V561M376,515V535M460,509V561"/>
  <path class="dim" d="M60,530H376" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="218" y="526" text-anchor="middle">E1 = 39.50</text>
  <path class="dim" d="M60,556H460" marker-start="url(#gm-lb-ah)" marker-end="url(#gm-lb-ah)"/>
  <text class="dt" x="260" y="552" text-anchor="middle">N1 = 50</text>
  <text class="t" x="60" y="584">E1 = (1 - (1 - B1)^N1) / B1 = (1 - 0.99^50) / 0.01 = 39.50</text>
  <text class="t" x="60" y="602">R1 = 1 / E1 = 1 / 39.50 = 2.53%</text>

  <!-- Variable table -->
  <text class="vt" x="490" y="290">Variables</text>
  <text class="vs" x="490" y="306">Illustrative [1] · %</text>
  <rect class="cell band" x="490" y="316" width="46" height="22"/>
  <rect class="cell band" x="536" y="316" width="124" height="22"/>
  <rect class="cell band" x="660" y="316" width="60" height="22"/>
  <text class="cap ink" x="496" y="327" dominant-baseline="central">code</text>
  <text class="cap ink" x="544" y="327" dominant-baseline="central">item</text>
  <text class="cap ink" x="714" y="327" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M490,338H720V558H490Z"/>
  <path class="ln ink" d="M536,338V558M660,338V558"/>
  <path class="ln" d="M490,360H720M490,382H720M490,404H720M490,426H720M490,448H720M490,470H720M490,492H720M490,514H720M490,536H720"/>
  <text class="t b" x="498" y="349" dominant-baseline="central">P0</text>
  <text class="t" x="544" y="349" dominant-baseline="central">whole table</text>
  <text class="t b" x="714" y="349" text-anchor="end" dominant-baseline="central">100.00</text>
  <text class="t" x="498" y="371" dominant-baseline="central">P1</text>
  <text class="t" x="544" y="371" dominant-baseline="central">legendary</text>
  <text class="t" x="714" y="371" text-anchor="end" dominant-baseline="central">1.00</text>
  <text class="t" x="498" y="393" dominant-baseline="central">P2</text>
  <text class="t" x="544" y="393" dominant-baseline="central">epic</text>
  <text class="t" x="714" y="393" text-anchor="end" dominant-baseline="central">9.00</text>
  <text class="t" x="498" y="415" dominant-baseline="central">P3</text>
  <text class="t" x="544" y="415" dominant-baseline="central">rare</text>
  <text class="t" x="714" y="415" text-anchor="end" dominant-baseline="central">30.00</text>
  <text class="t" x="498" y="437" dominant-baseline="central">P4</text>
  <text class="t" x="544" y="437" dominant-baseline="central">common</text>
  <text class="t" x="714" y="437" text-anchor="end" dominant-baseline="central">60.00</text>
  <text class="t" x="498" y="459" dominant-baseline="central">L1</text>
  <text class="t" x="544" y="459" dominant-baseline="central">each legendary</text>
  <text class="t" x="714" y="459" text-anchor="end" dominant-baseline="central">0.25</text>
  <text class="t" x="498" y="481" dominant-baseline="central">B1</text>
  <text class="t" x="544" y="481" dominant-baseline="central">base rate, P1</text>
  <text class="t" x="714" y="481" text-anchor="end" dominant-baseline="central">1.00</text>
  <text class="t" x="498" y="503" dominant-baseline="central">N1</text>
  <text class="t" x="544" y="503" dominant-baseline="central">pity, pulls</text>
  <text class="t" x="714" y="503" text-anchor="end" dominant-baseline="central">50</text>
  <text class="t" x="498" y="525" dominant-baseline="central">E1</text>
  <text class="t" x="544" y="525" dominant-baseline="central">expected pulls</text>
  <text class="t" x="714" y="525" text-anchor="end" dominant-baseline="central">39.50</text>
  <text class="t" x="498" y="547" dominant-baseline="central">R1</text>
  <text class="t" x="544" y="547" dominant-baseline="central">effective rate</text>
  <text class="t" x="714" y="547" text-anchor="end" dominant-baseline="central">2.53</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="626" width="680" height="76"/>
  <text class="sl ink" x="52" y="644">notes</text>
  <text class="n" x="52" y="662">[1] Illustrative values, not any real game's. Every level closes: rarities to P0, items to their rarity.</text>
  <text class="n" x="52" y="678">[2] A legendary is guaranteed on pull N1 if none came sooner. Disclose B1 and N1; R1 is the consolidated rate.</text>
  <text class="n" x="52" y="694">[3] Odds are stored as integer weights; disclosed percentages come from the same rows the server rolls.</text>
</svg>
