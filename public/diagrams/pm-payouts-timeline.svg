  <rect class="nb" x="32" y="100.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="108.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">A PAYOUT CAN STILL COME BACK AS AN ACH RETURN AFTER IT SHOWS PAID; THE AMOUNT RETURNS TO THE BALANCE.</text>
