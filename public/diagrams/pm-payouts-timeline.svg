  <text class="nt" x="50" y="126">DISPUTES KEEP ARRIVING AFTER THE MONEY HAS LEFT, WHICH IS WHAT RESERVES ARE FOR.</text>
  <text class="nt" x="50" y="143">VALUES IN BUSINESS DAYS UNLESS NOTED. NOT TO SCALE AFTER THE BREAK. CODES ON THE DRAWING; VALUES IN THE TABLE.</text>
