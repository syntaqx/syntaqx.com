  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE: SETTLEMENT ON T+1 AND A NEXT-DAY ACH PAYOUT ARE ONE COMMON SCHEDULE; BANKS AND PROVIDERS VARY.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
