  <text class="nbt" x="37.5" y="139" text-anchor="middle">4</text>
  <text class="nt" x="50" y="139">DISPUTES KEEP ARRIVING AFTER THE MONEY HAS LEFT, WHICH IS WHAT RESERVES ARE FOR.</text>
  <text class="nt" x="50" y="156">VALUES IN BUSINESS DAYS UNLESS NOTED. NOT TO SCALE AFTER THE BREAK. CODES ON THE DRAWING; VALUES IN</text>
