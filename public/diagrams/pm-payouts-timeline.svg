  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">A PROCESSOR'S PUBLISHED STANDARD TIMING FOR US ACCOUNTS. A NEW ACCOUNT'S FIRST PAYOUT WAITS 7 TO 14</text>
  <text class="nt" x="50" y="105">DAYS INSTEAD.</text>
  <rect class="nb" x="31" y="112.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="122" text-anchor="middle">3</text>
  <text class="nt" x="50" y="122">A PAYOUT CAN STILL COME BACK AS AN ACH RETURN AFTER IT SHOWS PAID; THE AMOUNT RETURNS TO THE BALANCE.</text>
