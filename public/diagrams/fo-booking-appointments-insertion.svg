<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <defs>
    <marker id="fo-bam-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-bam-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-bam-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Left: Tuesday 10-12, inserted between two stops already nearby -->
  <rect class="zone" x="40" y="44" width="320" height="196"/>
  <text class="cap hl" x="50" y="60">tuesday 10-12: bob is nearby</text>
  <rect class="cell" x="80" y="130" width="70" height="24"/>
  <text class="t" x="115" y="142" text-anchor="middle" dominant-baseline="central">prev stop</text>
  <rect class="cell" x="250" y="130" width="70" height="24"/>
  <text class="t" x="285" y="142" text-anchor="middle" dominant-baseline="central">next stop</text>
  <rect class="cell hl" x="175" y="190" width="50" height="24"/>
  <text class="t hl b" x="200" y="202" text-anchor="middle" dominant-baseline="central">new</text>
  <path class="ln dash" d="M152,142H248" marker-end="url(#fo-bam-ah)"/>
  <text class="n" x="200" y="122" text-anchor="middle">6 min, 2.5 mi (replaced)</text>
  <path class="ln hl" d="M140,154L182,188" marker-end="url(#fo-bam-ah-hl)"/>
  <text class="n hl" x="156" y="186" text-anchor="end">4 min, 1.5 mi</text>
  <path class="ln hl" d="M218,188L262,156" marker-end="url(#fo-bam-ah-hl)"/>
  <text class="n hl" x="244" y="186">5 min, 2.0 mi</text>

  <text class="cap" x="50" y="262">added</text>
  <text class="t" x="110" y="262">3 min, 1.0 mi</text>
  <text class="cap" x="50" y="278">cost</text>
  <text class="t hl b" x="110" y="278">$2.25 + $0.76 = $3.01</text>
  <text class="cap" x="50" y="294">day</text>
  <text class="t" x="110" y="294">+63 min, 60 of them on site</text>

  <!-- Right: Thursday 8-10, the first stop of a route on the far side of town -->
  <rect class="zone" x="400" y="44" width="320" height="196"/>
  <text class="cap" x="410" y="60">thursday 8-10: across town</text>
  <rect class="cell end" x="600" y="88" width="60" height="24"/>
  <text class="t b" x="630" y="100" text-anchor="middle" dominant-baseline="central">home</text>
  <rect class="cell" x="590" y="190" width="80" height="24"/>
  <text class="t" x="630" y="202" text-anchor="middle" dominant-baseline="central">first stop</text>
  <rect class="cell" x="430" y="140" width="50" height="24"/>
  <text class="t b" x="455" y="152" text-anchor="middle" dominant-baseline="central">new</text>
  <path class="ln dash" d="M630,112V188" marker-end="url(#fo-bam-ah)"/>
  <text class="n" x="636" y="154">12 min, 7 mi</text>
  <text class="n" x="636" y="168">(replaced)</text>
  <path class="ln ink" d="M598,104L482,146" marker-end="url(#fo-bam-ah-ink)"/>
  <text class="n ink" x="530" y="100" text-anchor="middle">36 min, 23 mi</text>
  <path class="ln ink" d="M482,160L588,198" marker-end="url(#fo-bam-ah-ink)"/>
  <text class="n ink" x="512" y="210" text-anchor="middle">36 min, 23 mi</text>

  <text class="cap" x="410" y="262">added</text>
  <text class="t" x="470" y="262">60 min, 39 mi</text>
  <text class="cap" x="410" y="278">cost</text>
  <text class="t b" x="470" y="278">$45.00 + $29.64 = $74.64</text>
  <text class="cap" x="410" y="294">day</text>
  <text class="t" x="470" y="294">7.0 h to 9.0 h, 1 h overtime</text>

  <text class="n" x="40" y="320">illustrative: added = prev to new + new to next - prev to next; $0.75/min labor, $0.76/mi</text>
</svg>
