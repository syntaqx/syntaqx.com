<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <defs>
    <marker id="fo-cpg-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-cpg-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-cpg-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Column heads -->
  <text class="cap" x="40" y="22">what it checks</text>
  <text class="cap" x="220" y="22">the gate</text>
  <text class="cap" x="460" y="22">if it fails</text>

  <!-- Request -->
  <rect class="cell band" x="220" y="34" width="200" height="26"/>
  <text class="t b" x="320" y="47" text-anchor="middle" dominant-baseline="central">call, text, email, AI call</text>
  <path class="ln hl" d="M320,60V78" marker-end="url(#fo-cpg-ah-hl)"/>

  <!-- Checks -->
  <text class="n" x="40" y="93" dominant-baseline="central">channel and purpose</text>
  <rect class="cell" x="220" y="80" width="200" height="26"/>
  <text class="t" x="320" y="93" text-anchor="middle" dominant-baseline="central">consent on file?</text>
  <path class="ln hl" d="M320,106V124" marker-end="url(#fo-cpg-ah-hl)"/>

  <text class="n" x="40" y="139" dominant-baseline="central">internal and national DNC</text>
  <rect class="cell" x="220" y="126" width="200" height="26"/>
  <text class="t" x="320" y="139" text-anchor="middle" dominant-baseline="central">not revoked or listed?</text>
  <path class="ln hl" d="M320,152V170" marker-end="url(#fo-cpg-ah-hl)"/>

  <text class="n" x="40" y="185" dominant-baseline="central">recipient's local time</text>
  <rect class="cell" x="220" y="172" width="200" height="26"/>
  <text class="t" x="320" y="185" text-anchor="middle" dominant-baseline="central">inside calling window?</text>
  <path class="ln hl" d="M320,198V216" marker-end="url(#fo-cpg-ah-hl)"/>

  <text class="n" x="40" y="231" dominant-baseline="central">per 24 hours, per week</text>
  <rect class="cell" x="220" y="218" width="200" height="26"/>
  <text class="t" x="320" y="231" text-anchor="middle" dominant-baseline="central">under frequency cap?</text>
  <path class="ln hl" d="M320,244V262" marker-end="url(#fo-cpg-ah-hl)"/>

  <text class="n" x="40" y="277" dominant-baseline="central">AI voice, recording</text>
  <rect class="cell" x="220" y="264" width="200" height="26"/>
  <text class="t" x="320" y="277" text-anchor="middle" dominant-baseline="central">disclosure in place?</text>
  <path class="ln hl" d="M320,290V320" marker-end="url(#fo-cpg-ah-hl)"/>

  <!-- Send -->
  <rect class="cell hl" x="220" y="322" width="200" height="28"/>
  <text class="t hl b" x="320" y="336" text-anchor="middle" dominant-baseline="central">send</text>

  <!-- Failure outcomes -->
  <path class="ln dash" d="M420,93H458" marker-end="url(#fo-cpg-ah)"/>
  <rect class="cell ghost end" x="460" y="80" width="180" height="26"/>
  <text class="t dim" x="470" y="93" dominant-baseline="central">block: no consent</text>

  <path class="ln dash" d="M420,139H458" marker-end="url(#fo-cpg-ah)"/>
  <rect class="cell ghost end" x="460" y="126" width="180" height="26"/>
  <text class="t dim" x="470" y="139" dominant-baseline="central">block: opted out</text>

  <path class="ln dash" d="M420,185H458" marker-end="url(#fo-cpg-ah)"/>
  <rect class="cell ghost" x="460" y="172" width="180" height="26"/>
  <text class="t" x="470" y="185" dominant-baseline="central">defer to window open</text>

  <path class="ln dash" d="M420,231H458" marker-end="url(#fo-cpg-ah)"/>
  <rect class="cell ghost" x="460" y="218" width="180" height="26"/>
  <text class="t" x="470" y="231" dominant-baseline="central">defer to next slot</text>

  <path class="ln dash" d="M420,277H458" marker-end="url(#fo-cpg-ah)"/>
  <rect class="cell ghost end" x="460" y="264" width="180" height="26"/>
  <text class="t dim" x="470" y="277" dominant-baseline="central">hold: fix the template</text>

  <!-- Every decision is logged -->
  <path class="ln dash" d="M640,93H660M640,139H660M640,185H660M640,231H660M640,277H660"/>
  <path class="ln dash" d="M660,93V336H642" marker-end="url(#fo-cpg-ah)"/>
  <path class="ln ink" d="M420,336H458" marker-end="url(#fo-cpg-ah-ink)"/>
  <rect class="cell band" x="460" y="322" width="180" height="28"/>
  <text class="t b" x="550" y="336" text-anchor="middle" dominant-baseline="central">audit log</text>
  <text class="n" x="550" y="372" text-anchor="middle">every decision, blocks included,</text>
  <text class="n" x="550" y="386" text-anchor="middle">with the rule that made it</text>
</svg>
