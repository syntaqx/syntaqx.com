  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE OCCURRENCE KEEPS ITS IDENTITY (RECURRENCE PLUS ORIGINAL DUE DATE) WHEREVER THE VISIT LANDS IN</text>
  <text class="nt" x="50" y="75">THE WINDOW.</text>
  <rect class="nb" x="31" y="82.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">REBOOKED FROM AUG 15 TO AUG 19: ON TIME, BECAUSE THE WINDOW, NOT THE DUE DATE, IS THE PROMISE.</text>
  <rect class="nb" x="31" y="99.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="109" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">SCHEDULE ANCHORING IGNORES THE LATE VISIT; COMPLETION ANCHORING MOVES EVERY LATER DUE DATE BY IT.</text>
  <rect class="nb" x="31" y="116.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="126" text-anchor="middle">4</text>
  <text class="nt" x="50" y="126">A LABEL'S MINIMUM REAPPLICATION GAP IS MEASURED LIKE THE COMPLETION ROW, FROM THE LAST COMPLETED</text>
  <text class="nt" x="50" y="139">APPLICATION.</text>
  <text class="nt" x="50" y="156">VALUES IN DAYS. THE AUGUST WINDOW IS THE CHAPTER'S EXAMPLE; THE 90-DAY INTERVAL IS ILLUSTRATIVE.</text>
