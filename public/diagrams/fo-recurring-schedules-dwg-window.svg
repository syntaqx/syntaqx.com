  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE OCCURRENCE KEEPS ITS IDENTITY (RECURRENCE PLUS ORIGINAL DUE DATE) WHEREVER THE VISIT LANDS IN THE WINDOW.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">REBOOKED FROM AUG 15 TO AUG 19: ON TIME, BECAUSE THE WINDOW, NOT THE DUE DATE, IS THE PROMISE.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">SCHEDULE ANCHORING IGNORES THE LATE VISIT; COMPLETION ANCHORING MOVES EVERY LATER DUE DATE BY IT.</text>
  <rect class="nb" x="32" y="104.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="112.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">A LABEL'S MINIMUM REAPPLICATION GAP IS MEASURED LIKE THE COMPLETION ROW, FROM THE LAST COMPLETED</text>
  <text class="nt" x="50" y="126">APPLICATION.</text>
  <text class="nt" x="50" y="143">VALUES IN DAYS. THE AUGUST WINDOW IS THE CHAPTER'S EXAMPLE; THE 90-DAY INTERVAL IS ILLUSTRATIVE.</text>
