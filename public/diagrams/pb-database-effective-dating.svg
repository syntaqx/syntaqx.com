  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE PRICES FOR ONE ITEM IN ONE REGION; RANGES FOLLOW THE CHAPTER'S VALID_DURING AND [)</text>
  <text class="nt" x="50" y="75">RULES.</text>
  <rect class="nb" x="31" y="82.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">THE EXCLUSION CONSTRAINT REJECTS ANY ROW WHOSE VALID_DURING OVERLAPS ANOTHER FOR THE SAME ITEM</text>
  <text class="nt" x="50" y="105">AND REGION.</text>
  <rect class="nb" x="31" y="112.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="122" text-anchor="middle">3</text>
  <text class="nt" x="50" y="122">AN OPEN UPPER BOUND MEANS UNTIL FURTHER NOTICE: UPPER_INF(VALID_DURING) IS TRUE, WITH NO SENTINEL</text>
  <text class="nt" x="50" y="135">DATE.</text>
  <rect class="nb" x="31" y="142.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="152" text-anchor="middle">4</text>
  <text class="nt" x="50" y="152">THE AS-OF MOMENT IS A PARAMETER: VALID_DURING @&gt; Q1 RETURNS V2 WHENEVER THE QUERY RUNS.</text>
  <rect class="nb" x="31" y="159.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="169" text-anchor="middle">5</text>
  <text class="nt" x="50" y="169">CLOSED-OPEN: V1'S EXCLUDED UPPER BOUND EQUALS V2'S INCLUDED LOWER BOUND, SO V1 -|- V2: NO GAP, NO SHARED</text>
  <text class="nt" x="50" y="182">DAY.</text>
  <text class="nt" x="50" y="199">AMOUNTS IN CENTS, USD. THE DRAWING CARRIES CODES; RANGES, AMOUNTS AND DATES ARE IN THE TABLE.</text>
