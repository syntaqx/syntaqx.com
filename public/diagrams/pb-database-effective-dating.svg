  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE PRICES FOR ONE ITEM IN ONE REGION; RANGES FOLLOW THE CHAPTER'S VALID_DURING AND [) RULES.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">THE EXCLUSION CONSTRAINT REJECTS ANY ROW WHOSE VALID_DURING OVERLAPS ANOTHER FOR THE SAME ITEM AND REGION.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">AN OPEN UPPER BOUND MEANS UNTIL FURTHER NOTICE: UPPER_INF(VALID_DURING) IS TRUE, WITH NO SENTINEL DATE.</text>
  <rect class="nb" x="32" y="104.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="112.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">THE AS-OF MOMENT IS A PARAMETER: VALID_DURING @&gt; Q1 RETURNS V2 WHENEVER THE QUERY RUNS.</text>
  <rect class="nb" x="32" y="121.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="129.5" text-anchor="middle">5</text>
  <text class="nt" x="50" y="130">CLOSED-OPEN: V1'S EXCLUDED UPPER BOUND EQUALS V2'S INCLUDED LOWER BOUND, SO V1 -|- V2: NO GAP, NO SHARED DAY.</text>
  <text class="nt" x="50" y="147">AMOUNTS IN CENTS, USD. THE DRAWING CARRIES CODES; RANGES, AMOUNTS AND DATES ARE IN THE TABLE.</text>
