<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290">
  <defs>
    <marker id="fo-ri-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ri-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Captions above the main row -->
  <text class="cap" x="40" y="46">the call</text>
  <rect class="zone" x="232" y="28" width="400" height="66"/>
  <text class="cap hl" x="242" y="44">the first visit</text>
  <text class="cap" x="640" y="46">office</text>

  <!-- Main row: call to close -->
  <rect class="cell" x="40" y="58" width="84" height="26"/>
  <text class="t" x="82" y="71" text-anchor="middle" dominant-baseline="central">call</text>
  <rect class="cell" x="140" y="58" width="84" height="26"/>
  <text class="t" x="182" y="71" text-anchor="middle" dominant-baseline="central">triage</text>
  <rect class="cell" x="240" y="58" width="84" height="26"/>
  <text class="t" x="282" y="71" text-anchor="middle" dominant-baseline="central">diagnose</text>
  <rect class="cell" x="340" y="58" width="84" height="26"/>
  <text class="t" x="382" y="71" text-anchor="middle" dominant-baseline="central">quote</text>
  <rect class="cell hl" x="440" y="58" width="84" height="26"/>
  <text class="t hl b" x="482" y="71" text-anchor="middle" dominant-baseline="central">approved</text>
  <rect class="cell" x="540" y="58" width="84" height="26"/>
  <text class="t" x="582" y="71" text-anchor="middle" dominant-baseline="central">repair</text>
  <rect class="cell end" x="640" y="58" width="84" height="26"/>
  <text class="t b" x="682" y="71" text-anchor="middle" dominant-baseline="central">closed</text>

  <path class="ln hl" d="M124,71H138" marker-end="url(#fo-ri-ah-hl)"/>
  <path class="ln hl" d="M224,71H238" marker-end="url(#fo-ri-ah-hl)"/>
  <path class="ln hl" d="M324,71H338" marker-end="url(#fo-ri-ah-hl)"/>
  <path class="ln hl" d="M424,71H438" marker-end="url(#fo-ri-ah-hl)"/>
  <path class="ln hl" d="M524,71H538" marker-end="url(#fo-ri-ah-hl)"/>
  <path class="ln hl" d="M624,71H638" marker-end="url(#fo-ri-ah-hl)"/>

  <!-- Triage note -->
  <text class="n" x="40" y="128">triage reads: problem,</text>
  <text class="n" x="40" y="142">asset, warranty,</text>
  <text class="n" x="40" y="156">membership, priority</text>

  <!-- Declined -->
  <rect class="cell ghost end" x="340" y="128" width="84" height="26"/>
  <text class="t dim" x="382" y="141" text-anchor="middle" dominant-baseline="central">declined</text>
  <path class="ln dash" d="M382,84V126" marker-end="url(#fo-ri-ah)"/>
  <text class="n" x="382" y="172" text-anchor="middle">fee only</text>

  <!-- Part on order, return visit -->
  <rect class="cell band" x="440" y="128" width="84" height="26"/>
  <text class="t b" x="482" y="141" text-anchor="middle" dominant-baseline="central">part ordered</text>
  <path class="ln dash" d="M482,84V126" marker-end="url(#fo-ri-ah)"/>
  <text class="n" x="482" y="172" text-anchor="middle">order on hold</text>

  <rect class="cell" x="540" y="128" width="84" height="26"/>
  <text class="t" x="582" y="141" text-anchor="middle" dominant-baseline="central">return visit</text>
  <path class="ln" d="M524,141H538" marker-end="url(#fo-ri-ah)"/>
  <path class="ln" d="M582,128V86" marker-end="url(#fo-ri-ah)"/>
  <text class="n" x="582" y="172" text-anchor="middle">same work order</text>

  <!-- Warranty claim -->
  <rect class="cell" x="640" y="128" width="84" height="26"/>
  <text class="t" x="682" y="141" text-anchor="middle" dominant-baseline="central">claim filed</text>
  <path class="ln dash" d="M682,84V126" marker-end="url(#fo-ri-ah)"/>
  <rect class="cell end" x="640" y="198" width="84" height="26"/>
  <text class="t" x="682" y="211" text-anchor="middle" dominant-baseline="central">credited</text>
  <path class="ln" d="M682,154V196" marker-end="url(#fo-ri-ah)"/>
  <text class="n" x="720" y="242" text-anchor="end">parts, sometimes labor</text>

  <text class="n hl" x="720" y="276" text-anchor="end">the work order holds the problem and the money; each trip is a visit</text>
</svg>
