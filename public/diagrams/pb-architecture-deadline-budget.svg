  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE API PROMISES A RESPONSE WITHIN D1; EVERY CALL IT MAKES SPENDS FROM THAT ONE BUDGET.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">THE ATTEMPT HITS ITS TIMEOUT A. A DEADLINE HEADER TELLS THE CALLEE HOW LONG IT HAS LEFT.</text>
  <rect class="nb" x="31" y="86.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="96" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">FULL JITTER: J = RANDOM(0, MIN(CAP, BASE × 2^N)), BASE 0.50 AND CAP 5.00, DRAWN AT ITS CEILING.</text>
  <rect class="nb" x="31" y="103.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="113" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">EACH CALL GETS ITS OWN 10 S: THE USER CAN WAIT 30 S AND THE REQUEST STILL FAILS.</text>
  <rect class="nb" x="31" y="120.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="130" text-anchor="middle">5</text>
  <text class="nt" x="50" y="130">T1, T2 AND THE THREE-ATTEMPT PLAN ARE ILLUSTRATIVE; A FOLLOWS FROM THEM AND CLOSES THE CHAIN.</text>
  <text class="nt" x="50" y="147">VALUES IN S, WORST CASE. THE DRAWING CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLE.</text>
