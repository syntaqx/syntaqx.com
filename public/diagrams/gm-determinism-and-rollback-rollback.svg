  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE: A 60 HZ GAME, ONE LATE REMOTE INPUT, SIMULATION AND RENDER COSTS CHOSEN FOR THE ARITHMETIC.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">REMOTE INPUTS FOR FRAMES 5 TO 9 ARRIVE AT THE START OF FRAME 9; FRAMES 5 TO 8 RAN ON PREDICTED INPUT.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">AN OPEN-SOURCE ROLLBACK LIBRARY'S MAX_PREDICTION_FRAMES IS 8: PAST IT, SYNCHRONIZING INPUTS FAILS AND THE</text>
  <text class="nt" x="50" y="109">GAME WAITS (HATCHED).</text>
  <rect class="nb" x="32" y="117.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="125.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="126">AT THE LIMIT THE ROLLBACK FRAME OVERRUNS (L1 &gt; F1), SO ONE SIMULATED FRAME MUST FIT IN S2.</text>
  <text class="nt" x="50" y="143">VALUES IN MS UNLESS MARKED FRAMES. THE DRAWING CARRIES CODES; VALUES AND FORMULAS ARE IN THE TABLE.</text>
