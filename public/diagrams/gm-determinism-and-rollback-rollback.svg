  <text class="tc" x="134" y="683">F1</text>
  <text class="tc" x="297.5" y="683" text-anchor="middle">frame at 60 Hz, ms</text>
  <text class="tc" x="528.5" y="683" text-anchor="middle">1000 ÷ 60 = 16.67</text>
