<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 920">
  <defs>
    <marker id="gm-drr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-drr-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-drr-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-DET-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">rollback, one late input</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <text class="vt" x="40" y="64">Plan view: one peer at 60 Hz</text>
  <text class="vs" x="40" y="80">Scale 1 frame = 50 px · frames 1 to 12 · illustrative [1]</text>

  <!-- Frame numbers -->
  <text class="t" x="115" y="112" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="t" x="165" y="112" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="t" x="215" y="112" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="t" x="265" y="112" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="t" x="315" y="112" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="t" x="365" y="112" text-anchor="middle" dominant-baseline="central">6</text>
  <text class="t" x="415" y="112" text-anchor="middle" dominant-baseline="central">7</text>
  <text class="t" x="465" y="112" text-anchor="middle" dominant-baseline="central">8</text>
  <text class="t" x="515" y="112" text-anchor="middle" dominant-baseline="central">9</text>
  <text class="t" x="565" y="112" text-anchor="middle" dominant-baseline="central">10</text>
  <text class="t" x="615" y="112" text-anchor="middle" dominant-baseline="central">11</text>
  <text class="t" x="665" y="112" text-anchor="middle" dominant-baseline="central">12</text>

  <!-- Remote input lane -->
  <text class="sl ink" x="90" y="134">remote input</text>
  <rect class="obj fill-2" x="90" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="140" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="190" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="240" y="140" width="50" height="24"/>
  <rect class="slot" x="290" y="140" width="50" height="24"/>
  <rect class="slot" x="340" y="140" width="50" height="24"/>
  <rect class="slot" x="390" y="140" width="50" height="24"/>
  <rect class="slot" x="440" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="490" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="540" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="590" y="140" width="50" height="24"/>
  <rect class="obj fill-2" x="640" y="140" width="50" height="24"/>
  <circle class="dot" cx="490" cy="152" r="2.5"/>
  <path class="leader" d="M490,152L478,183H400"/>
  <text class="sl ink" x="396" y="183" text-anchor="end" dominant-baseline="central">late inputs arrive [2]</text>

  <!-- Simulation lane -->
  <text class="sl ink" x="90" y="196">simulation</text>
  <rect class="obj fill-2" x="90" y="202" width="50" height="24"/>
  <rect class="obj fill-2" x="140" y="202" width="50" height="24"/>
  <rect class="obj fill-2" x="190" y="202" width="50" height="24"/>
  <rect class="obj fill-2" x="240" y="202" width="50" height="24"/>
  <rect class="slot" x="290" y="202" width="50" height="24"/>
  <rect class="slot" x="340" y="202" width="50" height="24"/>
  <rect class="slot" x="390" y="202" width="50" height="24"/>
  <rect class="slot" x="440" y="202" width="50" height="24"/>
  <rect class="obj fill-1" x="490" y="202" width="50" height="24"/>
  <rect class="obj fill-2" x="540" y="202" width="50" height="24"/>
  <rect class="obj fill-2" x="590" y="202" width="50" height="24"/>
  <rect class="obj fill-2" x="640" y="202" width="50" height="24"/>
  <rect class="hatch" x="690" y="202" width="40" height="24" fill="url(#gm-drr-hatch)"/>
  <rect class="hatch" x="690" y="140" width="40" height="24" fill="url(#gm-drr-hatch)"/>
  <text class="t" x="710" y="184" text-anchor="middle" dominant-baseline="central">[3]</text>
  <circle class="detail" cx="515" cy="214" r="22"/>
  <text class="sl ink" x="543" y="183" dominant-baseline="central">detail A</text>

  <!-- Dimensions -->
  <path class="ext" d="M90,229V251M140,229V251M290,229V311M490,229V251M540,229V281M690,229V311"/>
  <path class="dim" d="M90,246H140" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="148" y="246" dominant-baseline="central">F1 = 16.67 ms</text>
  <path class="dim" d="M290,246H490" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="390" y="242" text-anchor="middle">P1 = 4 x F1 = 66.67</text>
  <path class="dim hl" d="M290,276H540" marker-start="url(#gm-drr-ah-hl)" marker-end="url(#gm-drr-ah-hl)"/>
  <text class="dt hl" x="415" y="272" text-anchor="middle">R1 = P1 / F1 + 1 = 5 frames</text>
  <path class="dim" d="M290,306H690" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="490" y="302" text-anchor="middle">M1 = 8 frames, the limit [3]</text>

  <!-- Detail A: frame 9 -->
  <text class="vt" x="40" y="352">Detail A: frame 9, the rollback frame</text>
  <text class="vs" x="40" y="368">Scale 1 ms = 30 px · values in ms · illustrative [1]</text>
  <path class="ext" d="M120,397V383M620.1,397V383"/>
  <path class="dim" d="M120,388H620.1" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="370" y="384" text-anchor="middle">F1 = A1 + 5 x S1 + G1 + K1 = 16.67</text>
  <rect class="obj fill-2" x="120.0" y="400" width="6.0" height="36"/>
  <rect class="obj fill-2" x="126.0" y="400" width="45.0" height="36"/>
  <text class="t" x="148.5" y="418" text-anchor="middle" dominant-baseline="central">5</text>
  <rect class="obj fill-2" x="171.0" y="400" width="45.0" height="36"/>
  <text class="t" x="193.5" y="418" text-anchor="middle" dominant-baseline="central">6</text>
  <rect class="obj fill-2" x="216.0" y="400" width="45.0" height="36"/>
  <text class="t" x="238.5" y="418" text-anchor="middle" dominant-baseline="central">7</text>
  <rect class="obj fill-2" x="261.0" y="400" width="45.0" height="36"/>
  <text class="t" x="283.5" y="418" text-anchor="middle" dominant-baseline="central">8</text>
  <rect class="obj fill-1" x="306.0" y="400" width="45.0" height="36"/>
  <text class="t" x="328.5" y="418" text-anchor="middle" dominant-baseline="central">9</text>
  <rect class="obj fill-2" x="351.0" y="400" width="150.0" height="36"/>
  <text class="sl ink" x="426.0" y="418" text-anchor="middle" dominant-baseline="central">render</text>
  <rect class="phantom" x="501.0" y="400" width="119.1" height="36"/>
  <text class="sl ink" x="560.5" y="418" text-anchor="middle" dominant-baseline="central">slack</text>
  <path class="ext" d="M120.0,439V461M126.0,439V461M306.0,439V461M351.0,439V461M501.0,439V461M620.1,439V461"/>
  <path class="dim" d="M100,456H120" marker-end="url(#gm-drr-ah)"/>
  <path class="dim" d="M120,456H126.0"/>
  <text class="dt" x="96" y="456" text-anchor="end" dominant-baseline="central">A1 = 0.20</text>
  <path class="dim" d="M126.0,456H306.0" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="216.0" y="452" text-anchor="middle">4 x S1 = 6.00</text>
  <path class="dim" d="M306.0,456H351.0" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="328.5" y="474" text-anchor="middle">S1 = 1.50</text>
  <path class="dim" d="M351.0,456H501.0" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="426.0" y="452" text-anchor="middle">G1 = 5.00</text>
  <path class="dim" d="M501.0,456H620.1" marker-start="url(#gm-drr-ah)" marker-end="url(#gm-drr-ah)"/>
  <text class="dt" x="560.5" y="452" text-anchor="middle">K1 = 3.97</text>

  <text class="t" x="40" y="504" dominant-baseline="central">F1 = 0.20 + 5 x 1.50 + 5.00 + 3.97 = 16.67</text>
  <text class="t" x="40" y="524" dominant-baseline="central">at the limit: A1 + (M1 + 1) x S1 + G1 = 0.20 + 9 x 1.50 + 5.00 = 18.70 &gt; F1</text>
  <text class="t" x="40" y="544" dominant-baseline="central">so simulation must fit S1 &lt;= (F1 - A1 - G1) / (M1 + 1) = 11.47 / 9 = 1.27</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="584">Variables</text>
  <text class="vs" x="40" y="600">Illustrative [1] · M1 per GGPO [3]</text>
  <rect class="cell band" x="40" y="610" width="60" height="22"/>
  <rect class="cell band" x="100" y="610" width="520" height="22"/>
  <rect class="cell band" x="620" y="610" width="100" height="22"/>
  <text class="cap ink" x="50" y="621" dominant-baseline="central">code</text>
  <text class="cap ink" x="110" y="621" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="621" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,632H720V808H40Z"/>
  <path class="ln ink" d="M100,632V808M620,632V808"/>
  <path class="ln" d="M40,654H720M40,676H720M40,698H720M40,720H720M40,742H720M40,764H720M40,786H720"/>
  <text class="t" x="50" y="643" dominant-baseline="central">F1</text>
  <text class="t" x="110" y="643" dominant-baseline="central">frame at 60 Hz: 1000 / 60, ms</text>
  <text class="t" x="710" y="643" text-anchor="end" dominant-baseline="central">16.67</text>
  <text class="t" x="50" y="665" dominant-baseline="central">P1</text>
  <text class="t" x="110" y="665" dominant-baseline="central">predicted frames before the late input, ms</text>
  <text class="t" x="710" y="665" text-anchor="end" dominant-baseline="central">66.67</text>
  <text class="t b" x="50" y="687" dominant-baseline="central">R1</text>
  <text class="t" x="110" y="687" dominant-baseline="central">frames simulated in frame 9: P1 / F1 + 1</text>
  <text class="t b" x="710" y="687" text-anchor="end" dominant-baseline="central">5</text>
  <text class="t" x="50" y="709" dominant-baseline="central">M1</text>
  <text class="t" x="110" y="709" dominant-baseline="central">prediction limit, frames</text>
  <text class="t" x="710" y="709" text-anchor="end" dominant-baseline="central">8</text>
  <text class="t" x="50" y="731" dominant-baseline="central">A1</text>
  <text class="t" x="110" y="731" dominant-baseline="central">load the saved state of frame 4, ms</text>
  <text class="t" x="710" y="731" text-anchor="end" dominant-baseline="central">0.20</text>
  <text class="t" x="50" y="753" dominant-baseline="central">S1</text>
  <text class="t" x="110" y="753" dominant-baseline="central">simulate one frame without rendering, ms</text>
  <text class="t" x="710" y="753" text-anchor="end" dominant-baseline="central">1.50</text>
  <text class="t" x="50" y="775" dominant-baseline="central">G1</text>
  <text class="t" x="110" y="775" dominant-baseline="central">render and present, ms</text>
  <text class="t" x="710" y="775" text-anchor="end" dominant-baseline="central">5.00</text>
  <text class="t" x="50" y="797" dominant-baseline="central">K1</text>
  <text class="t" x="110" y="797" dominant-baseline="central">slack left in frame 9, ms</text>
  <text class="t" x="710" y="797" text-anchor="end" dominant-baseline="central">3.97</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="824" width="680" height="80"/>
  <text class="sl ink" x="52" y="842">notes</text>
  <text class="n" x="52" y="860">[1] Illustrative: a 60 Hz game, one late remote input, simulation and render costs chosen for the arithmetic.</text>
  <text class="n" x="52" y="876">[2] Remote inputs for frames 5 to 9 arrive at the start of frame 9; frames 5 to 8 ran on predicted input.</text>
  <text class="n" x="52" y="892">[3] GGPO's MAX_PREDICTION_FRAMES is 8: past it, synchronizing inputs fails and the game waits (hatched).</text>
</svg>
