  <text class="tc" x="134" y="788">K1</text>
  <text class="tc" x="297.5" y="788" text-anchor="middle">slack left in frame 9, ms</text>
  <text class="tc" x="528.5" y="788" text-anchor="middle">F1 − A1 − R1 × S1 − G1 = 3.97</text>
  <text class="tc" x="134" y="803">L1</text>
  <text class="tc" x="297.5" y="803" text-anchor="middle">rollback frame at the limit, ms</text>
  <text class="tc" x="528.5" y="803" text-anchor="middle">A1 + (M1 + 1) × S1 + G1 = 18.70</text>
  <text class="tc" x="134" y="818">S2</text>
  <text class="tc" x="297.5" y="818" text-anchor="middle">largest S1 that fits at the limit, ms</text>
  <text class="tc" x="528.5" y="818" text-anchor="middle">(F1 − A1 − G1) ÷ (M1 + 1) = 1.27</text>
