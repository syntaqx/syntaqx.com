<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 660">
  <defs>
    <marker id="pb-zdm-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">PB-DB-002</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">expand and contract</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <text class="vt" x="40" y="64">Plan view: renaming users.name to full_name</text>
  <text class="vs" x="40" y="80">Not to scale · timeline · one deploy per step [1]</text>

  <!-- Legend -->
  <rect class="obj fill-1" x="150" y="96" width="14" height="10"/>
  <text class="sl ink" x="170" y="101" dominant-baseline="central">read and written</text>
  <rect class="obj fill-2" x="350" y="96" width="14" height="10"/>
  <text class="sl ink" x="370" y="101" dominant-baseline="central">written only</text>
  <rect class="slot" x="510" y="96" width="14" height="10"/>
  <text class="sl ink" x="530" y="101" dominant-baseline="central">exists, unused</text>

  <!-- Deploys -->
  <text class="t b" x="200" y="128" text-anchor="middle" dominant-baseline="central">d1</text>
  <text class="t b" x="290" y="128" text-anchor="middle" dominant-baseline="central">d2</text>
  <text class="t b" x="380" y="128" text-anchor="middle" dominant-baseline="central">d3</text>
  <text class="t b" x="470" y="128" text-anchor="middle" dominant-baseline="central">d4</text>
  <text class="t b" x="560" y="128" text-anchor="middle" dominant-baseline="central">d5</text>
  <text class="t b" x="650" y="128" text-anchor="middle" dominant-baseline="central">d6</text>
  <path class="ctr" d="M200,136V216M290,136V216M380,136V216M470,136V216M560,136V216M650,136V216"/>

  <!-- Lane: the old column -->
  <text class="sl ink" x="40" y="156" dominant-baseline="central">name</text>
  <rect class="obj fill-1" x="150" y="144" width="320" height="24"/>
  <rect class="obj fill-2" x="470" y="144" width="90" height="24"/>
  <rect class="slot" x="560" y="144" width="90" height="24"/>

  <!-- Lane: the new column -->
  <text class="sl ink" x="40" y="196" dominant-baseline="central">full_name</text>
  <rect class="slot" x="200" y="184" width="90" height="24"/>
  <rect class="obj fill-2" x="290" y="184" width="180" height="24"/>
  <rect class="obj hl" x="470" y="184" width="250" height="24"/>

  <!-- Lane: the backfill job -->
  <text class="sl ink" x="40" y="236" dominant-baseline="central">backfill</text>
  <rect class="cell band" x="380" y="224" width="90" height="24"/>
  <text class="sl ink" x="380" y="262" dominant-baseline="central">batched job [2]</text>

  <!-- W1: the wait before the drop -->
  <path class="ext" d="M560,219V285M650,219V285"/>
  <path class="dim" d="M560,280H650" marker-start="url(#pb-zdm-ah)" marker-end="url(#pb-zdm-ah)"/>
  <text class="dt" x="605" y="298" text-anchor="middle">W1 ≥ 1 deploy cycle [3]</text>
  <text class="t" x="380" y="330" text-anchor="middle">every dn serves the schema dn-1 left behind, so any deploy rolls back to the one before it</text>

  <!-- Step table -->
  <text class="vt" x="40" y="370">Steps</text>
  <text class="vs" x="40" y="386">From the chapter's rename example</text>
  <rect class="cell band" x="40" y="396" width="50" height="22"/>
  <rect class="cell band" x="90" y="396" width="160" height="22"/>
  <rect class="cell band" x="250" y="396" width="230" height="22"/>
  <rect class="cell band" x="480" y="396" width="110" height="22"/>
  <rect class="cell band" x="590" y="396" width="130" height="22"/>
  <text class="cap ink" x="50" y="407" dominant-baseline="central">code</text>
  <text class="cap ink" x="100" y="407" dominant-baseline="central">step</text>
  <text class="cap ink" x="260" y="407" dominant-baseline="central">schema or data</text>
  <text class="cap ink" x="490" y="407" dominant-baseline="central">reads</text>
  <text class="cap ink" x="600" y="407" dominant-baseline="central">writes</text>
  <path class="cell" d="M40,418H720V550H40Z"/>
  <path class="ln ink" d="M90,418V550M250,418V550M480,418V550M590,418V550"/>
  <path class="ln" d="M40,440H720M40,462H720M40,484H720M40,506H720M40,528H720"/>
  <text class="t b" x="50" y="429" dominant-baseline="central">d1</text>
  <text class="t" x="100" y="429" dominant-baseline="central">expand</text>
  <text class="t" x="260" y="429" dominant-baseline="central">ADD COLUMN full_name</text>
  <text class="t" x="490" y="429" dominant-baseline="central">name</text>
  <text class="t" x="600" y="429" dominant-baseline="central">name</text>
  <text class="t b" x="50" y="451" dominant-baseline="central">d2</text>
  <text class="t" x="100" y="451" dominant-baseline="central">write both</text>
  <text class="t" x="260" y="451" dominant-baseline="central">none</text>
  <text class="t" x="490" y="451" dominant-baseline="central">name</text>
  <text class="t" x="600" y="451" dominant-baseline="central">both</text>
  <text class="t b" x="50" y="473" dominant-baseline="central">d3</text>
  <text class="t" x="100" y="473" dominant-baseline="central">backfill</text>
  <text class="t" x="260" y="473" dominant-baseline="central">UPDATE in batches of 1,000</text>
  <text class="t" x="490" y="473" dominant-baseline="central">name</text>
  <text class="t" x="600" y="473" dominant-baseline="central">both</text>
  <text class="t b" x="50" y="495" dominant-baseline="central">d4</text>
  <text class="t" x="100" y="495" dominant-baseline="central">read new</text>
  <text class="t" x="260" y="495" dominant-baseline="central">none</text>
  <text class="t" x="490" y="495" dominant-baseline="central">full_name</text>
  <text class="t" x="600" y="495" dominant-baseline="central">both</text>
  <text class="t b" x="50" y="517" dominant-baseline="central">d5</text>
  <text class="t" x="100" y="517" dominant-baseline="central">stop writing old</text>
  <text class="t" x="260" y="517" dominant-baseline="central">none</text>
  <text class="t" x="490" y="517" dominant-baseline="central">full_name</text>
  <text class="t" x="600" y="517" dominant-baseline="central">full_name</text>
  <text class="t b" x="50" y="539" dominant-baseline="central">d6</text>
  <text class="t" x="100" y="539" dominant-baseline="central">contract</text>
  <text class="t" x="260" y="539" dominant-baseline="central">DROP COLUMN name</text>
  <text class="t" x="490" y="539" dominant-baseline="central">full_name</text>
  <text class="t" x="600" y="539" dominant-baseline="central">full_name</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="566" width="680" height="74"/>
  <text class="sl ink" x="52" y="584">notes</text>
  <text class="n" x="52" y="602">[1] Old and new code share one schema during every deploy, so each step has to work with the code before it.</text>
  <text class="n" x="52" y="618">[2] Resumable, keyed on WHERE full_name IS NULL; count the rows that still differ, and contract only at zero.</text>
  <text class="n" x="52" y="634">[3] The DROP ships alone, at least one deploy cycle after d5 removed the last code that touched name.</text>
</svg>
