  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">OLD AND NEW CODE SHARE ONE SCHEMA DURING EVERY DEPLOY, SO EACH STEP HAS TO WORK WITH THE CODE BEFORE IT.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">RESUMABLE, KEYED ON WHERE FULL_NAME IS NULL; COUNT THE ROWS THAT STILL DIFFER, AND CONTRACT ONLY AT ZERO.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">THE DROP SHIPS ALONE, AT LEAST ONE DEPLOY CYCLE AFTER D5 REMOVED THE LAST CODE THAT TOUCHED NAME.</text>
  <rect class="nb" x="32" y="104.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="112.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">EACH DEPLOY RUNS ON THE SCHEMA THE DEPLOY BEFORE IT LEFT BEHIND, SO ANY DEPLOY ROLLS BACK TO THE ONE BEFORE IT.</text>
  <text class="nt" x="50" y="130">NOT TO SCALE: ONE DEPLOY PER STEP, EVENLY SPACED. SCHEMA CHANGES, READS AND WRITES ARE IN THE TABLE.</text>
