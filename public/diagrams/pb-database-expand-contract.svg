  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">OLD AND NEW CODE SHARE ONE SCHEMA DURING EVERY DEPLOY, SO EACH STEP HAS TO WORK WITH THE CODE BEFORE</text>
  <text class="nt" x="50" y="75">IT.</text>
  <rect class="nb" x="31" y="82.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">RESUMABLE, KEYED ON WHERE FULL_NAME IS NULL; COUNT THE ROWS THAT STILL DIFFER, AND CONTRACT ONLY AT</text>
  <text class="nt" x="50" y="105">ZERO.</text>
  <rect class="nb" x="31" y="112.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="122" text-anchor="middle">3</text>
  <text class="nt" x="50" y="122">THE DROP SHIPS ALONE, AT LEAST ONE DEPLOY CYCLE AFTER D5 REMOVED THE LAST CODE THAT TOUCHED NAME.</text>
  <rect class="nb" x="31" y="129.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="139" text-anchor="middle">4</text>
  <text class="nt" x="50" y="139">EACH DEPLOY RUNS ON THE SCHEMA THE DEPLOY BEFORE IT LEFT BEHIND, SO ANY DEPLOY ROLLS BACK TO THE ONE</text>
  <text class="nt" x="50" y="152">BEFORE IT.</text>
  <text class="nt" x="50" y="169">NOT TO SCALE: ONE DEPLOY PER STEP, EVENLY SPACED. SCHEMA CHANGES, READS AND WRITES ARE IN THE TABLE.</text>
