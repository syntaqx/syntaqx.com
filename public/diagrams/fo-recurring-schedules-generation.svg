<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210">
  <!-- Column heads -->
  <text class="cap" x="50" y="34">model</text>
  <text class="cap" x="190" y="34">when the visit exists</text>
  <text class="cap" x="360" y="34">documented by</text>
  <text class="cap" x="550" y="34">what goes wrong</text>

  <!-- Rolling window: the default -->
  <rect class="cell hl" x="40" y="44" width="140" height="26"/>
  <text class="t hl b" x="50" y="57" dominant-baseline="central">rolling window</text>
  <rect class="cell" x="180" y="44" width="170" height="26"/>
  <text class="t" x="190" y="57" dominant-baseline="central">N days ahead, real work</text>
  <rect class="cell" x="350" y="44" width="190" height="26"/>
  <text class="t" x="360" y="57" dominant-baseline="central">Dynamics, Salesforce</text>
  <rect class="cell" x="540" y="44" width="180" height="26"/>
  <text class="t dim" x="550" y="57" dominant-baseline="central">horizon hides capacity</text>

  <!-- Due placeholder -->
  <rect class="cell" x="40" y="70" width="140" height="26"/>
  <text class="t" x="50" y="83" dominant-baseline="central">due placeholder</text>
  <rect class="cell" x="180" y="70" width="170" height="26"/>
  <text class="t" x="190" y="83" dominant-baseline="central">due event, booked later</text>
  <rect class="cell" x="350" y="70" width="190" height="26"/>
  <text class="t" x="360" y="83" dominant-baseline="central">ServiceM8, FieldRoutes</text>
  <rect class="cell" x="540" y="70" width="180" height="26"/>
  <text class="t dim" x="550" y="83" dominant-baseline="central">unbooked work piles up</text>

  <!-- On completion -->
  <rect class="cell" x="40" y="96" width="140" height="26"/>
  <text class="t" x="50" y="109" dominant-baseline="central">on completion</text>
  <rect class="cell" x="180" y="96" width="170" height="26"/>
  <text class="t" x="190" y="109" dominant-baseline="central">after the last visit</text>
  <rect class="cell" x="350" y="96" width="190" height="26"/>
  <text class="t" x="360" y="109" dominant-baseline="central">GorillaDesk, FieldRoutes</text>
  <rect class="cell" x="540" y="96" width="180" height="26"/>
  <text class="t dim" x="550" y="109" dominant-baseline="central">one miss stalls the chain</text>

  <!-- Per asset -->
  <rect class="cell" x="40" y="122" width="140" height="26"/>
  <text class="t" x="50" y="135" dominant-baseline="central">per asset</text>
  <rect class="cell" x="180" y="122" width="170" height="26"/>
  <text class="t" x="190" y="135" dominant-baseline="central">each asset, own rule</text>
  <rect class="cell" x="350" y="122" width="190" height="26"/>
  <text class="t" x="360" y="135" dominant-baseline="central">Salesforce</text>
  <rect class="cell" x="540" y="122" width="180" height="26"/>
  <text class="t dim" x="550" y="135" dominant-baseline="central">work orders multiply</text>

  <!-- Allowance -->
  <rect class="cell" x="40" y="148" width="140" height="26"/>
  <text class="t" x="50" y="161" dominant-baseline="central">allowance</text>
  <rect class="cell" x="180" y="148" width="170" height="26"/>
  <text class="t" x="190" y="161" dominant-baseline="central">on request, counted</text>
  <rect class="cell" x="350" y="148" width="190" height="26"/>
  <text class="t" x="360" y="161" dominant-baseline="central">FieldPulse on-demand</text>
  <rect class="cell" x="540" y="148" width="180" height="26"/>
  <text class="t dim" x="550" y="161" dominant-baseline="central">unused visit liability</text>

  <text class="n hl" x="720" y="198" text-anchor="end">a sound default: real visits inside a window, due placeholders beyond it</text>
</svg>
