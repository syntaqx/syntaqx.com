<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248">
  <defs>
    <marker id="cp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="cp-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="40" y="20">from code to live payments</text>
  <text class="cap hl" x="680" y="20" text-anchor="end">go-live</text>
  <path class="ln hl" d="M40,30H678" marker-end="url(#cp-ah-hl)"/>

  <!-- Stages -->
  <rect class="cell" x="40" y="44" width="128" height="26"/>
  <text class="t b" x="104" y="57" text-anchor="middle" dominant-baseline="central">your tests</text>
  <rect class="cell" x="168" y="44" width="128" height="26"/>
  <text class="t b" x="232" y="57" text-anchor="middle" dominant-baseline="central">processor</text>
  <rect class="cell" x="296" y="44" width="128" height="26"/>
  <text class="t b" x="360" y="57" text-anchor="middle" dominant-baseline="central">network, EMV</text>
  <rect class="cell" x="424" y="44" width="128" height="26"/>
  <text class="t b" x="488" y="57" text-anchor="middle" dominant-baseline="central">pilot</text>
  <rect class="cell hl" x="552" y="44" width="128" height="26"/>
  <text class="t b hl" x="616" y="57" text-anchor="middle" dominant-baseline="central">production</text>

  <!-- What each stage proves -->
  <text class="n" x="48" y="90">unit tests</text>
  <text class="n" x="48" y="106">contract tests per</text>
  <text class="n" x="48" y="122">certification script</text>

  <text class="n" x="176" y="90">the test plan on</text>
  <text class="n" x="176" y="106">its test host, field</text>
  <text class="n" x="176" y="122">by field</text>

  <text class="n" x="304" y="90">host: NIV, chip data</text>
  <text class="n" x="304" y="106">terminals: Level 3,</text>
  <text class="n" x="304" y="122">ADVT, M-TIP</text>

  <text class="n" x="432" y="90">a few merchants,</text>
  <text class="n" x="432" y="106">real cards, watched</text>
  <text class="n" x="432" y="122">closely</text>

  <text class="n" x="560" y="90">credentials earned</text>
  <text class="n" x="560" y="106">for what was</text>
  <text class="n" x="560" y="122">certified, no more</text>

  <!-- Recertification loop -->
  <path class="ln dash" d="M616,136C616,196 232,196 232,138" marker-end="url(#cp-ah)"/>
  <text class="n" x="424" y="208" text-anchor="middle">recertify: an April or October network release, a new terminal or kernel,</text>
  <text class="n" x="424" y="224" text-anchor="middle">a new transaction type or message field</text>
</svg>
