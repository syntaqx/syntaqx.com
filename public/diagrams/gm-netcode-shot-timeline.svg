<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 716">
  <defs>
    <marker id="gm-nst-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="gm-nst-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <pattern id="gm-nst-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="hatch-ln" d="M0,0V6"/></pattern>
  </defs>

  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">GM-NET-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">one shot, input to confirmation</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>

  <text class="vt" x="40" y="64">Plan view: one shot, 128-tick server</text>
  <text class="vs" x="40" y="80">Scale 1 ms = 6.5 px · timeline · values in ms · t = 0 at fire</text>

  <!-- R2: rewind cap, value unpublished -->
  <path class="ext" d="M130,157V105M590.63,157V105"/>
  <path class="dim" d="M130,110H590.63" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="360" y="106" text-anchor="middle">R2 = rewind cap [TBD] [3]</text>

  <!-- R1: rewind depth, the subject -->
  <path class="ext" d="M160,157V131"/>
  <path class="dim hl" d="M160,136H590.63" marker-start="url(#gm-nst-ah-hl)" marker-end="url(#gm-nst-ah-hl)"/>
  <text class="dt hl" x="375" y="132" text-anchor="middle">R1 = L1 + I1 + L1 + S1 = 66.25</text>

  <!-- Server lane -->
  <text class="sl ink" x="60" y="152">server</text>
  <rect class="obj fill-2" x="60" y="160" width="660" height="30"/>
  <rect class="hatch" x="60" y="160" width="70" height="30" fill="url(#gm-nst-hatch)"/>
  <path class="ctr" d="M130,154V196"/>
  <rect class="obj fill-1" x="489.06" y="160" width="101.57" height="30"/>
  <path class="ln ink" d="M133.44,184V190M184.22,184V190M235,184V190M285.94,184V190M336.72,184V190M387.5,184V190M438.28,184V190M489.06,184V190M539.84,184V190M590.63,184V190M641.41,184V190M692.19,184V190"/>
  <text class="sl ink" x="324.5" y="172" text-anchor="middle" dominant-baseline="central">simulating, hitbox history</text>
  <text class="sl ink" x="539.84" y="172" text-anchor="middle" dominant-baseline="central">buffer</text>
  <text class="sl ink" x="655.3" y="172" text-anchor="middle" dominant-baseline="central">hit test</text>
  <circle class="dot" cx="160" cy="175" r="2.5"/>
  <circle class="dot" cx="590.63" cy="175" r="2.5"/>
  <text class="sl" x="60" y="208">cap [3]</text>

  <!-- T1: one tick -->
  <path class="ext" d="M336.72,193V214M387.5,193V214"/>
  <path class="dim" d="M336.72,209H387.5" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="394" y="209" dominant-baseline="central">T1 = 7.81</text>

  <!-- Network: packets in flight -->
  <text class="sl ink" x="60" y="244">network</text>
  <path class="ln ink" d="M160,193L273.75,287" marker-end="url(#gm-nst-ah)"/>
  <path class="ln ink" d="M375.31,287L489.06,193" marker-end="url(#gm-nst-ah)"/>
  <path class="ln ink" d="M590.63,193L704.38,287" marker-end="url(#gm-nst-ah)"/>
  <text class="n" x="226" y="244">snapshot</text>
  <text class="n" x="444" y="244">shot, move number</text>
  <text class="n" x="658" y="244">result</text>
  <text class="sl ink" x="368" y="280" text-anchor="end">fire</text>

  <!-- Client lane -->
  <text class="sl ink" x="60" y="282">client</text>
  <rect class="obj fill-2" x="60" y="290" width="660" height="30"/>
  <rect class="obj fill-1" x="273.75" y="290" width="101.56" height="30"/>
  <text class="sl ink" x="324.53" y="305" text-anchor="middle" dominant-baseline="central">interp</text>
  <text class="sl ink" x="540" y="305" text-anchor="middle" dominant-baseline="central">awaiting confirmation</text>
  <circle class="dot" cx="375.31" cy="305" r="2.5"/>
  <circle class="dot" cx="704.38" cy="305" r="2.5"/>

  <!-- Chain: L1, I1, L1, S1, L1 -->
  <path class="ext" d="M160,323V355M273.75,323V355M375.31,323V390M489.06,323V355M590.63,323V355M704.38,323V390"/>
  <path class="dim" d="M160,350H273.75" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="216.88" y="346" text-anchor="middle">L1 = 17.50</text>
  <path class="dim" d="M273.75,350H375.31" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="324.53" y="346" text-anchor="middle">I1 = 15.63</text>
  <path class="dim" d="M375.31,350H489.06" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="432.19" y="346" text-anchor="middle">L1 = 17.50</text>
  <path class="dim" d="M489.06,350H590.63" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="539.84" y="346" text-anchor="middle">S1 = 15.63</text>
  <path class="dim" d="M590.63,350H704.38" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="647.5" y="346" text-anchor="middle">L1 = 17.50</text>

  <!-- C1: shot to confirmation -->
  <path class="dim" d="M375.31,385H704.38" marker-start="url(#gm-nst-ah)" marker-end="url(#gm-nst-ah)"/>
  <text class="dt" x="539.84" y="381" text-anchor="middle">C1 = L1 + S1 + L1 = 50.63</text>

  <!-- Variable table -->
  <text class="vt" x="40" y="426">Variables</text>
  <text class="vs" x="40" y="442">ms · T1 and S1 per Riot [2] · L1 and I1 illustrative [1]</text>
  <rect class="cell band" x="40" y="452" width="60" height="22"/>
  <rect class="cell band" x="100" y="452" width="520" height="22"/>
  <rect class="cell band" x="620" y="452" width="100" height="22"/>
  <text class="cap ink" x="50" y="463" dominant-baseline="central">code</text>
  <text class="cap ink" x="110" y="463" dominant-baseline="central">item</text>
  <text class="cap ink" x="710" y="463" text-anchor="end" dominant-baseline="central">value</text>
  <path class="cell" d="M40,474H720V606H40Z"/>
  <path class="ln ink" d="M100,474V606M620,474V606"/>
  <path class="ln" d="M40,496H720M40,518H720M40,540H720M40,562H720M40,584H720"/>
  <text class="t b" x="50" y="485" dominant-baseline="central">R1</text>
  <text class="t" x="110" y="485" dominant-baseline="central">rewind depth: L1 + I1 + L1 + S1</text>
  <text class="t b" x="710" y="485" text-anchor="end" dominant-baseline="central">66.25</text>
  <text class="t" x="50" y="507" dominant-baseline="central">C1</text>
  <text class="t" x="110" y="507" dominant-baseline="central">fire to confirmation: L1 + S1 + L1</text>
  <text class="t" x="710" y="507" text-anchor="end" dominant-baseline="central">50.63</text>
  <text class="t" x="50" y="529" dominant-baseline="central">L1</text>
  <text class="t" x="110" y="529" dominant-baseline="central">one-way latency: 35 / 2 [1]</text>
  <text class="t" x="710" y="529" text-anchor="end" dominant-baseline="central">17.50</text>
  <text class="t" x="50" y="551" dominant-baseline="central">I1</text>
  <text class="t" x="110" y="551" dominant-baseline="central">interpolation delay: 2 x T1, illustrative</text>
  <text class="t" x="710" y="551" text-anchor="end" dominant-baseline="central">15.63</text>
  <text class="t" x="50" y="573" dominant-baseline="central">S1</text>
  <text class="t" x="110" y="573" dominant-baseline="central">server buffering: 2 x T1 [2]</text>
  <text class="t" x="710" y="573" text-anchor="end" dominant-baseline="central">15.63</text>
  <text class="t" x="50" y="595" dominant-baseline="central">T1</text>
  <text class="t" x="110" y="595" dominant-baseline="central">server tick at 128 Hz: 1000 / 128</text>
  <text class="t" x="710" y="595" text-anchor="end" dominant-baseline="central">7.81</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="620" width="680" height="76"/>
  <text class="sl ink" x="52" y="638">notes</text>
  <text class="n" x="52" y="656">[1] L1: half of Riot's 35 ms VALORANT ping target, assuming a symmetric path. I1: two ticks, illustrative.</text>
  <text class="n" x="52" y="672">[2] Riot's model: about two server frames (half queue wait, half network buffer, one to apply and send).</text>
  <text class="n" x="52" y="688">[3] Shots older than the cap are judged at the cap or refused. Riot limits rewind; no value is published.</text>
</svg>
