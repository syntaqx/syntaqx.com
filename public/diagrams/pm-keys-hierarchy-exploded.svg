<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="0 0 760 672">
  <defs>
    <marker id="pm-ks-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>
  <!-- Title strip -->
  <path class="ln" d="M20,12H740M20,36H740"/>
  <text class="cap ink" x="30" y="24" dominant-baseline="central">PM-KEY-001</text>
  <text class="cap" x="380" y="24" text-anchor="middle" dominant-baseline="central">payment key hierarchy</text>
  <text class="cap" x="730" y="24" text-anchor="end" dominant-baseline="central">sheet 1 of 1</text>
  <text class="vt" x="40" y="64">Exploded axonometric: payment key hierarchy</text>
  <text class="vs" x="40" y="80">Not to scale · each layer encrypted under the one above</text>

  <!-- Assembly lines through the stack's outer corners, behind the plates -->
  <path class="phantom" d="M295,190V376M645,147V333"/>

  <!-- 04 protected data -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 282)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="80" height="60"/>
    <rect class="cell band" x="110" y="100" width="80" height="60"/>
    <rect class="cell band" x="200" y="100" width="80" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="370.65" r="2"/>
  <path class="leader" d="M309.5,370.65L297.5,358.65H270"/>
  <text class="sl ink" x="264" y="358.65" text-anchor="end" dominant-baseline="central">04 protected data</text>
  <text class="n" x="264" y="374.65" text-anchor="end">PIN blocks, device keys, card numbers</text>

  <!-- 03 working keys -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 220)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="80" height="60"/>
    <rect class="cell band" x="110" y="100" width="80" height="60"/>
    <rect class="cell band" x="200" y="100" width="80" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="308.65" r="2"/>
  <path class="leader" d="M309.5,308.65L297.5,296.65H270"/>
  <text class="sl ink" x="264" y="296.65" text-anchor="end" dominant-baseline="central">03 working keys</text>
  <text class="n" x="264" y="312.65" text-anchor="end">ZPK, BDK, data keys (C3, C4)</text>

  <!-- 02 key-encrypting keys -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 158)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="20" y="100" width="80" height="60"/>
    <rect class="cell band" x="110" y="100" width="80" height="60"/>
    <rect class="cell band" x="200" y="100" width="80" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="246.65" r="2"/>
  <path class="leader" d="M309.5,246.65L297.5,234.65H270"/>
  <text class="sl ink" x="264" y="234.65" text-anchor="end" dominant-baseline="central">02 key-encrypting keys</text>
  <text class="n" x="264" y="250.65" text-anchor="end">ZMK, terminal KEK, vault KEK (C2)</text>

  <!-- 01 master key -->
  <g class="iso" transform="matrix(.94 .17 -.34 .47 363 96)">
    <rect class="obj fill-2" width="300" height="200"/>
    <rect class="cell band" x="110" y="100" width="80" height="60"/>
  </g>
  <circle class="dot" cx="309.5" cy="184.65" r="2"/>
  <path class="leader" d="M309.5,184.65L297.5,172.65H270"/>
  <text class="sl ink" x="264" y="172.65" text-anchor="end" dominant-baseline="central">01 master key</text>
  <text class="n" x="264" y="188.65" text-anchor="end">LMK or MFK; clear only in the HSM</text>

  <!-- Wrapping direction -->
  <text class="sl ink" x="700" y="140" text-anchor="middle">wraps</text>
  <text class="sl ink" x="700" y="153" text-anchor="middle">down [1]</text>
  <path class="ln ink" d="M700,162V420" marker-end="url(#pm-ks-ah)"/>

  <!-- Cryptoperiods -->
  <text class="vt" x="40" y="462">Cryptoperiods [2]</text>
  <text class="vs" x="40" y="478">NIST SP 800-57 Part 1 Rev. 5, Table 1 · suggested maxima</text>
  <rect class="cell band" x="40" y="488" width="60" height="22"/>
  <rect class="cell band" x="100" y="488" width="520" height="22"/>
  <rect class="cell band" x="620" y="488" width="100" height="22"/>
  <text class="cap ink" x="50" y="499" dominant-baseline="central">code</text>
  <text class="cap ink" x="110" y="499" dominant-baseline="central">key and use</text>
  <text class="cap ink" x="710" y="499" text-anchor="end" dominant-baseline="central">period</text>
  <path class="cell" d="M40,510H720V576H40Z"/>
  <path class="ln ink" d="M100,510V576M620,510V576"/>
  <path class="ln" d="M40,532H720M40,554H720"/>
  <text class="t" x="50" y="521" dominant-baseline="central">C2</text>
  <text class="t" x="110" y="521" dominant-baseline="central">key-encrypting (key-wrapping) key, wrapping use</text>
  <text class="t" x="710" y="521" text-anchor="end" dominant-baseline="central">&lt; 2 years</text>
  <text class="t" x="50" y="543" dominant-baseline="central">C3</text>
  <text class="t" x="110" y="543" dominant-baseline="central">data key, encrypting use (originator-usage period)</text>
  <text class="t" x="710" y="543" text-anchor="end" dominant-baseline="central">&lt; 2 years</text>
  <text class="t" x="50" y="565" dominant-baseline="central">C4</text>
  <text class="t" x="110" y="565" dominant-baseline="central">data key, decrypting use (recipient-usage period)</text>
  <text class="t" x="710" y="565" text-anchor="end" dominant-baseline="central">&lt; C3 + 3 yrs</text>

  <!-- Notes -->
  <rect class="note-box" x="40" y="592" width="680" height="60"/>
  <text class="sl ink" x="52" y="610">notes</text>
  <text class="n" x="52" y="628">[1] Each rotation touches only the layer below: a new KEK re-wraps data keys, a new data key re-encrypts data.</text>
  <text class="n" x="52" y="644">[2] NIST's general suggestions; PCI DSS 3.7.4 asks for a defined cryptoperiod per key type, and it may be shorter.</text>
</svg>
