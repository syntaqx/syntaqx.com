  <text class="nt" x="50" y="105">TYPE, AND IT MAY BE SHORTER.</text>
  <text class="nt" x="50" y="122">NOT TO SCALE. LAYERS SEPARATED ALONG THE STACK AXIS; PLATE CONTENTS ARE SCHEMATIC.</text>
