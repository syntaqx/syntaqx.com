  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">EACH LAYER IS ENCRYPTED UNDER THE ONE ABOVE. A ROTATION TOUCHES ONLY THE LAYER BELOW: A NEW KEK RE-WRAPS DATA</text>
  <text class="nt" x="50" y="75">KEYS, A NEW DATA KEY RE-ENCRYPTS DATA.</text>
