<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <marker id="pr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="pr-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="pr-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="40" y="30">routing a card payment</text>
  <text class="cap hl" x="680" y="30" text-anchor="end">primary route</text>

  <!-- Checkout into the router -->
  <rect class="cell" x="40" y="122" width="100" height="26"/>
  <text class="t" x="90" y="135" text-anchor="middle" dominant-baseline="central">checkout</text>
  <path class="ln hl" d="M140,135H188" marker-end="url(#pr-ah-hl)"/>

  <!-- The router: rules, health, vault -->
  <rect class="frame" x="190" y="56" width="200" height="158"/>
  <rect class="cell band" x="190" y="56" width="200" height="24"/>
  <text class="cap ink" x="202" y="68" dominant-baseline="central">router</text>
  <rect class="cell" x="190" y="80" width="200" height="44"/>
  <text class="t" x="202" y="95" dominant-baseline="central">rules</text>
  <text class="n" x="202" y="112" dominant-baseline="central">BIN, cost, region, contract</text>
  <rect class="cell" x="190" y="124" width="200" height="44"/>
  <text class="t" x="202" y="139" dominant-baseline="central">health</text>
  <text class="n" x="202" y="156" dominant-baseline="central">approval rate, latency, errors</text>
  <rect class="cell" x="190" y="168" width="200" height="46"/>
  <text class="t" x="202" y="184" dominant-baseline="central">vault</text>
  <text class="n" x="202" y="201" dominant-baseline="central">tokens any route can use</text>

  <!-- Routes out -->
  <path class="ln hl" d="M390,130C452,130 456,87 518,87" marker-end="url(#pr-ah-hl)"/>
  <path class="ln dash" d="M390,146C452,146 456,147 518,147" marker-end="url(#pr-ah)"/>
  <path class="ln ink" d="M390,168C452,168 456,207 518,207" marker-end="url(#pr-ah-ink)"/>

  <!-- Processors -->
  <rect class="cell hl" x="520" y="74" width="160" height="26"/>
  <text class="t hl" x="600" y="87" text-anchor="middle" dominant-baseline="central">processor A</text>
  <text class="n" x="600" y="62" text-anchor="middle">best cost and approval rate</text>
  <rect class="cell" x="520" y="134" width="160" height="26"/>
  <text class="t" x="600" y="147" text-anchor="middle" dominant-baseline="central">processor B</text>
  <text class="n" x="600" y="176" text-anchor="middle">failover, once A's outcome is known</text>
  <rect class="cell" x="520" y="194" width="160" height="26"/>
  <text class="t" x="600" y="207" text-anchor="middle" dominant-baseline="central">debit network</text>
  <text class="n" x="600" y="236" text-anchor="middle">US debit: the merchant may choose it</text>

  <!-- Settlement into one ledger -->
  <path class="ln" d="M680,87H700V269H682" marker-end="url(#pr-ah)"/>
  <path class="ln" d="M680,147H700"/>
  <path class="ln" d="M680,207H700"/>
  <rect class="cell" x="520" y="256" width="160" height="26"/>
  <text class="t" x="600" y="269" text-anchor="middle" dominant-baseline="central">one ledger</text>
  <text class="n" x="508" y="269" text-anchor="end" dominant-baseline="central">every settlement file, reconciled daily</text>
</svg>
