  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE TENANT STAYS THE ISOLATION BOUNDARY; THE TREE SITS INSIDE IT AND NEVER CROSSES INTO ANOTHER TENANT.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">AN OVERRIDE IS STORED ON THE NODE THAT HAS IT, NEVER COPIED INTO CHILDREN, SO A CHANGE AT THE TOP REACHES THEM.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">A PARENT'S REPORT SUMS ITS SUBTREE'S ENTRIES, EACH TAGGED WITH ITS LEAF NODE, SO EVERY LEVEL'S TOTALS MATCH.</text>
  <rect class="nb" x="32" y="104.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="112.5" text-anchor="middle">4</text>
  <text class="nt" x="50" y="113">A ROLE GRANTED ON ONE REGION COVERS THAT REGION AND ITS BRANCHES (ACCENT), AND NOTHING BESIDE IT.</text>
  <text class="nt" x="50" y="130">NOT TO SCALE. LEVELS SEPARATED ALONG THE TREE AXIS; PLATE CONTENTS ARE SCHEMATIC.</text>
