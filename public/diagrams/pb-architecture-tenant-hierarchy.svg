  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE TENANT STAYS THE ISOLATION BOUNDARY; THE TREE SITS INSIDE IT AND NEVER CROSSES INTO ANOTHER</text>
  <text class="nt" x="50" y="75">TENANT.</text>
  <rect class="nb" x="31" y="82.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="92" text-anchor="middle">2</text>
  <text class="nt" x="50" y="92">AN OVERRIDE IS STORED ON THE NODE THAT HAS IT, NEVER COPIED INTO CHILDREN, SO A CHANGE AT THE TOP</text>
  <text class="nt" x="50" y="105">REACHES THEM.</text>
  <rect class="nb" x="31" y="112.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="122" text-anchor="middle">3</text>
  <text class="nt" x="50" y="122">A PARENT'S REPORT SUMS ITS SUBTREE'S ENTRIES, EACH TAGGED WITH ITS LEAF NODE, SO EVERY LEVEL'S TOTALS</text>
  <text class="nt" x="50" y="135">MATCH.</text>
  <rect class="nb" x="31" y="142.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="152" text-anchor="middle">4</text>
  <text class="nt" x="50" y="152">A ROLE GRANTED ON ONE REGION COVERS THAT REGION AND ITS BRANCHES (ACCENT), AND NOTHING BESIDE IT.</text>
  <text class="nt" x="50" y="169">NOT TO SCALE. LEVELS SEPARATED ALONG THE TREE AXIS; PLATE CONTENTS ARE SCHEMATIC.</text>
