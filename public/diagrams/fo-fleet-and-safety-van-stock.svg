<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250">
  <defs>
    <marker id="fo-fs-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-fs-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Replenish loop -->
  <path class="ln dash" d="M680,70C680,26 290,26 290,68" marker-end="url(#fo-fs-ah)"/>
  <text class="n" x="485" y="24" text-anchor="middle">restock from usage or below minimum</text>

  <!-- Locations -->
  <rect class="cell" x="30" y="70" width="110" height="30"/>
  <text class="t" x="85" y="85" text-anchor="middle" dominant-baseline="central">supplier</text>
  <path class="ln" d="M140,85H208" marker-end="url(#fo-fs-ah)"/>
  <text class="n" x="174" y="62" text-anchor="middle">receipt</text>

  <rect class="cell" x="210" y="70" width="150" height="30"/>
  <text class="t" x="285" y="85" text-anchor="middle" dominant-baseline="central">branch warehouse</text>
  <path class="ln hl" d="M360,85H418" marker-end="url(#fo-fs-ah-hl)"/>
  <text class="n hl" x="389" y="62" text-anchor="middle">transfer</text>

  <rect class="cell hl" x="420" y="70" width="130" height="30"/>
  <text class="t hl b" x="485" y="85" text-anchor="middle" dominant-baseline="central">van (a warehouse)</text>
  <path class="ln hl" d="M550,85H618" marker-end="url(#fo-fs-ah-hl)"/>
  <text class="n hl" x="584" y="62" text-anchor="middle">used</text>

  <rect class="cell" x="620" y="70" width="120" height="30"/>
  <text class="t" x="680" y="85" text-anchor="middle" dominant-baseline="central">on a visit</text>

  <!-- Returns -->
  <path class="ln dash" d="M450,100C450,146 310,146 310,102" marker-end="url(#fo-fs-ah)"/>
  <text class="n" x="380" y="156" text-anchor="middle">return, damaged, swap</text>

  <!-- Ledger -->
  <path class="ln dash" d="M240,100V198M520,100V198M680,100V198"/>
  <text class="n" x="528" y="176">count, adjust</text>
  <rect class="cell band" x="30" y="200" width="710" height="30"/>
  <text class="t b" x="385" y="215" text-anchor="middle" dominant-baseline="central">inventory journal: one row per movement, never edited</text>
</svg>
