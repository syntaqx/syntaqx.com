<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196">
  <defs>
    <marker id="fo-ccs-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ccs-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="30" y="40">checked at send time, in this order</text>

  <!-- The happy path -->
  <rect class="cell" x="30" y="52" width="100" height="26"/>
  <text class="t" x="80" y="65" text-anchor="middle" dominant-baseline="central">message due</text>
  <rect class="cell" x="150" y="52" width="100" height="26"/>
  <text class="t" x="200" y="65" text-anchor="middle" dominant-baseline="central">job unchanged?</text>
  <rect class="cell" x="270" y="52" width="100" height="26"/>
  <text class="t" x="320" y="65" text-anchor="middle" dominant-baseline="central">consent ok?</text>
  <rect class="cell" x="390" y="52" width="100" height="26"/>
  <text class="t" x="440" y="65" text-anchor="middle" dominant-baseline="central">send window?</text>
  <rect class="cell" x="510" y="52" width="100" height="26"/>
  <text class="t" x="560" y="65" text-anchor="middle" dominant-baseline="central">render, link</text>
  <rect class="cell hl" x="630" y="52" width="100" height="26"/>
  <text class="t hl b" x="680" y="65" text-anchor="middle" dominant-baseline="central">hand off</text>

  <path class="ln hl" d="M130,65H149" marker-end="url(#fo-ccs-ah-hl)"/>
  <path class="ln hl" d="M250,65H269" marker-end="url(#fo-ccs-ah-hl)"/>
  <path class="ln hl" d="M370,65H389" marker-end="url(#fo-ccs-ah-hl)"/>
  <path class="ln hl" d="M490,65H509" marker-end="url(#fo-ccs-ah-hl)"/>
  <path class="ln hl" d="M610,65H629" marker-end="url(#fo-ccs-ah-hl)"/>

  <!-- Exits -->
  <path class="ln dash" d="M200,78V108" marker-end="url(#fo-ccs-ah)"/>
  <path class="ln dash" d="M320,78V108" marker-end="url(#fo-ccs-ah)"/>
  <path class="ln dash" d="M440,78V108" marker-end="url(#fo-ccs-ah)"/>
  <path class="ln dash" d="M560,78V108" marker-end="url(#fo-ccs-ah)"/>
  <path class="ln dash" d="M680,78V108" marker-end="url(#fo-ccs-ah)"/>

  <rect class="cell ghost" x="150" y="110" width="100" height="24"/>
  <text class="t dim" x="200" y="122" text-anchor="middle" dominant-baseline="central">drop: stale</text>
  <rect class="cell ghost" x="270" y="110" width="100" height="24"/>
  <text class="t dim" x="320" y="122" text-anchor="middle" dominant-baseline="central">suppress</text>
  <rect class="cell ghost" x="390" y="110" width="100" height="24"/>
  <text class="t dim" x="440" y="122" text-anchor="middle" dominant-baseline="central">defer</text>
  <rect class="cell ghost" x="510" y="110" width="100" height="24"/>
  <text class="t dim" x="560" y="122" text-anchor="middle" dominant-baseline="central">fallback text</text>
  <rect class="cell ghost" x="630" y="110" width="100" height="24"/>
  <text class="t dim" x="680" y="122" text-anchor="middle" dominant-baseline="central">retry or stop</text>

  <text class="n" x="200" y="152" text-anchor="middle">cancelled, moved</text>
  <text class="n" x="320" y="152" text-anchor="middle">STOP, no opt-in</text>
  <text class="n" x="440" y="152" text-anchor="middle">quiet hours</text>
  <text class="n" x="560" y="152" text-anchor="middle">missing locale</text>
  <text class="n" x="680" y="152" text-anchor="middle">provider error</text>

  <text class="n hl" x="730" y="184" text-anchor="end">every outcome, sent or not, is written to the message log</text>
</svg>
