  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE LIMIT, TO KEEP THE DRAWING SHORT; THE CHAPTER'S DEFAULT IS 25 AND ITS MAXIMUM 100.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">OPAQUE TO CLIENTS; THE SERVER READS IT AS WHERE (CREATED_AT, ID) &lt; K1, WHICH AN INDEX ANSWERS ON ANY PAGE.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">THE OFFSET WALK RETURNS THE SAME ROW TWICE: THE NEW ROW SHIFTED EVERY ROW DOWN ONE. A DELETE DOES THE OPPOSITE</text>
  <text class="nt" x="50" y="109">AND SKIPS A ROW. THE CURSOR WALK IS IMMUNE TO BOTH BECAUSE IT NEVER COUNTS.</text>
  <text class="nt" x="50" y="126">NOT TO SCALE, ONE CELL PER ROW. VALUES AND FORMULAS ARE IN THE TABLE.</text>
