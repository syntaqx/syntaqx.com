  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">ILLUSTRATIVE LIMIT, TO KEEP THE DRAWING SHORT; THE CHAPTER'S DEFAULT IS 25 AND ITS MAXIMUM 100.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">OPAQUE TO CLIENTS; THE SERVER READS IT AS WHERE (CREATED_AT, ID) &lt; K1, WHICH AN INDEX ANSWERS ON ANY</text>
  <text class="nt" x="50" y="92">PAGE.</text>
  <rect class="nb" x="31" y="99.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="109" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">THE OFFSET WALK RETURNS THE SAME ROW TWICE: THE NEW ROW SHIFTED EVERY ROW DOWN ONE. A DELETE DOES</text>
  <text class="nt" x="50" y="122">THE OPPOSITE AND SKIPS A ROW. THE CURSOR WALK IS IMMUNE TO BOTH BECAUSE IT NEVER COUNTS.</text>
  <text class="nt" x="50" y="139">NOT TO SCALE, ONE CELL PER ROW. VALUES AND FORMULAS ARE IN THE TABLE.</text>
