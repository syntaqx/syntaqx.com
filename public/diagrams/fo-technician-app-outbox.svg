<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <defs>
    <marker id="fo-ta-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-ta-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Zones -->
  <rect class="zone" x="20" y="30" width="300" height="250"/>
  <text class="cap" x="36" y="50">on the device</text>
  <rect class="zone" x="420" y="30" width="320" height="250"/>
  <text class="cap" x="436" y="50">on the server</text>

  <!-- Device -->
  <rect class="cell" x="40" y="66" width="260" height="26"/>
  <text class="t" x="170" y="79" text-anchor="middle" dominant-baseline="central">tap Complete, no signal</text>
  <path class="ln" d="M170,92V114" marker-end="url(#fo-ta-ah)"/>
  <rect class="cell" x="40" y="116" width="260" height="26"/>
  <text class="t" x="170" y="129" text-anchor="middle" dominant-baseline="central">one write: local row + outbox</text>
  <path class="ln" d="M170,142V164" marker-end="url(#fo-ta-ah)"/>
  <rect class="cell hl" x="40" y="166" width="260" height="26"/>
  <text class="t hl b" x="170" y="179" text-anchor="middle" dominant-baseline="central">outbox: #41 #42 #43, in order</text>
  <path class="ln dash" d="M170,192V214" marker-end="url(#fo-ta-ah)"/>
  <rect class="cell ghost" x="40" y="216" width="260" height="26"/>
  <text class="t dim" x="170" y="229" text-anchor="middle" dominant-baseline="central">screen shows: 3 waiting to sync</text>

  <!-- Replay -->
  <path class="ln hl" d="M300,179C370,179 370,79 438,79" marker-end="url(#fo-ta-ah-hl)"/>
  <text class="n hl" x="370" y="120" text-anchor="middle">replay</text>
  <text class="n hl" x="370" y="134" text-anchor="middle">in order</text>

  <!-- Server -->
  <rect class="cell" x="440" y="66" width="280" height="26"/>
  <text class="t" x="580" y="79" text-anchor="middle" dominant-baseline="central">skip ids already applied</text>
  <path class="ln" d="M580,92V114" marker-end="url(#fo-ta-ah)"/>
  <rect class="cell" x="440" y="116" width="280" height="26"/>
  <text class="t" x="580" y="129" text-anchor="middle" dominant-baseline="central">compare base version, check rules</text>
  <path class="ln hl" d="M580,142C580,154 484,154 484,164" marker-end="url(#fo-ta-ah-hl)"/>
  <path class="ln" d="M580,142V164" marker-end="url(#fo-ta-ah)"/>
  <path class="ln" d="M580,142C580,154 676,154 676,164" marker-end="url(#fo-ta-ah)"/>
  <rect class="cell hl" x="440" y="166" width="88" height="26"/>
  <text class="t hl" x="484" y="179" text-anchor="middle" dominant-baseline="central">applied</text>
  <rect class="cell" x="536" y="166" width="88" height="26"/>
  <text class="t" x="580" y="179" text-anchor="middle" dominant-baseline="central">appended</text>
  <rect class="cell band" x="632" y="166" width="88" height="26"/>
  <text class="t b" x="676" y="179" text-anchor="middle" dominant-baseline="central">conflict</text>
  <path class="ln" d="M676,192V214" marker-end="url(#fo-ta-ah)"/>
  <rect class="cell band" x="600" y="216" width="120" height="26"/>
  <text class="t" x="660" y="229" text-anchor="middle" dominant-baseline="central">review queue</text>

  <!-- Ack -->
  <path class="ln dash" d="M484,192V262H170V244" marker-end="url(#fo-ta-ah)"/>
  <text class="n" x="205" y="256" text-anchor="middle">ack: drop from outbox, refresh</text>
</svg>
