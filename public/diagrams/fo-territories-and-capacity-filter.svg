<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270">
  <defs>
    <marker id="fo-tc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- The funnel: each row removes resources -->
  <rect class="cell ghost" x="60" y="20" width="560" height="26"/>
  <text class="t dim" x="340" y="33" text-anchor="middle" dominant-baseline="central">every resource in the tenant</text>

  <rect class="cell" x="90" y="52" width="500" height="26"/>
  <text class="t" x="340" y="65" text-anchor="middle" dominant-baseline="central">territory: a polygon covers the address</text>

  <rect class="cell" x="120" y="84" width="440" height="26"/>
  <text class="t" x="340" y="97" text-anchor="middle" dominant-baseline="central">membership: assigned there on that date</text>

  <rect class="cell" x="150" y="116" width="380" height="26"/>
  <text class="t" x="340" y="129" text-anchor="middle" dominant-baseline="central">availability: shift, hours, absences</text>

  <rect class="cell" x="180" y="148" width="320" height="26"/>
  <text class="t" x="340" y="161" text-anchor="middle" dominant-baseline="central">eligibility: skills, level, license</text>

  <rect class="cell" x="210" y="180" width="260" height="26"/>
  <text class="t" x="340" y="193" text-anchor="middle" dominant-baseline="central">capacity: room left in the slot</text>

  <rect class="cell hl" x="230" y="212" width="220" height="26"/>
  <text class="t hl b" x="340" y="225" text-anchor="middle" dominant-baseline="central">candidates, graded</text>

  <!-- Hard versus soft -->
  <path class="ln" d="M636,52V206"/>
  <path class="ln" d="M630,52H636M630,206H636"/>
  <text class="n" x="648" y="122">hard rules:</text>
  <text class="n" x="648" y="136">pass or fail</text>
  <path class="ln hl" d="M630,225H636"/>
  <text class="n hl" x="648" y="229">soft: scored</text>

  <path class="ln dash" d="M40,33V225H226" marker-end="url(#fo-tc-ah)"/>
  <text class="n" x="48" y="258">the same filter answers the phone agent, the portal, the voice agent and the nightly batch</text>
</svg>
