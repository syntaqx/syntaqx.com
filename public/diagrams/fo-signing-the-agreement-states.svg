<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216">
  <defs>
    <marker id="fo-sta-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-sta-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Forward transitions -->
  <path class="ln" d="M90,70C90,42 265,42 265,68" marker-end="url(#fo-sta-ah)"/>
  <text class="n" x="177" y="38" text-anchor="middle">send packet</text>
  <path class="ln" d="M265,70C265,42 465,42 465,68" marker-end="url(#fo-sta-ah)"/>
  <text class="n" x="365" y="38" text-anchor="middle">every party signs</text>
  <path class="ln hl" d="M465,70C465,42 660,42 660,68" marker-end="url(#fo-sta-ah-hl)"/>
  <text class="n hl" x="562" y="38" text-anchor="middle">deadline passes</text>

  <!-- States -->
  <rect class="cell" x="40" y="70" width="100" height="26"/>
  <text class="t" x="90" y="83" text-anchor="middle" dominant-baseline="central">draft</text>
  <rect class="cell" x="190" y="70" width="150" height="26"/>
  <text class="t" x="265" y="83" text-anchor="middle" dominant-baseline="central">out for signature</text>
  <rect class="cell band" x="390" y="70" width="150" height="26"/>
  <text class="t b" x="465" y="83" text-anchor="middle" dominant-baseline="central">signed, window open</text>
  <rect class="cell hl" x="600" y="70" width="120" height="26"/>
  <text class="t hl b" x="660" y="83" text-anchor="middle" dominant-baseline="central">active</text>

  <!-- What active starts -->
  <text class="n" x="660" y="116" text-anchor="middle">recurring billing starts</text>
  <text class="n" x="660" y="132" text-anchor="middle">commission is earned</text>

  <!-- Failure paths -->
  <path class="ln" d="M265,96V148" marker-end="url(#fo-sta-ah)"/>
  <text class="n" x="258" y="126" text-anchor="end">declined, expired</text>
  <path class="ln" d="M465,96V148" marker-end="url(#fo-sta-ah)"/>
  <text class="n" x="458" y="126" text-anchor="end">cancelled in window</text>

  <rect class="cell ghost end" x="190" y="150" width="150" height="26"/>
  <text class="t dim" x="265" y="163" text-anchor="middle" dominant-baseline="central">void</text>
  <rect class="cell ghost end" x="390" y="150" width="150" height="26"/>
  <text class="t dim" x="465" y="163" text-anchor="middle" dominant-baseline="central">cancelled</text>

  <text class="n" x="265" y="198" text-anchor="middle">no customer created</text>
  <text class="n" x="465" y="198" text-anchor="middle">refund in 10 business days</text>
</svg>
