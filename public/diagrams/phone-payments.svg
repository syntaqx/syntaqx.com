<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250">
  <defs>
    <marker id="ph-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="ph-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ink" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="ph-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <text class="cap" x="40" y="22">an agent-assisted phone payment</text>
  <text class="cap hl" x="680" y="22" text-anchor="end">real digits</text>

  <!-- Caller into the masking service -->
  <rect class="cell" x="40" y="104" width="110" height="26"/>
  <text class="t" x="95" y="117" text-anchor="middle" dominant-baseline="central">caller</text>
  <text class="n" x="95" y="148" text-anchor="middle">keys the card</text>
  <path class="ln hl" d="M150,117H218" marker-end="url(#ph-ah-hl)"/>
  <rect class="cell hl" x="220" y="104" width="130" height="26"/>
  <text class="t hl" x="285" y="117" text-anchor="middle" dominant-baseline="central">masking service</text>
  <text class="n" x="285" y="148" text-anchor="middle">in the call path</text>

  <!-- Flat tones to agent and recorder -->
  <path class="ln" d="M285,104C285,70 360,62 418,62" marker-end="url(#ph-ah)"/>
  <path class="ln" d="M285,130C285,166 360,176 418,176" marker-end="url(#ph-ah)"/>
  <text class="n" x="300" y="80">flat tones</text>
  <text class="n" x="300" y="166">flat tones</text>
  <rect class="cell" x="420" y="49" width="120" height="26"/>
  <text class="t" x="480" y="62" text-anchor="middle" dominant-baseline="central">agent</text>
  <text class="n" x="480" y="93" text-anchor="middle">sees **** filling in</text>
  <rect class="cell" x="420" y="163" width="120" height="26"/>
  <text class="t" x="480" y="176" text-anchor="middle" dominant-baseline="central">call recorder</text>
  <text class="n" x="480" y="207" text-anchor="middle">nothing to protect</text>

  <!-- Digits out of band to the vault, token to the platform -->
  <path class="ln hl" d="M350,117H578" marker-end="url(#ph-ah-hl)"/>
  <text class="n hl" x="464" y="132" text-anchor="middle">out of band</text>
  <rect class="cell hl end" x="580" y="104" width="100" height="26"/>
  <text class="t hl" x="630" y="117" text-anchor="middle" dominant-baseline="central">card vault</text>
  <path class="ln ink" d="M630,130V196" marker-end="url(#ph-ah-ink)"/>
  <text class="n" x="638" y="166">token,</text>
  <text class="n" x="638" y="181">last four</text>
  <rect class="cell" x="580" y="198" width="100" height="26"/>
  <text class="t" x="630" y="211" text-anchor="middle" dominant-baseline="central">platform</text>
</svg>
