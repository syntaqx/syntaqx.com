<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210">
  <defs>
    <marker id="fo-paw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
    <marker id="fo-paw-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah hl" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Sender -->
  <text class="cap" x="40" y="30">the platform sending</text>
  <rect class="cell hl" x="40" y="44" width="150" height="26"/>
  <text class="t hl" x="115" y="57" text-anchor="middle" dominant-baseline="central">write + outbox row</text>
  <rect class="cell" x="230" y="44" width="100" height="26"/>
  <text class="t" x="280" y="57" text-anchor="middle" dominant-baseline="central">relay</text>
  <rect class="cell hl" x="370" y="44" width="140" height="26"/>
  <text class="t hl" x="440" y="57" text-anchor="middle" dominant-baseline="central">sign, POST</text>
  <rect class="cell ghost" x="550" y="44" width="170" height="26"/>
  <text class="t dim" x="635" y="57" text-anchor="middle" dominant-baseline="central">retry with backoff</text>
  <path class="ln hl" d="M190,57H228" marker-end="url(#fo-paw-ah-hl)"/>
  <path class="ln hl" d="M330,57H368" marker-end="url(#fo-paw-ah-hl)"/>
  <path class="ln dash" d="M510,57H548" marker-end="url(#fo-paw-ah)"/>
  <path class="ln dash" d="M635,44C635,20 470,20 470,42" marker-end="url(#fo-paw-ah)"/>
  <text class="n" x="552" y="24" text-anchor="middle">non-2xx: try again</text>
  <text class="n" x="635" y="86" text-anchor="middle">then disable, notify</text>
  <text class="n" x="115" y="86" text-anchor="middle">one transaction</text>

  <!-- Receiver -->
  <path class="ln hl" d="M440,70V106H115V136" marker-end="url(#fo-paw-ah-hl)"/>
  <text class="cap" x="40" y="128">the receiver</text>
  <rect class="cell hl" x="40" y="138" width="150" height="26"/>
  <text class="t hl" x="115" y="151" text-anchor="middle" dominant-baseline="central">verify signature</text>
  <rect class="cell hl" x="230" y="138" width="140" height="26"/>
  <text class="t hl" x="300" y="151" text-anchor="middle" dominant-baseline="central">dedupe event id</text>
  <rect class="cell hl" x="410" y="138" width="120" height="26"/>
  <text class="t hl" x="470" y="151" text-anchor="middle" dominant-baseline="central">return 2xx</text>
  <rect class="cell" x="570" y="138" width="150" height="26"/>
  <text class="t" x="645" y="151" text-anchor="middle" dominant-baseline="central">process from queue</text>
  <path class="ln hl" d="M190,151H228" marker-end="url(#fo-paw-ah-hl)"/>
  <path class="ln hl" d="M370,151H408" marker-end="url(#fo-paw-ah-hl)"/>
  <path class="ln" d="M530,151H568" marker-end="url(#fo-paw-ah)"/>
  <text class="n" x="115" y="182" text-anchor="middle">reject stale timestamps</text>
  <text class="n" x="300" y="182" text-anchor="middle">duplicates are normal</text>
  <text class="n" x="470" y="182" text-anchor="middle">before real work</text>
  <text class="n" x="645" y="182" text-anchor="middle">order not guaranteed</text>
</svg>
