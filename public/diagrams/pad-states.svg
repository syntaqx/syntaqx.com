  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="32" y="53.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="61.5" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE PAYOR GETS THE CONFIRMATION AT LEAST N1 BEFORE THE FIRST DEBIT, UNLESS THEY WAIVE OR SHORTEN IT.</text>
  <rect class="nb" x="32" y="70.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="78.5" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">A BANK DISHONOUR, SUCH AS INSUFFICIENT FUNDS OR A CLOSED ACCOUNT, COMES BACK BY THE NEXT BUSINESS DAY.</text>
  <rect class="nb" x="32" y="87.3" width="11" height="11"/>
  <text class="nbt" x="37.5" y="95.5" text-anchor="middle">3</text>
  <text class="nt" x="50" y="96">A CLAIM ISN'T CONTESTED INSIDE THE SYSTEM: THE PAYEE'S REMEDY IS OUTSIDE IT. AFTER P1 THE DEBIT IS FINAL.</text>
  <text class="nt" x="50" y="113">BUSINESS DAYS UNLESS NOTED. NOT TO SCALE ACROSS BREAKS. THE DRAWING CARRIES CODES; VALUES ARE IN THE TABLE.</text>
