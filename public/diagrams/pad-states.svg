  <!-- Notes -->
  <text class="nth" x="32" y="40">NOTES:</text>
  <text class="nt" x="78.6" y="40">(UNLESS OTHERWISE SPECIFIED)</text>
  <rect class="nb" x="31" y="52.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="62" text-anchor="middle">1</text>
  <text class="nt" x="50" y="62">THE PAYOR GETS THE CONFIRMATION AT LEAST N1 BEFORE THE FIRST DEBIT, UNLESS THEY WAIVE OR SHORTEN IT.</text>
  <rect class="nb" x="31" y="69.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="79" text-anchor="middle">2</text>
  <text class="nt" x="50" y="79">A BANK DISHONOUR, SUCH AS INSUFFICIENT FUNDS OR A CLOSED ACCOUNT, COMES BACK BY THE NEXT BUSINESS</text>
  <text class="nt" x="50" y="92">DAY.</text>
  <rect class="nb" x="31" y="99.3" width="13" height="13"/>
  <text class="nbt" x="37.5" y="109" text-anchor="middle">3</text>
  <text class="nt" x="50" y="109">A CLAIM ISN'T CONTESTED INSIDE THE SYSTEM: THE PAYEE'S REMEDY IS OUTSIDE IT. AFTER P1 THE DEBIT IS</text>
  <text class="nt" x="50" y="122">FINAL.</text>
  <text class="nt" x="50" y="139">BUSINESS DAYS UNLESS NOTED. NOT TO SCALE ACROSS BREAKS. THE DRAWING CARRIES CODES; VALUES ARE IN THE</text>
  <text class="nt" x="50" y="152">TABLE.</text>
