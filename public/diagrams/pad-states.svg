<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <defs>
    <marker id="pad-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8L10,5L0,9.2Z"/></marker>
  </defs>

  <!-- Timeline ruler, counted from the debit's settlement -->
  <text class="cap" x="40" y="20">personal pre-authorized debit</text>
  <text class="cap" x="680" y="20" text-anchor="end">from settlement</text>
  <path class="ln" d="M240,46H680"/>
  <path class="ln" d="M240,40V58M340,40V58M440,40V58M680,40V58"/>
  <text class="t dim" x="246" y="34">day 0</text>
  <text class="t dim" x="346" y="34">+1 bus. day</text>
  <text class="t dim" x="446" y="34">+10 bus. days</text>
  <text class="t dim" x="674" y="34" text-anchor="end">+90 days</text>

  <!-- States -->
  <rect class="cell" x="40" y="60" width="100" height="26"/>
  <text class="t" x="90" y="73" text-anchor="middle" dominant-baseline="central">confirmed</text>
  <rect class="cell" x="140" y="60" width="100" height="26"/>
  <text class="t" x="190" y="73" text-anchor="middle" dominant-baseline="central">exchanged</text>
  <rect class="cell" x="240" y="60" width="100" height="26"/>
  <text class="t" x="290" y="73" text-anchor="middle" dominant-baseline="central">settled</text>
  <rect class="cell" x="340" y="60" width="340" height="26"/>
  <text class="t" x="510" y="73" text-anchor="middle" dominant-baseline="central">available, still claimable</text>
  <rect class="cell hl end" x="580" y="104" width="100" height="26"/>
  <text class="t hl" x="630" y="117" text-anchor="middle" dominant-baseline="central">final</text>

  <text class="n" x="90" y="106" text-anchor="middle">10 days before</text>
  <text class="n" x="90" y="121" text-anchor="middle">the first debit</text>
  <text class="n" x="440" y="106" text-anchor="middle">a business PAD's</text>
  <text class="n" x="440" y="121" text-anchor="middle">claims end here</text>

  <!-- Returns -->
  <path class="ln dash" d="M290,86C290,140 290,177 318,177" marker-end="url(#pad-ah)"/>
  <text class="n" x="280" y="146" text-anchor="end">dishonour (901 NSF, 905 closed),</text>
  <text class="n" x="280" y="161" text-anchor="end">by the next business day</text>
  <path class="ln dash" d="M520,86C520,140 520,177 422,177" marker-end="url(#pad-ah)"/>
  <text class="n" x="530" y="153">reimbursement claim,</text>
  <text class="n" x="530" y="168">up to 90 calendar days</text>
  <rect class="cell ghost end" x="320" y="164" width="100" height="26"/>
  <text class="t dim" x="370" y="177" text-anchor="middle" dominant-baseline="central">returned</text>
</svg>
